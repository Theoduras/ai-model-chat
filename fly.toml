# Bot loops (Fanvue, OnlyFans, X, Telegram, Discord). Vercel serves the site and
# cannot hold a loop, so this one machine does. Never run it alongside another
# loop host: two hosts means two bots answering the same fan.
app = "ai-model-chat-bots"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
