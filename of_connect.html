<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect OnlyFans</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; display: flex; flex-direction: column;
           font: 14px -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #111; color: #eee; overflow: hidden; }
    header { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
             background: #1c1c1c; border-bottom: 1px solid #333; flex: none; }
    .lock { font-size: 0.85rem; color: #9ae6b4; }
    .url { flex: 1; font: 12px ui-monospace, monospace; color: #aaa; }
    .state { font-size: 0.75rem; color: #888; }
    .state.live::before { content: "● "; color: #4ade80; }
    button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
             border: 1px solid #444; background: #222; color: #ddd; }
    button:hover { background: #2c2c2c; }
    #stage { flex: 1; min-height: 0; display: flex; align-items: center;
             justify-content: center; background: #0a0a0a; position: relative; }
    #frame { display: block; max-width: 100%; max-height: 100%; background: #fff;
             cursor: default; }
    #veil { position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; background: #0a0a0a; color: #888;
            font-size: 0.9rem; text-align: center; padding: 30px; }
    #veil.gone { display: none; }
    footer { flex: none; padding: 7px 14px; background: #1c1c1c;
             border-top: 1px solid #333; font-size: 0.75rem; color: #888; }
    footer b { color: #ccc; }
    .done { color: #4ade80; }
    .bad { color: #fb7185; }
  </style>
</head>
<body>
  <header>
    <span class="lock">🔒</span>
    <span class="url">onlyfans.com</span>
    <span class="state" id="state">opening…</span>
    <button onclick="cancel()">Cancel</button>
  </header>
  <div id="stage">
    <img id="frame" alt="">
    <div id="veil">Starting a browser on your account's own address…</div>
  </div>
  <footer id="foot">
    <b>Sign in exactly as you would on your own laptop.</b>
    Your password goes to OnlyFans, never to us. Move the mouse and click the
    human check yourself — this window is a real browser.
  </footer>

<script>
const q = new URLSearchParams(location.search);
const persona = q.get('persona') || '';
// The relay is the same for any login page — a picture of a real browser and
// the operator's own mouse and keys going back to it. Only the site it opened
// and the routes that reach it differ, so those are read from the URL rather
// than duplicated into a second copy of this window.
const site = ['discord', 'instagram', 'reddit', 'tiktok'].includes(q.get('site')) ? q.get('site') : 'onlyfans';
const API = '/api/' + site + '/connect';
const SITES = {
  onlyfans: {host: 'onlyfans.com',
             foot: '<b>Sign in exactly as you would on your own laptop.</b> '
                 + 'Your password goes to OnlyFans, never to us. Move the mouse '
                 + 'and click the human check yourself — this window is a real browser.'},
  discord: {host: 'discord.com',
            foot: '<b>Sign in exactly as you would on your own laptop.</b> '
                + 'Her password goes to Discord, never to us. Do the human check '
                + 'and any 2FA or emailed code here — this window is a real '
                + 'browser, so Discord treats it as one.'},
  instagram: {host: 'instagram.com',
              foot: '<b>Sign in exactly as you would on your own phone.</b> '
                  + 'Her password goes to Instagram, never to us. Do the human check '
                  + 'and any 2FA or emailed code here — this window is a real '
                  + 'browser, so Instagram treats it as one.'},
  reddit: {host: 'reddit.com',
           foot: '<b>Sign in exactly as you would on your own laptop.</b> '
               + 'Her password goes to Reddit, never to us. Do the human check '
               + 'and any 2FA or emailed code here. <b>Then open her chat once, '
               + 'before closing this window</b> — chat needs a token Reddit only '
               + 'hands to the page, and without it she can post but not answer DMs.'},
  tiktok: {host: 'tiktok.com',
           foot: '<b>Sign in exactly as you would on your own phone.</b> '
               + 'Her password goes to TikTok, never to us. Do the slider check '
               + 'and any 2FA or emailed code here — this window is a real '
               + 'browser, so TikTok treats it as one.'}
};
let attempt = q.get('attempt') || '';
let timer = null, natural = {w: 0, h: 0}, lastMove = 0, finished = false;
// The browser lives in another service now, and a slow answer from it is not
// the sign-in being over. Give it a few tries before believing the worst.
let misses = 0, stalls = 0;
const GIVE_UP_AFTER = 5;

const $ = id => document.getElementById(id);
const img = $('frame');
const TITLES = {discord: 'Discord', instagram: 'Instagram', reddit: 'Reddit',
                tiktok: 'TikTok', onlyfans: 'OnlyFans'};
document.title = 'Connect ' + TITLES[site];
document.querySelector('.url').textContent = SITES[site].host;
$('foot').innerHTML = SITES[site].foot;

async function post(url, body){
  const r = await fetch(url, {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  // The status decides, not the body: a 200 whose JSON we cannot read is still
  // a request that was accepted, and must not be reported as a refusal.
  const out = await r.json().catch(() => ({}));
  return Object.assign({ok: r.ok}, out, {status: r.status});
}

async function begin(){
  if (attempt) return poll();
  // The hosted browser is made the size of this window, so the page is not
  // scaled and a click lands where it looks like it will.
  const r = await post(API + '/browser', {
    persona: persona, country: q.get('country') || '',
    width: Math.round($('stage').clientWidth),
    height: Math.round($('stage').clientHeight)});
  if (!r.ok) return fail(r.error || 'Could not open a browser.');
  attempt = r.attempt.attempt;
  poll();
}

// How long to wait before asking for the next frame. The page behind this is
// screenshotted five times a second at most, so asking twenty times a second
// only ever re-asks for a picture that is already on screen. Fast while the
// creator is doing something, slower while the page sits still, slower again
// while nobody is looking at this window.
const POLL_BUSY = 200, POLL_IDLE = 900, POLL_HIDDEN = 2500;
// Keep asking at the fast rate for a moment after every click and keystroke:
// what follows one is the frame the creator is waiting to see.
const BUSY_FOR = 1500;
let lastFrameAt = 0, busyUntil = 0, stillFor = 0;
// One poll in flight and one timer, ever. Anything that wants the picture
// sooner moves the timer rather than starting a second chain: two chains do
// not replace each other, they add up, and the window ends up asking twice as
// often every time something asks it to look now.
let polling = false;

function schedule(ms){
  if (finished) return;
  if (timer) clearTimeout(timer);
  timer = setTimeout(poll, Math.max(ms, POLL_BUSY));
}

function nextPoll(){
  if (document.hidden) return POLL_HIDDEN;
  if (Date.now() < busyUntil) return POLL_BUSY;
  // A page that has not changed for a while is a page waiting on a human --
  // an emailed code being fetched, a phone being found. Ease off until it or
  // the creator moves again.
  return stillFor > 8 ? POLL_IDLE : POLL_BUSY;
}

async function poll(){
  if (timer) { clearTimeout(timer); timer = null; }
  if (finished || polling) return;
  polling = true;
  try { await pollOnce(); } finally { polling = false; }
}

async function pollOnce(){
  let r, status = 0;
  try {
    const res = await fetch(API + '/frame?attempt=' +
      encodeURIComponent(attempt) + '&persona=' + encodeURIComponent(persona) +
      '&since=' + encodeURIComponent(lastFrameAt));
    status = res.status;
    r = await res.json();
  } catch (e) { return waiting(); }
  // 404 is the only answer that means the sign-in is really gone, and even
  // that is given a few chances: the browser service can be restarted under
  // us, and one bad second should not throw away a half-typed password.
  if (!r.ok){
    if (status !== 404 || ++misses < GIVE_UP_AFTER) return waiting();
    return fail(r.error || 'That sign-in is no longer open.');
  }
  misses = stalls = 0;
  // No frame means nothing has changed since the one on screen, not that the
  // picture is gone.
  if (r.frame){ img.src = r.frame; $('veil').classList.add('gone'); }
  const a = r.attempt || {};
  if (a.frame_at && a.frame_at !== lastFrameAt){ lastFrameAt = a.frame_at; stillFor = 0; }
  else { stillFor++; }
  natural = {w: a.width || 0, h: a.height || 0};
  const s = $('state');
  s.textContent = a.state === 'signin' ? 'live' : a.state;
  s.className = 'state' + (a.state === 'signin' ? ' live' : '');
  if (a.state === 'connected') return done(a);
  if (a.state === 'failed' || a.state === 'expired')
    return fail(a.error || 'The sign-in timed out. Start it again.');
  schedule(nextPoll());
}

// Coming back to the window is itself a reason to look again now, rather than
// showing a frame two and a half seconds old until the next slow tick.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || finished || !attempt) return;
  busyUntil = Date.now() + BUSY_FOR;
  schedule(POLL_BUSY);
});

// Keep polling, more slowly, and say so. The picture stays on screen: it is
// stale, not wrong, and a frozen frame reads better than a black rectangle.
function waiting(){
  if (finished) return;
  const s = $('state');
  s.textContent = 'reconnecting';
  s.className = 'state';
  // Back off on any kind of stall, not just the ones that count towards
  // giving up: a service answering 503 as fast as we can ask is the one case
  // where asking harder is the wrong move.
  schedule(Math.min(1200 + (stalls++ * 600), 3000));
}

function done(a){
  finished = true;
  const who = (a.result || {}).username || 'her account';
  $('foot').innerHTML = '<b class="done">Signed in as @' + who +
    '. You can close this window.</b>';
  $('state').textContent = 'signed in';
  notify();
  setTimeout(() => window.close(), 2500);
}

function fail(why){
  finished = true;
  $('veil').classList.remove('gone');
  $('veil').textContent = why;
  $('foot').innerHTML = '<b class="bad">' + why + '</b>';
  notify();
}

function notify(){
  try { if (window.opener) window.opener.postMessage({onlyfansConnect: 'done'}, '*'); }
  catch (e) {}
}

// ── Forwarding what the creator does ─────────────────────────────────────────
// Mouse movement is sent as well as clicks: the human check watches the path,
// and a pointer that only ever appears on the checkbox does not pass it.

function at(ev){
  const box = img.getBoundingClientRect();
  if (!natural.w || !box.width) return null;
  const scale = natural.w / box.width;
  return {x: (ev.clientX - box.left) * scale, y: (ev.clientY - box.top) * scale};
}

// One request in flight at a time, strictly in order. Fire-and-forget fetches
// do not arrive in the order they were sent, and a mouseup that overtakes its
// mousedown is not a click -- it releases a button that was never pressed and
// leaves the next one held down.
let outbox = [], inflight = false;

function send(kind, extra){
  if (!attempt || finished) return;
  busyUntil = Date.now() + BUSY_FOR;
  stillFor = 0;
  const item = Object.assign({kind: kind}, extra || {});
  // A path that has not been sent yet is worth less than the one behind it:
  // merge rather than queue, so a slow link drops stale movement instead of
  // building a backlog the browser then has to replay.
  const last = outbox[outbox.length - 1];
  if (kind === 'move' && last && last.kind === 'move'){
    last.points = (last.points || []).concat(item.points || []).slice(-60);
    return;
  }
  outbox.push(item);
  pump();
}

async function pump(){
  if (inflight || !outbox.length) return;
  inflight = true;
  try {
    while (outbox.length && !finished){
      const item = outbox.shift();
      let r;
      // A dropped connection is not a dead sign-in: the frame poll is watching
      // for that and says so on its own. Losing one keystroke to a blip beats
      // tearing the window down, and beats wedging the queue behind it.
      try {
        r = await post(API + '/input',
          Object.assign({attempt: attempt, persona: persona}, item));
      } catch (e) { continue; }
      if (r.retry && item.kind !== 'move'){
        // The browser is there, just busy. A keystroke is worth waiting for;
        // a mouse path is not, and is dropped by falling through.
        outbox.unshift(item);
        await new Promise(ok => setTimeout(ok, 400));
        continue;
      }
      // Anything else is dropped. Whether the sign-in is really over is the
      // frame poll's call and only its call -- it is the one that waits for a
      // few in a row before believing it, and two places deciding that
      // separately is how one bad answer ends a live login.

    }
  } finally { inflight = false; }
}

// Every point of the path is kept and sent in batches, rather than one point
// every 60ms: a hand draws a dense, uneven line, and a cursor that advances in
// a few evenly spaced hops is as clearly not a hand as one that teleports.
let path = [];

function flush(){
  if (!path.length) return;
  const points = path; path = [];
  send('move', {points: points});
}

img.addEventListener('mousemove', ev => {
  const p = at(ev); if (!p) return;
  p.t = Date.now();
  if (path.length < 60) path.push(p);
  if (p.t - lastMove < 120) return;
  lastMove = p.t;
  flush();
});
img.addEventListener('mousedown', ev => {
  flush();                              // the approach lands before the press
  const p = at(ev); if (p) send('down', p);
});
img.addEventListener('mouseup', ev => { const p = at(ev); if (p) send('up', p); });
img.addEventListener('contextmenu', ev => ev.preventDefault());
img.addEventListener('wheel', ev => { ev.preventDefault(); send('scroll', {dy: ev.deltaY}); },
                     {passive: false});

document.addEventListener('keydown', ev => {
  if (finished) return;
  if (ev.metaKey || ev.ctrlKey) return;             // leave the real browser's own shortcuts alone
  if (ev.key === 'Enter' || ev.key === 'Tab' || ev.key === 'Backspace' ||
      ev.key === 'Delete' || ev.key.startsWith('Arrow')){
    ev.preventDefault(); send('key', {key: ev.key});
  } else if (ev.key.length === 1){
    ev.preventDefault(); send('type', {text: ev.key});
  }
});

document.addEventListener('paste', ev => {
  const text = (ev.clipboardData || window.clipboardData).getData('text');
  if (!text) return;
  ev.preventDefault();
  send('type', {text: text.slice(0, 200)});
});

async function cancel(){
  finished = true;
  if (timer) clearTimeout(timer);
  await post(API + '/cancel', {persona: persona});
  notify();
  window.close();
}

window.addEventListener('beforeunload', () => { if (timer) clearTimeout(timer); });
begin();
</script>
</body>
</html>
