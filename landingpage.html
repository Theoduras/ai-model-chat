<!DOCTYPE html>
<!-- Fan-facing page: always dark, whatever theme the creator picked in the app. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Creator Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/devnav.js" defer></script>
</head>
<body class="page-landing">

  <nav>
    <div class="nav-left">
      <div class="verified">
        <div class="verified-dot">
          <i class="fa-solid fa-check text-white text-xs"></i>
        </div>
        VERIFIED CREATOR / Lillyforfun_ / Lilly - Lillith
      </div>
    </div>
  </nav>

  <div class="main-container">
    <div class="lp-content">

      <div class="headline-media">
        <div class="headline-copy">
          <h1 class="headline" id="headline">
            You only see <span class="highlight">10%</span> of me.
          </h1>
          <p class="subtext" id="subtext">The rest stays private.</p>
          <button class="cta-button" id="cta-button">SEE MORE &rarr;</button>
          <div class="secret-note" id="secret-note">
            <span>I left something for you inside.</span>
          </div>
        </div>

        <div class="cover-photo" id="cover-photo">
          <div class="silhouette">
            <div class="silhouette-head"></div>
            <div class="silhouette-body"></div>
          </div>
          <div class="cover-label" id="cover-label">COVER PHOTO</div>
        </div>
      </div>

      <div id="about" class="lp-about"></div>

      <div class="stats" id="stats">
        <div class="stat-card">
          <div class="stat-number">46+</div>
          <div class="stat-label">Photos</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">7+</div>
          <div class="stat-label">Videos</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">Daily</div>
          <div class="stat-label">Updates</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" style="font-size:1rem;">Custom Content</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" style="font-size:1rem;">ASMR/JOI</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" style="font-size:1rem;">Personal Messaging</div>
        </div>
      </div>

      <div class="gallery-area">
        <h2 class="gallery-header" id="gallery-header">A glimpse of what you're missing</h2>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>

    </div>
  </div>

  <!-- Chat drawer overlay -->
  <div class="chat-overlay" id="chat-overlay" onclick="closeChat()"></div>

  <!-- Slide-in chat drawer -->
  <div class="chat-drawer" id="chat-drawer" aria-label="Chat panel">
    <button class="drawer-close" onclick="closeChat()" aria-label="Close chat">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <iframe id="chat-iframe" title="Chat" allow="autoplay"></iframe>
  </div>

  <!-- Floating chat button -->
  <button class="chat-fab" id="chat-fab" onclick="openChat()" aria-label="Open chat">
    <i class="fa-solid fa-comment"></i>
    <span class="fab-badge" id="fab-badge" aria-hidden="true"></span>
  </button>

  <script>
    let chatOpen = false;
    let unread = 0;

    // Which model answers here is set in the dashboard (Settings -> Landing page).
    fetch('/api/landing')
      .then(r => r.ok ? r.json() : null)
      .then(d => loadChat(d && d.persona))
      .catch(() => loadChat(null));

    function loadChat(persona) {
      const frame = document.getElementById('chat-iframe');
      if (frame.src) return;
      frame.src = '/chat?embed=1&only=1&theme=dark' + (persona ? '&persona=' + encodeURIComponent(persona) : '');
    }

    function openChat() {
      chatOpen = true;
      document.getElementById('chat-drawer').classList.add('open');
      document.getElementById('chat-overlay').classList.add('open');
      document.body.classList.add('chat-is-open');
      clearBadge();
    }

    function closeChat() {
      chatOpen = false;
      document.getElementById('chat-drawer').classList.remove('open');
      document.getElementById('chat-overlay').classList.remove('open');
      document.body.classList.remove('chat-is-open');
    }

    function clearBadge() {
      unread = 0;
      const badge = document.getElementById('fab-badge');
      badge.textContent = '';
      badge.classList.remove('visible');
    }

    function showBadge() {
      if (chatOpen) return;
      unread++;
      const badge = document.getElementById('fab-badge');
      badge.textContent = unread > 9 ? '9+' : unread;
      badge.classList.add('visible');
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'new_message') showBadge();
    });

    // Show badge after initial greeting delay
    setTimeout(() => { if (!chatOpen) showBadge(); }, 4000);

    // Profile data
    fetch('/api/profile')
      .then(r => r.json())
      .then(data => {
        const headlineEl = document.getElementById('headline');
        if (headlineEl && data.headline) headlineEl.innerHTML = data.headline;

        const subtextEl = document.getElementById('subtext');
        if (subtextEl && data.subtext) subtextEl.textContent = data.subtext;

        const cta = document.getElementById('cta-button');
        if (cta) {
          if (data.cta_text) cta.textContent = data.cta_text;
          cta.onclick = () => openChat();
        } else {
          document.getElementById('cta-button').onclick = () => openChat();
        }

        const noteEl = document.getElementById('secret-note');
        if (noteEl && data.secret_note) {
          const span = noteEl.querySelector('span');
          if (span) span.textContent = data.secret_note;
        }

        const aboutEl = document.getElementById('about');
        if (aboutEl && data.about) aboutEl.textContent = data.about;

        const statsContainer = document.getElementById('stats');
        if (statsContainer && data.stats) {
          statsContainer.innerHTML = '';
          data.stats.forEach(stat => {
            const card = document.createElement('div');
            card.className = 'stat-card';
            card.innerHTML =
              (stat.number ? `<div class="stat-number">${stat.number}</div>` : '') +
              (stat.label  ? `<div class="stat-label">${stat.label}</div>`   : '');
            statsContainer.appendChild(card);
          });
        }

        const coverPhoto = document.getElementById('cover-photo');
        if (coverPhoto && (data.cover_video || data.cover_image)) {
          coverPhoto.style.background = 'none';
          if (data.cover_video) {
            coverPhoto.innerHTML = `
              <video autoplay muted loop playsinline style="width:100%;height:100%;object-fit:contain;border-radius:28px;display:block;">
                <source src="${data.cover_video}" type="video/mp4">
              </video>
              <div class="cover-label">${data.cover_label || 'COVER PHOTO'}</div>`;
          } else {
            coverPhoto.innerHTML = `
              <img src="${data.cover_image}" alt="Profile cover" style="width:100%;height:100%;object-fit:contain;border-radius:28px;display:block;">
              <div class="cover-label">${data.cover_label || 'COVER PHOTO'}</div>`;
          }
        } else {
          const cl = document.getElementById('cover-label');
          if (cl && data.cover_label) cl.textContent = data.cover_label;
        }

        const galleryHeader = document.getElementById('gallery-header');
        if (galleryHeader && data.gallery_header) galleryHeader.textContent = data.gallery_header;

        const galleryGrid = document.getElementById('gallery-grid');
        if (galleryGrid && data.gallery) {
          galleryGrid.innerHTML = '';
          data.gallery.forEach(item => {
            const div = document.createElement('div');
            div.className = 'photo' + (item.locked ? ' locked' : '');
            if (item.private) {
              div.className += ' plus-private';
              div.innerHTML = `<div style="font-size:1.1rem;margin-bottom:2px;line-height:1;">${item.label}</div><div style="color:#bae6fd;font-size:0.65rem;">Private</div>`;
            } else {
              div.innerHTML = `<div class="photo-label">${item.label}</div>`;
            }
            if (item.url) div.style.backgroundImage = `url(${item.url})`;
            galleryGrid.appendChild(div);
          });
        }
      })
      .catch(() => {
        document.getElementById('cta-button').onclick = () => openChat();
      });
  </script>

</body>
</html>
