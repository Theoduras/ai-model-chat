# Deploy the hosted sign-in browser service.
#
# This is deliberately NOT the trigger that runs on every push. A sign-in lives
# in the memory of the instance that opened it, so redeploying this service ends
# every sign-in in flight — the whole point of splitting it out of the app is
# that shipping app.py no longer does that. Its trigger is filtered to the files
# below, so it only redeploys when the browser itself changes:
#
#   of_connect.py, of_browser.py, Dockerfile, requirements.txt
#
# Setup is documented in ENVIRONMENTS.md under "The sign-in browser service".
#
#   _REGION   (default: europe-west4)
#   _SERVICE  (the app's service; this deploys ${_SERVICE}-browser)

substitutions:
  _REGION: europe-west4
  _SERVICE: ai-model-chat-dev

steps:
  # The same image the app runs — only the entrypoint differs, so there is no
  # second Dockerfile to keep in step with the first.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_SERVICE}/app:browser-$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_SERVICE}/app:browser-$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}-browser
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_SERVICE}/app:browser-$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      # Reached by the app over HTTPS with a shared token, which every route
      # but /health checks. There is no browser to drive without it.
      - --allow-unauthenticated
      - --command=gunicorn
      - --args=--bind,:8080,--workers,1,--threads,8,--timeout,0,of_browser:service()
      # One instance, always warm: the attempt store is per-process, so a second
      # instance is one that cannot see the sign-in the first one is running.
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --session-affinity
      - --memory=2Gi

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_SERVICE}/app:browser-$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
