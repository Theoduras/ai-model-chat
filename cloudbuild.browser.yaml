# Deploys ai-model-chat-dev-browser on every push to develop.
#
# The browser service was first deployed by hand, so that an app deploy could not
# kill a sign-in halfway through. That cost more than it saved: the service sat
# for days on an image older than the app, and the signing repair could not be
# fixed because the repair runs inside it.
#
# It was then handed to Cloud Run continuous deployment, configured on the
# service in the console. That put the one thing that had already gone wrong --
# whether this service is deploying at all -- back out of sight: nothing in this
# repository could see it, and nothing here could repair it. This config is that
# answer moved back into version control, where a broken deploy is readable and
# fixable from a checkout.
#
# It builds its own image rather than reusing the app's: the app's trigger has an
# inline config this repository cannot see, so there is nothing here to hook into
# and no way to know when its image is ready. Two builds per push; the build
# fingerprint in /api/diag and in the browser's /health says when the two
# services disagree.
#
# The image path is composed here in the args rather than kept whole in a
# substitution, because Cloud Build does not expand substitutions inside other
# substitutions: a $PROJECT_ID in a substitution's own value stays the literal
# text. The app's trigger builds its path the same way, for the same reason.
steps:
  # A missing :latest is the normal first build, not a failure -- --cache-from
  # only reads an image that is already local, so a pull that fails just means no
  # cache on this run.
  - name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - docker pull ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/$REPO_NAME/${_SERVICE_NAME}:latest || true

  # An image for this commit already in the registry is the same image: the
  # build is deterministic in the only thing that varies, which is the source.
  # Rebuilding it costs several minutes on every retry and every second push of
  # the same tree, which is most of them on a night spent deploying to test.
  - name: gcr.io/cloud-builders/docker
    id: Reuse
    entrypoint: sh
    args:
      - -c
      - |
        IMG=${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/$REPO_NAME/${_SERVICE_NAME}:$COMMIT_SHA
        if docker pull "$IMG" >/dev/null 2>&1; then
          echo "$IMG is already built; skipping build and push"
          touch /workspace/.reuse
        fi

  - name: gcr.io/cloud-builders/docker
    id: Build
    entrypoint: sh
    args:
      - -c
      - |
        [ -f /workspace/.reuse ] && exit 0
        docker build
          -t ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/$REPO_NAME/${_SERVICE_NAME}:$COMMIT_SHA \
          -t ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/$REPO_NAME/${_SERVICE_NAME}:latest \
          --cache-from ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/$REPO_NAME/${_SERVICE_NAME}:latest \
          -f Dockerfile .

  - name: gcr.io/cloud-builders/docker
    id: Push
    entrypoint: sh
    args:
      - -c
      - |
        [ -f /workspace/.reuse ] && exit 0
        docker push --all-tags ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/$REPO_NAME/${_SERVICE_NAME}

  # Every flag the service needs is repeated here, because this is a full
  # `run deploy` and a deploy that omits one resets it: no display means headless
  # Chrome, which Cloudflare refuses, and more than one instance means a sign-in
  # lands on a browser that is not holding it. --update-env-vars, never
  # --set-env-vars: the latter would drop ONLYFANS_BROWSER_TOKEN, SECRET_KEY and
  # the proxy template with it.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/$REPO_NAME/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_DEPLOY_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --command=/bin/sh
      - --args=/app/start.sh
      - --update-env-vars=GUNICORN_TARGET=of_browser:service()
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --session-affinity
      # Two browsers at once is the normal case, not the exception: a sign-in
      # window is open while the account's own signer page is held, and each is
      # a Chrome with a profile on a filesystem that is also this container's
      # memory. At 2Gi the second one ended the container, which reads from the
      # app as "her browser answered nothing" moments after a sign-in.
      - --cpu=2
      - --memory=4Gi
      - --quiet

substitutions:
  _SERVICE_NAME: ai-model-chat-dev-browser
  _DEPLOY_REGION: europe-west4
  _AR_HOSTNAME: europe-west4-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
timeout: 1800s
