<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undress</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/site-nav.css">
  <script src="/js/site-nav.js" defer></script>
  <style>
    .ud-scroll { flex:1; min-height:0; overflow-y:auto; }
    .ud-wrap { max-width:1280px; margin:0 auto; padding:22px 24px 80px; }
    .ud-intro { margin-bottom:16px; }
    .ud-intro h2 { margin:0 0 6px; font-size:1.15rem; }
    .ud-intro .hint { margin:0 0 12px; color:var(--text-muted); font-size:.9rem; max-width:720px; }
    .ud-card .ud-acts { position:absolute; top:6px; right:6px; display:flex; gap:6px; }
    .ud-card .ud-acts a, .ud-card .ud-acts button { padding:4px 8px; border-radius:6px; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:.75rem; cursor:pointer; text-decoration:none; }
    .ud-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .ud-bar select { padding:8px 10px; border-radius:8px; border:1px solid var(--border, #333);
      background:var(--surface, transparent); color:inherit; }
    .ud-upload-btn { padding:8px 12px; border-radius:8px; border:1px solid var(--border, #333);
      background:var(--surface, transparent); color:inherit; cursor:pointer; font-size:.9rem; }
    .ud-upload-btn:hover { background:var(--hover, #222); }
    .ud-note { margin:0 0 14px; padding:10px 14px; border-radius:8px;
      border:1px solid var(--border, #333); font-size:.85rem; }
    .ud-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:14px; }
    .ud-card { position:relative; border-radius:10px; overflow:hidden;
      border:1px solid var(--border, #333); background:var(--surface, transparent); }
    .ud-card img { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; }
    .ud-card .btn { position:absolute; left:8px; right:8px; bottom:8px; }
    .ud-pending { display:flex; align-items:center; justify-content:center; aspect-ratio:3/4; font-size:.85rem; color:var(--text-muted); padding:8px; text-align:center; background:rgba(0,0,0,0.05); }
    .ud-lb { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
    .ud-lb.on { display:flex; }
    .ud-lb img { max-width:92vw; max-height:78vh; object-fit:contain; }
    .ud-lb .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); color:#fff; border:0; font-size:2rem; width:48px; height:64px; cursor:pointer; border-radius:8px; }
    .ud-lb .x { position:absolute; top:14px; right:18px; background:none; border:0; color:#fff; font-size:2rem; cursor:pointer; }
    .ud-empty { color:var(--text-muted); font-size:.9rem; padding:40px 0; text-align:center; width:100%; grid-column:1/-1; }
  </style>
</head>
<body class="page-dashboard">
<header>
  <h1>Undress</h1>
  <div style="display:flex; align-items:center; gap:16px;">
    <nav data-site-nav="inline" class="sn-links sn-inline"></nav>
  </div>
</header>
<div class="ud-scroll"><div class="ud-wrap">
  <div class="ud-intro">
    <h2>Undress any photo</h2>
    <p class="hint">Upload an image, then click <b>Undress</b> on it and we generate an undressed version. Each undress costs <b>1 token</b>. Photos here are private to your account; download or delete them any time.</p>
    <label class="ud-upload-btn">
      Upload Photo
      <input type="file" id="ud-upload-input" accept="image/*" style="display:none;" onchange="udUpload(this)">
    </label>
  </div>
  <div class="ud-note" id="ud-note" hidden></div>
  <div class="ud-grid" id="ud-grid"></div>
</div></div>
<div class="ud-lb" id="ud-lb" onclick="if(event.target===this)udClose()">
  <button class="x" onclick="udClose()" aria-label="Close">×</button>
  <button class="nav" style="left:14px" onclick="udStep(-1)" aria-label="Previous">‹</button>
  <img id="ud-lb-img" alt="">
  <div style="display:flex; gap:10px">
    <button class="btn btn-secondary" style="padding:10px 28px" onclick="udGo(udLbId())">Undress</button>
    <a class="btn btn-secondary" style="padding:10px 20px" id="ud-lb-dl" download>Download</a>
    <button class="btn btn-secondary" style="padding:10px 20px" onclick="udDel(udLbId())">Delete</button>
  </div>
  <button class="nav" style="right:14px" onclick="udStep(1)" aria-label="Next">›</button>
</div>
<script>
function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function note(msg) { const n = el('ud-note'); n.textContent = msg || ''; n.hidden = !msg; }
async function udInit() {
  try {
    const d = await (await fetch('/api/undress/photos')).json();
    const rows = d.photos || [];
    el('ud-grid').innerHTML = rows.length ? rows.map(udCard).join('') : '<div class="ud-empty">No photos yet. Upload one to start.</div>';
  } catch (e) { note('Could not load your photos.'); }
}
function udCard(m) {
  return `<div class="ud-card" data-card="${esc(m.id)}"><img src="${esc(m.url)}" loading="lazy" alt="" data-id="${esc(m.id)}" onclick="udOpen(this)" style="cursor:zoom-in">
    <div class="ud-acts"><a href="${esc(m.url)}" download="photo-${esc(m.id)}.png" title="Download">Download</a><button type="button" onclick="udDel('${esc(m.id)}')">Delete</button></div>
    <button type="button" class="btn btn-secondary" onclick="udGo('${esc(m.id)}')">Undress</button></div>`;
}
async function udDel(id) {
  if (!id || !confirm('Delete this photo?')) return;
  try {
    const d = await (await fetch('/api/undress/photos/' + encodeURIComponent(id), { method: 'DELETE' })).json();
    if (!d.ok) return note(d.error || 'Delete failed.');
    const c = document.querySelector('[data-card="' + id + '"]');
    if (c) c.remove();
    udClose();
    if (!el('ud-grid').children.length) el('ud-grid').innerHTML = '<div class="ud-empty">No photos yet. Upload one to start.</div>';
  } catch (e) { note('Delete failed.'); }
}
async function udUpload(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const grid = el('ud-grid');
  const empty = grid.querySelector('.ud-empty');
  if (empty) empty.remove();
  const pending = document.createElement('div');
  pending.className = 'ud-card ud-pending';
  pending.innerHTML = '<span>Uploading…</span>';
  grid.prepend(pending);
  try {
    const fd = new FormData();
    fd.append('file', file);
    const d = await (await fetch('/api/media/upload', { method: 'POST', body: fd })).json();
    if (!d.ok) { pending.innerHTML = `<span>${esc(d.error || 'Upload failed.')}</span>`; return; }
    pending.outerHTML = udCard(d.media);
    note('Upload complete. Click Undress on it.');
  } catch (e) {
    pending.innerHTML = '<span>Upload error.</span>';
  }
}
async function udGo(id) {
    const grid = el('ud-grid');
  const empty = grid.querySelector('.ud-empty');
  if (empty) empty.remove();
  const pending = document.createElement('div');
  pending.className = 'ud-card ud-pending';
  pending.innerHTML = '<span>Generating…</span>';
  grid.prepend(pending);
  const fail = msg => { pending.className = 'ud-card ud-pending'; pending.innerHTML = '<span>' + esc(msg) + '</span>'; };
  try {
    const res = await fetch('/api/generate/undress', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ media: id }),
    });
    const d = await res.json();
    if (!d.ok) return fail(d.error || 'Undress failed.');
    note('Undressing — ' + d.tokens + ' token' + (d.tokens === 1 ? '' : 's') + '.');
    let job = d.result || {};
    for (let i = 0; i < 90 && job.status !== 'done' && job.status !== 'failed' && !(job.media || []).length; i++) {
      await new Promise(r => setTimeout(r, 3000));
      job = await (await fetch('/api/generate/job/' + encodeURIComponent(d.job))).json();
      job = job.job || job;
    }
    const m = (job.media || [])[0];
    if (job.status === 'failed' || !m) return fail(job.error || 'Still generating — check Studio → generations.');
    await fetch('/api/generate/keep', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keep: true, media_ids: [m.id] }),
    });
    pending.outerHTML = udCard({ id: m.id, url: m.url });
    note('Done — added to this page.');
  } catch (e) { fail('Undress failed.'); }
}
let udIdx = -1;
function udImgs() { return [...document.querySelectorAll('#ud-grid img[data-id]')]; }
function udLbId() { const i = udImgs()[udIdx]; return i ? i.dataset.id : ''; }
function udOpen(img) { udIdx = udImgs().indexOf(img); udShow(); }
function udShow() {
  const i = udImgs()[udIdx];
  if (!i) return udClose();
  el('ud-lb-img').src = i.src;
  const dl = el('ud-lb-dl'); dl.href = i.src; dl.download = 'photo-' + i.dataset.id + '.png';
  el('ud-lb').classList.add('on');
}
function udStep(d) { const n = udImgs().length; if (n) { udIdx = (udIdx + d + n) % n; udShow(); } }
function udClose() { el('ud-lb').classList.remove('on'); udIdx = -1; }
document.addEventListener('keydown', e => {
  if (udIdx < 0) return;
  if (e.key === 'Escape') udClose();
  else if (e.key === 'ArrowLeft') udStep(-1);
  else if (e.key === 'ArrowRight') udStep(1);
});
udInit();
</script>
</body>
</html>
