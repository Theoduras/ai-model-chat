<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #09090b;
            color: white;
            line-height: 1.5;
        }

        nav {
            background: white;
            border-bottom: 1px solid #e4e4e7;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .hamburger {
            font-size: 1.8rem;
            color: #18181b;
            cursor: pointer;
            display: none; /* shown only in mobile via media query */
        }

        .verified {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #18181b;
            font-weight: 600;
        }

        .verified-dot {
            width: 20px;
            height: 20px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        html, body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            min-height: 0;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .content-wrapper {
                flex-direction: row;
            }
        }

        .left-section {
            flex: 0 0 70vw;
            width: 70vw;
            max-width: 70vw;
            padding: 0.9rem 1.1rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: auto;
        }

        .right-section {
            flex: 0 0 30vw;
            width: 30vw;
            background: #18181b;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0.35rem;
            min-height: 0;
            overflow: hidden;
        }

        .headline {
            font-size: 2.9rem;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -2.5px;
            width: 100%;
        }

        .headline-media {
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            align-items: stretch;
            min-height: 280px;
        }

        .headline-text {
            flex: none;
            width: 100%;
        }

        .headline-media .cover-photo {
            flex: 1;
            height: 100%;
            max-width: none;
            width: auto;
        }

        .gallery-area {
            margin-top: 1rem;
            height: 160px;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1px 0;
            flex-shrink: 0;
        }
        .gallery-area .gallery-grid {
            flex: 1;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 3px;
            align-items: stretch;
        }

        .highlight {
            color: rgb(73, 242, 100);
        }

        .cta-button {
            width: 163px;
            margin-top: 2rem;
            background: rgb(73, 242, 100);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
        }

        .secret-note {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgb(73, 242, 100);
            font-style: italic;
        }

        .stats {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            color: #18181b;
            padding: 0.3rem 0.2rem;
            border-radius: 10px;
            text-align: center;
            flex: 1 1 30%;
            min-width: 0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 84px;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-label {
            color: #52525b;
            font-size: 0.7rem;
            font-weight: 500;
            margin-top: 1px;
            line-height: 1;
        }

        /* Cover Photo */
        .cover-photo {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #fcd34d, #b45309);
            border-radius: 28px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            overflow: hidden;
        }

        .cover-photo video,
        .cover-photo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 28px;
            display: block;
            background: #000;
        }

        .silhouette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 220px;
        }

        .silhouette-head {
            width: 110px;
            height: 110px;
            background: #451a03;
            border-radius: 50%;
            margin: 0 auto;
        }

        .silhouette-body {
            width: 160px;
            height: 160px;
            background: #78350f;
            border-radius: 50% 50% 0 0;
            margin: -40px auto 0;
        }

        .cover-label {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 24px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* Gallery - horizontal ~15vh */
        .gallery-header {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .gallery-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 3px;
            height: 100%;
            align-items: stretch;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .photo {
            flex: 1 1 0;
            height: 100%;
            min-width: 22px;
            border-radius: 12px;
            background: linear-gradient(180deg, #facc15, #92400e);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .photo:hover {
            transform: scale(1.02);
        }

        .photo-label {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.52rem;
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 9999px;
        }

        .photo.locked {
            filter: brightness(0.55) blur(3px);
        }

        .plus-private {
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.7rem;
            border: 2px dashed rgba(255,255,255,0.35);
        }

        @media (max-width: 1024px) {
            html, body {
                overflow: auto;
                height: auto;
            }

            .content-wrapper {
                display: block;
                overflow: auto;
            }

            nav {
                padding: 12px 12px;
            }

            .left-section {
                padding: 1rem;
                width: 100%;
                max-width: 100%;
                flex-direction: column;
            }

            .headline {
                font-size: 2.5rem;
            }

            .headline-media {
                flex-direction: column !important;
                min-height: auto !important;
                gap: 0.75rem;
            }

            .headline-media > div:first-child {
                width: 100% !important;
                flex: none !important;
            }

            .headline-media .cover-photo {
                width: 100% !important;
                height: 220px !important;
                flex: none !important;
                border-radius: 20px;
            }

            /* Right section becomes full-screen overlay popup on mobile */
            .right-section {
                position: fixed !important;
                top: 56px; /* below the sticky nav */
                left: 0;
                width: 100vw;
                height: calc(100vh - 56px);
                z-index: 1000;
                background: #18181b;
                padding: 0.5rem;
                display: none;
                flex-direction: column;
                overflow: hidden;
            }

            .right-section.open {
                display: flex;
            }

            .hamburger {
                display: block;
                z-index: 1001;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-left">
            <div class="hamburger"><i class="fa-solid fa-bars"></i></div>
            <div class="verified">
                <div class="verified-dot">
                    <i class="fa-solid fa-check text-white text-xs"></i>
                </div>
                VERIFIED CREATOR / Lillyforfun_ / Lilly - Lillith
            </div>
        </div>
        <!-- <a href="#" style="background:#18181b; color:white; padding:12px 28px; border-radius:9999px; text-decoration:none; font-weight:500;">
            LOG IN
        </a> -->
    </nav>

    <div class="main-container">
        <div class="content-wrapper">
            <!-- Left: Headline (one sentence, full width of its flex item) next to video, stats + gallery under -->
            <div class="left-section">
                <div class="headline-media">
                    <!-- On mobile: Headline on top, then cover image underneath, then rest below -->
                    <div style="flex: 0 0 55%; min-width: 0; display: flex; flex-direction: column; justify-content: space-evenly;">
                        <div class="headline-text" style="width: 100%;">
                            <h1 class="headline" id="headline">
                                You only see <span class="highlight">10%</span> of me.
                            </h1>
                        </div>

                        <p style="margin-top:0.6rem; font-size:1.15rem; color:#a1a1aa;" id="subtext">
                            The rest stays private.
                        </p>

                        <button class="cta-button" id="cta-button" style="width:163px; margin-top:1rem; padding:0.7rem 1.8rem; font-size:1rem;" onclick="alert('Redirecting to full profile...')">
                            SEE MORE →
                        </button>

                        <div class="secret-note" id="secret-note" style="margin-top:0.8rem;">
                            <span style="font-size:1.6rem;"></span>
                            <span>I left something for you inside.</span>
                        </div>
                    </div>

                    <!-- Cover video (will stack under headline on mobile) -->
                    <div class="cover-photo" id="cover-photo" style="flex: 1; height: 100%;">
                        <div class="silhouette">
                            <div class="silhouette-head"></div>
                            <div class="silhouette-body"></div>
                        </div>
                        <div class="cover-label" id="cover-label">COVER PHOTO</div>
                    </div>
                </div>

                <!-- About / bio (rest under cover on mobile) -->
                <div id="about" style="margin-top:0.6rem; font-size:0.82rem; color:#a1a1aa; line-height:1.25;"></div>

                <!-- Stats under cover image on mobile -->
                <div class="stats" id="stats" style="margin-top:0.6rem;">
                    <div class="stat-card">
                        <div class="stat-number">46+</div>
                        <div class="stat-label">Photos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">7+</div>
                        <div class="stat-label">Videos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">Updates every other day</div>
                        <div class="stat-label">Updates</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="font-size:1.1rem;">Custom Content</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="font-size:1.1rem;">ASMR/JOI</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="font-size:1.1rem;">Personal Messaging</div>
                    </div>
                </div>

                <!-- Gallery: full width underneath -->
                <div class="gallery-area">
                    <h2 class="gallery-header" id="gallery-header" style="font-size:0.72rem; margin:0 0 2px 0; font-weight:600;">A glimpse of what you're missing</h2>
                    <div class="gallery-grid" id="gallery-grid"></div>
                </div>
            </div>

            <!-- Right Section: Chat full height -->
            <div class="right-section" style="flex-direction:column; align-items:stretch; padding:0.35rem; min-height:0; background:#18181b;">
                <div style="flex:1; min-height:0; display:flex;">
                    <iframe src="index.html" title="Chat with Lilith" style="width:100%; height:100%; border:none; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.1); flex:1;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch dynamic content from backend
        fetch('/api/profile')
            .then(res => res.json())
            .then(data => {
                // Headline and subtext
                const headlineEl = document.getElementById('headline');
                if (headlineEl) headlineEl.innerHTML = data.headline || headlineEl.innerHTML;

                const subtextEl = document.getElementById('subtext');
                if (subtextEl) subtextEl.textContent = data.subtext || subtextEl.textContent;

                // CTA
                const cta = document.getElementById('cta-button');
                if (cta) {
                    cta.textContent = data.cta_text || cta.textContent;
                    cta.onclick = () => { window.location.href = '/'; };
                }

                // Secret note
                const noteEl = document.getElementById('secret-note');
                if (noteEl) {
                    const spans = noteEl.querySelectorAll('span');
                    if (spans.length > 1) spans[1].textContent = data.secret_note || spans[1].textContent;
                }

                // About text
                const aboutEl = document.getElementById('about');
                if (aboutEl) aboutEl.textContent = data.about || aboutEl.textContent;

                // Stats
                const statsContainer = document.getElementById('stats');
                if (statsContainer && data.stats) {
                    statsContainer.innerHTML = '';
                    data.stats.forEach(stat => {
                        const card = document.createElement('div');
                        card.className = 'stat-card';
                        card.innerHTML = `
                            ${stat.number ? `<div class="stat-number">${stat.number}</div>` : ''}
                            ${stat.label ? `<div class="stat-label">${stat.label}</div>` : ''}
                        `;
                        statsContainer.appendChild(card);
                    });
                }

                // Cover: support video or static
                const coverPhoto = document.getElementById('cover-photo');
                if (coverPhoto && (data.cover_video || data.cover_image)) {
                    coverPhoto.style.background = 'none';
                    if (data.cover_video) {
                        coverPhoto.innerHTML = `
                            <video autoplay muted loop playsinline style="width:100%; height:100%; object-fit:contain; border-radius:28px; display:block;">
                                <source src="${data.cover_video}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                            <div class="cover-label" id="cover-label">${data.cover_label || 'COVER PHOTO'}</div>
                        `;
                    } else if (data.cover_image) {
                        coverPhoto.innerHTML = `
                            <img src="${data.cover_image}" alt="Profile cover" style="width:100%; height:100%; object-fit:contain; border-radius:28px; display:block;">
                            <div class="cover-label" id="cover-label">${data.cover_label || 'COVER PHOTO'}</div>
                        `;
                    }
                } else {
                    // fallback to static label update
                    const coverLabel = document.getElementById('cover-label');
                    if (coverLabel) coverLabel.textContent = data.cover_label || coverLabel.textContent;
                }

                // Gallery header
                const galleryHeader = document.getElementById('gallery-header');
                if (galleryHeader) galleryHeader.textContent = data.gallery_header || galleryHeader.textContent;

                // Gallery items - photos in flexbox gallery
                const galleryGrid = document.getElementById('gallery-grid');
                if (galleryGrid && data.gallery) {
                    galleryGrid.innerHTML = '';
                    data.gallery.forEach(item => {
                        const photoDiv = document.createElement('div');
                        photoDiv.className = 'photo' + (item.locked ? ' locked' : '');

                        if (item.private) {
                            photoDiv.className += ' plus-private';
                            photoDiv.innerHTML = `
                                <div style="font-size:1.1rem; margin-bottom:2px; line-height:1;">${item.label}</div>
                                <div style="color:#bae6fd; font-size:0.65rem;">Private</div>
                            `;
                        } else {
                            photoDiv.innerHTML = `
                                <div class="photo-label">${item.label}</div>
                            `;
                        }
                        if (item.url) {
                            photoDiv.style.backgroundImage = `url(${item.url})`;
                        }
                        galleryGrid.appendChild(photoDiv);
                    });
                }

            })
            .catch(err => console.log('Using static content (API not available yet)', err));

        // Mobile: Right section as full-screen popup overlay (chat)
        // Automatically open on mobile. Hamburger toggles it.
        (function setupMobileChatOverlay() {
            const hamburger = document.querySelector('.hamburger');
            const rightSection = document.querySelector('.right-section');
            if (!hamburger || !rightSection) return;

            const icon = hamburger.querySelector('i');

            function isMobile() {
                return window.innerWidth <= 1024;
            }

            function updateIcon(isOpen) {
                if (!icon) return;
                if (isOpen) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-times');
                } else {
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                }
            }

            function toggleOverlay() {
                if (!isMobile()) return; // only on mobile
                const isOpen = rightSection.classList.toggle('open');
                updateIcon(isOpen);
            }

            // Attach click
            hamburger.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleOverlay();
            });

            // Auto open the overlay on mobile by default
            function initMobileOverlay() {
                if (isMobile()) {
                    rightSection.classList.add('open');
                    updateIcon(true);
                } else {
                    rightSection.classList.remove('open');
                    updateIcon(false);
                }
            }

            // Init
            initMobileOverlay();

            // Handle resize (switching between mobile/desktop)
            window.addEventListener('resize', function() {
                if (isMobile()) {
                    // keep open if it was, or ensure default open
                    if (!rightSection.classList.contains('open')) {
                        rightSection.classList.add('open');
                        updateIcon(true);
                    }
                } else {
                    rightSection.classList.remove('open');
                    updateIcon(false);
                }
            });

            // Optional: close overlay if clicking outside on mobile (but iframe may capture)
            // For simplicity we rely on hamburger to toggle
        })();
    </script>
</body>
</html>
