<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog · Velvetfunnel</title>
<meta name="description" content="Notes on personas, funnels and turning conversations into sales.">
<link rel="icon" href="/favicon.png">
<!-- Not deferred: theme.js sets data-theme before first paint, otherwise the
     page flashes dark for a user who chose light. -->
<link rel="stylesheet" href="/css/site-nav.css">
<link rel="stylesheet" href="/css/lazy.css">
<script src="/js/skeleton.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/site-nav.js" defer></script>
<script src="/js/blog-posts.js"></script>
<script src="/js/page-editor.js" defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#ff5c38;
  --bg:#0e0e0e;
  --panel:#111;
  --text:#fff;
  --text-soft:#a7a7a7;
  --text-dim:#6b6b6b;
  --field:#1c1c1c;
  --field-border:#2e2e2e;
  --hair:#ffffff26;
  --hair-strong:#ffffff55;
  --hover:#ffffff0d;
  --nav-bg:rgba(17,17,17,.6);
  --pill:#ffffff14;
  --btn-bg:#f2f0ee;
  --btn-ink:#12100f;
}
:root[data-theme="light"]{
  --bg:#f6f5f4;
  --panel:#fff;
  --text:#12100f;
  --text-soft:#5c5651;
  --text-dim:#8a837d;
  --field:#f2f0ee;
  --field-border:#dedad6;
  --hair:#12100f1f;
  --hair-strong:#12100f4d;
  --hover:#12100f0a;
  --nav-bg:rgba(255,255,255,.72);
  --pill:#12100f0f;
  --btn-bg:#12100f;
  --btn-ink:#fff;
}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased}

/* ── Nav (the pill styles live in css/site-nav.css) ── */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border-radius:9999px;border:1px solid var(--hair);background:transparent;color:var(--text-soft);
  cursor:pointer;transition:all .2s}
.theme-toggle:hover{color:var(--accent);border-color:var(--hair-strong);background:var(--hover)}
.theme-toggle svg{width:18px;height:18px}
.theme-toggle .ico-sun{display:block}
.theme-toggle .ico-moon{display:none}
:root[data-theme="light"] .theme-toggle .ico-sun{display:none}
:root[data-theme="light"] .theme-toggle .ico-moon{display:block}

/* ── Page ── */
.wrap{max-width:1100px;margin:0 auto;padding:150px 24px 96px}
.page-head{margin-bottom:34px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px}
h1{font-family:'Sora';font-weight:800;font-size:clamp(30px,5vw,46px);letter-spacing:-.02em;
  line-height:1.1}
.page-sub{margin-top:14px;color:var(--text-soft);font-size:16px;max-width:56ch;line-height:1.6}

.meta{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pill{display:inline-block;padding:5px 12px;border-radius:9999px;background:var(--pill);
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft)}
.date{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-dim)}

/* ── Featured ── */
.featured{display:grid;grid-template-columns:1.6fr 1fr;background:var(--panel);
  border:1px solid var(--hair);border-radius:18px;overflow:hidden;text-decoration:none;
  color:inherit;transition:border-color .25s ease,transform .25s ease}
.featured:hover{border-color:var(--hair-strong);transform:translateY(-2px)}
.featured-img{background:linear-gradient(135deg,#ff5c38,#ff2d78 45%,#7c3aed);min-height:320px;background-size:cover;background-position:center}
.featured-body{padding:34px;display:flex;flex-direction:column}
.featured h2{font-family:'Sora';font-weight:700;font-size:clamp(21px,2.3vw,27px);line-height:1.24;
  letter-spacing:-.01em;text-decoration:underline;text-decoration-color:transparent;
  text-underline-offset:5px;transition:text-decoration-color .2s ease}
.featured:hover h2{text-decoration-color:currentColor}
.featured p{margin-top:14px;color:var(--text-soft);font-size:14.5px;line-height:1.65}
.read{margin-top:auto;padding-top:28px}
.read span{display:inline-flex;align-items:center;gap:8px;background:var(--btn-bg);color:var(--btn-ink);
  font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:9999px;transition:transform .2s ease}
.featured:hover .read span{transform:translateX(3px)}

/* ── Grid ── */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:26px;
  text-decoration:none;color:inherit;display:flex;flex-direction:column;
  transition:border-color .25s ease,transform .25s ease}
.card:hover{border-color:var(--hair-strong);transform:translateY(-2px)}
.card h3{font-family:'Sora';font-weight:700;font-size:19px;line-height:1.3;letter-spacing:-.01em;
  text-decoration:underline;text-decoration-color:transparent;text-underline-offset:5px;
  transition:text-decoration-color .2s ease}
.card:hover h3{text-decoration-color:currentColor}
.card p{margin-top:12px;color:var(--text-soft);font-size:14px;line-height:1.6}

footer{border-top:1px solid var(--hair);padding:28px 24px;text-align:center;
  color:var(--text-dim);font-size:13px}

@media(max-width:940px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .featured{grid-template-columns:1fr}
  .featured-img{min-height:220px}
  .featured-body{padding:26px}
  .wrap{padding-top:130px}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="blog">
<header class="site-nav" id="site-nav">
  <a href="/" class="brand"><span data-sn-brand>Velvetfunnel</span><i data-sn-suffix>.app</i></a>
  <nav class="auth sn-links">
    <button class="theme-toggle" onclick="toggleTheme()" title="Light mode" aria-label="Switch to light mode">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <div class="eyebrow" data-edit-id="eyebrow">The Velvetfunnel blog</div>
    <h1 data-edit-id="h1">Personas, funnels and the craft of the sale.</h1>
    <p class="page-sub" data-edit-id="page-sub">What we learn from the conversations that convert — voice,
      pacing, photos and the moment a fan decides to buy.</p>
  </div>
  <div id="posts"></div>
</main>

<footer>&copy; <span id="yr"></span> Velvetfunnel</footer>

<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function render() {
  const posts = window.BLOG_POSTS || [];
  const host = document.getElementById('posts');
  if (!posts.length) { host.innerHTML = ''; return; }
  const [lead, ...rest] = posts;

  const meta = p => '<div class="meta"><span class="pill">' + esc(p.category) +
    '</span><span class="date">' + esc(p.date) + '</span></div>';

  host.innerHTML =
    '<a class="featured" href="/blog/' + encodeURIComponent(lead.slug) + '">' +
      '<div class="featured-img" style="background-image:url(&quot;' + esc(lead.image) + '&quot;),linear-gradient(135deg,#ff5c38,#ff2d78 45%,#7c3aed)"></div>' +
      '<div class="featured-body">' + meta(lead) +
        '<h2>' + esc(lead.title) + '</h2>' +
        '<p>' + esc(lead.excerpt) + '</p>' +
        '<div class="read"><span>Read the full article ' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>' +
      '</div></a>' +
    (rest.length ? '<div class="grid">' + rest.map(p =>
      '<a class="card" href="/blog/' + encodeURIComponent(p.slug) + '">' + meta(p) +
        '<h3>' + esc(p.title) + '</h3><p>' + esc(p.excerpt) + '</p></a>').join('') + '</div>' : '');
}

render();
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
