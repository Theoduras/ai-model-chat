<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Planner</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/js/theme.js"></script>
  <script>
    if (window.self === window.top) location.replace('/dashboard?open=' + encodeURIComponent(location.pathname + location.search));
  </script>
  <link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/lazy.css">
<script src="/js/skeleton.js"></script>
  <script src="/js/devnav.js" defer></script>
  <link rel="stylesheet" href="/css/site-nav.css">
  <script src="/js/site-nav.js" defer></script>
<style>
  .pl-rate { position:absolute; top:4px; left:4px; font-size:0.58rem; font-weight:700;
    padding:1px 5px; border-radius:5px; letter-spacing:.05em; }
  .pl-rate.is-sfw  { background:#1f9d55dd; color:#fff; }
  .pl-rate.is-nsfw { background:#d6336cdd; color:#fff; }
  .pl-rate.is-none { background:#f0932bdd; color:#fff; }
  .pl-vault-item.is-banned { opacity:.45; }
  .pl-vault-item.is-banned .pl-vault-name::after { content:' · not allowed here'; color:#d6336c; }
  .pl-slot-media { display:flex; align-items:center; gap:6px; margin:4px 0 2px;
    font-size:0.66rem; color:var(--text-muted); }
  .pl-slot-media .pl-slot-thumb { width:26px; height:26px; border-radius:5px;
    object-fit:cover; display:block; }
  .pl-slot-warn { color:#d6336c; font-weight:700; }
</style>
</head>
<body class="page-dashboard">

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <h1>Content Planner</h1>
    <span class="badge">Week</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <nav data-site-nav="inline" class="sn-links sn-inline"></nav>
    <a href="/dashboard" style="color:var(--text-muted); font-size:0.8rem; text-decoration:none;">← Dashboard</a>
  </div>
</header>

<div class="pl-scroll">
<div class="pl-wrap">

  <div class="pl-head">
    <div class="pl-head-l">
      <h2>The week</h2>
      <select id="pl-persona" onchange="plPickPersona(this.value)" aria-label="Persona"></select>
    </div>
    <div class="pl-head-r">
      <div class="pl-week">
        <button type="button" onclick="plShiftWeek(-1)" aria-label="Previous week">&lsaquo;</button>
        <span id="pl-range">—</span>
        <button type="button" onclick="plShiftWeek(1)" aria-label="Next week">&rsaquo;</button>
      </div>
      <button type="button" class="btn btn-secondary" onclick="plLoadQueue()">Refresh</button>
      <button type="button" class="btn btn-secondary" onclick="plNew()">New post</button>
      <button type="button" class="btn btn-secondary" onclick="plClearWeek(this)">Clear week</button>
      <button type="button" class="btn btn-primary" id="pl-plan-btn" onclick="plPlanOpen()">Plan the week</button>
    </div>
  </div>

  <div class="pl-planbar" id="pl-planbar" hidden>
    <span class="pl-planbar-l">Plan for</span>
    <span class="pl-chips" id="pl-plan-chans"></span>
    <label class="pl-planbar-x"><input type="checkbox" id="pl-plan-cross"> Same post everywhere</label>
    <button type="button" class="btn btn-primary" onclick="plPlan(this)">Plan it</button>
    <button type="button" class="btn btn-secondary" onclick="plPlanClose()">Cancel</button>
  </div>

  <p class="pl-state" id="pl-state">Loading…</p>
  <p class="pl-state is-off" id="pl-connect" hidden></p>
  <div class="pl-stats" id="pl-stats"></div>
  <div id="pl-bulk"></div>
  <div class="pl-grid" id="pl-grid"></div>

</div>
</div>

<div class="modal-overlay" id="pl-modal" onclick="if(event.target===this)plClose()">
  <div class="modal pl-post-modal">
    <div class="modal-header">
      <h2 id="pl-m-title">Post</h2>
      <button class="modal-close" onclick="plClose()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <p class="pl-modal-meta" id="pl-m-meta"></p>

      <div class="field" style="margin-top:14px;" id="pl-m-chans-field" hidden>
        <label>Channels</label>
        <div class="pl-chans" id="pl-m-chans"></div>
        <span class="hint" id="pl-m-chans-hint" style="margin-top:6px;"></span>
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-when-field">
        <label for="pl-m-when">When</label>
        <input type="datetime-local" id="pl-m-when">
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="pl-m-text" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <span id="pl-m-label">Post</span>
          <span class="pl-count" id="pl-m-count"></span>
        </label>
        <textarea id="pl-m-text" rows="5" oninput="plCount()"></textarea>
        <div style="margin-top:6px; display:flex; gap:6px;">
          <button type="button" class="btn-ai" id="pl-m-write" onclick="plWrite(this)">✨ Write it</button>
          <span class="pl-rating" id="pl-m-rating">
            <button type="button" class="on" data-r="" onclick="plSetRating('')" title="Whatever this persona is set to">Auto</button>
            <button type="button" data-r="sfw" onclick="plSetRating('sfw')">SFW</button>
            <button type="button" data-r="nsfw" onclick="plSetRating('nsfw')">NSFW</button>
          </span>
          <button type="button" class="btn-section-save" id="pl-m-copy" style="margin-left:0;" onclick="plCopy(this)">Copy</button>
        </div>
        <span class="hint" id="pl-m-hint" style="margin-top:6px;"></span>
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-media-field">
        <label style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <span>Media</span>
          <span class="pl-count" id="pl-m-media-note"></span>
        </label>
        <div class="pl-picked" id="pl-m-picked"></div>
        <div id="pl-m-browse" style="margin:8px 0 2px;"></div>
        <div class="pl-strip" id="pl-m-strip"></div>
        <span class="hint" id="pl-m-media-hint" style="margin-top:6px;"></span>
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-ig-field" hidden>
        <label for="pl-m-ig-kind">Where it lands on Instagram</label>
        <select id="pl-m-ig-kind" onchange="plIgKindChanged()">
          <option value="post">Feed post</option>
          <option value="story">Story</option>
          <option value="reel">Reel</option>
        </select>
        <span class="hint" id="pl-m-ig-hint" style="margin-top:6px;"></span>
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-rd-field" hidden>
        <label for="pl-m-rd-kind">How it lands on Reddit</label>
        <select id="pl-m-rd-kind" onchange="plRdKindChanged()">
          <option value="image">Image</option>
          <option value="video">Video</option>
          <option value="text">Text</option>
          <option value="link">Link</option>
        </select>
        <label style="margin-top:12px;">Subreddits</label>
        <div id="pl-m-rd-subs"></div>
        <span class="hint" id="pl-m-rd-hint" style="margin-top:6px;"></span>
        <label style="margin-top:12px;" for="pl-m-rd-stagger">Minutes between subreddits</label>
        <input type="number" id="pl-m-rd-stagger" min="0" max="240" value="20">
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-fanvue-field" hidden>
        <label for="pl-m-audience">Who sees it on Fanvue</label>
        <select id="pl-m-audience">
          <option value="followers-and-subscribers">Followers and subscribers</option>
          <option value="subscribers">Subscribers only</option>
        </select>
        <label for="pl-m-price" style="margin-top:10px;">Unlock price</label>
        <input type="number" id="pl-m-price" min="0" step="0.01" placeholder="0.00">
        <span class="hint" style="margin-top:6px;">Leave it empty for a free post.
          A price needs media behind it, and Fanvue's floor is $3.00.</span>
      </div>

      <div class="modal-footer" style="margin-top:18px;">
        <button type="button" class="btn btn-ghost" id="pl-m-cancel"
                style="color:var(--err); border-color:var(--err); margin-right:auto;"
                onclick="plCancelPost(this)">Cancel post</button>
        <button type="button" class="btn btn-ghost" id="pl-m-delete"
                style="color:var(--err); border-color:var(--err);"
                onclick="plDeletePost(this)">Delete</button>
        <button type="button" class="btn btn-ghost" onclick="plClose()">Close</button>
        <button type="button" class="btn btn-secondary" id="pl-m-now"
                onclick="plSave(this, true)">Post now</button>
        <button type="button" class="btn btn-primary" id="pl-m-save" onclick="plSave(this)">Save changes</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pl-slot-media" onclick="if(event.target===this)plSlotMediaClose()">
  <div class="modal pl-vault-modal">
    <div class="modal-header">
      <h2 id="pl-sm-title">Pick the media</h2>
      <button class="modal-close" onclick="plSlotMediaClose()" aria-label="Close">&times;</button>
    </div>
    <div class="pl-vault-bar">
      <input type="search" id="pl-sm-q" placeholder="Search by name…" oninput="plSlotMediaDraw()">
      <select id="pl-sm-rating" onchange="plSlotMediaDraw()">
        <option value="">All ratings</option>
        <option value="sfw">Safe for work</option>
        <option value="nsfw">Explicit</option>
        <option value="unrated">Unrated</option>
      </select>
    </div>
    <div class="modal-body pl-vault-body">
      <div class="pl-vault-grid" id="pl-sm-grid"></div>
      <div class="pl-vault-foot" id="pl-sm-foot"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pl-vault" onclick="if(event.target===this)plVaultClose()">
  <div class="modal pl-vault-modal">
    <div class="modal-header">
      <h2>Fanvue vault</h2>
      <button class="modal-close" onclick="plVaultClose()" aria-label="Close">&times;</button>
    </div>
    <div class="pl-vault-bar">
      <input type="search" id="pl-v-q" placeholder="Search by name…" oninput="plVaultDraw()">
      <select id="pl-v-folder" onchange="plVaultReload()"><option value="">All folders</option></select>
      <select id="pl-v-type" onchange="plVaultReload()">
        <option value="">Images and video</option>
        <option value="image">Images</option>
        <option value="video">Video</option>
      </select>
    </div>
    <div class="modal-body pl-vault-body">
      <div class="pl-vault-grid" id="pl-v-grid"></div>
      <div class="pl-vault-foot" id="pl-v-foot"></div>
    </div>
  </div>
</div>

<script>
// The caps mirror growth.POST_PLATFORMS. The server trims to them on every
// write, so this copy only decides when the counter turns red.
const PL_CAPS = { x: 280, threads: 500, fanvue: 5000, instagram: 2200, tiktok: 2200, reddit: 300 };
const PL_LABELS = { x: 'X', threads: 'Threads', fanvue: 'Fanvue', instagram: 'Instagram', tiktok: 'TikTok', reddit: 'Reddit' };
const PL_PUBLISHABLE = ['x', 'threads', 'fanvue', 'instagram'];
// The channels the week can be planned for. Mirrors growth.WEEKLY_CADENCE.
const PL_PLATFORMS = ['x', 'threads', 'fanvue', 'instagram', 'tiktok', 'reddit'];
// Mirrors growth.MEDIA_SUPPORT. The server checks it again on every write; this
// copy only decides which thumbnails are worth offering.
const PL_MEDIA = {
  x:         ['image', 'video'],
  threads:   ['image', 'video'],
  fanvue:    ['image', 'video'],
  instagram: ['image', 'video'],
  tiktok:    ['video'],
  reddit:    ['image', 'video']
};
// Where a creator connects each publishable channel, for the prompt below.
// Mirrors growth.MEDIA_SUPPORT's max. The server checks it again on every write.
const PL_MEDIA_MAX = { x: 4, threads: 20, fanvue: 20, instagram: 10, tiktok: 1, reddit: 20 };
const PL_CONNECT_AT = { x: '/xbot', threads: '/threads', fanvue: '/fanvue',
                        instagram: '/instagram', reddit: '/reddit',
                        tiktok: '/tiktok' };
// Reddit's kinds, mirroring app.RD_KINDS.
const PL_RD_KINDS = ['image', 'video', 'text', 'link'];
// Minutes between one subreddit and the next by default. Reddit's spam filters
// read a burst of near-identical submissions as exactly that.
const PL_RD_STAGGER = 20;
// Fanvue's floor for a paid post, in cents. The server checks it again.
const PL_FV_PRICE_MIN = 300;
let plConn = {};
const PL_KIND = { value: 'worth reading', tease: 'tease', cta: 'ask' };
const PL_STATUS = {
  queued: 'Waiting to go out.',
  manual: 'On the calendar as a reminder. This channel has no posting API she is '
        + 'allowed to use, so copy it out and post it yourself when the slot comes.',
  sending: 'On its way now.',
  posted: 'Posted.',
  failed: 'Failed, and a failed post is not retried — edit it and queue it fresh.',
  cancelled: 'Cancelled.'
};

let plSlug = '';
let plWeekStart = 0;      // epoch of the Monday her week starts on
let plQueue = [];         // real scheduled_posts rows for this window
let plProposed = [];      // ephemeral plan slots, never persisted
let plPlanMeta = null;
let plOpen = null;        // the card the modal is editing
let plVault = [];         // the persona's media library
let plPickedMedia = [];   // what the open editor has attached, in order
let plChans = [];         // channels ticked on a brand-new post
let plCaps = null;        // this account's plan capabilities, from /api/me
let plPlanChans = [];     // channels the next plan covers
let plRating = '';        // '', 'sfw' or 'nsfw' for the next draft
let plRemote = [];        // posts Fanvue already has booked — read-only
let plFvVault = null;     // her Fanvue vault, fetched the first time it is needed
let plFvVaultError = '';
let plFvItems = [];       // what the vault overlay has loaded
let plFvPage = 1, plFvHasMore = false, plFvLoading = false;
let plFvFolder = '', plFvType = '';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// The cadence puts posts at hours of her day, so every boundary is local.
function plDayStart(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return Math.floor(x.getTime() / 1000);
}

// A channel the plan covers. null platforms means every channel; the manual
// ones are named by no tier, so they ride with the rest of the paid set.
function plAllowed(p) {
  if (!plCaps) return true;
  if (plCaps.is_admin) return true;
  const list = plCaps.platforms;
  if (list === null || list === undefined) return true;
  return list.indexOf(p) !== -1;
}
function plAllowedPlatforms() { return PL_PLATFORMS.filter(plAllowed); }
function dayLabel(ts) {
  return new Date(ts * 1000).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
}
function hourLabel(ts) {
  const d = new Date(ts * 1000);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function rangeLabel(start) {
  const a = new Date(start * 1000), b = new Date((start + 6 * 86400) * 1000);
  const opt = { day: 'numeric', month: 'short' };
  return a.toLocaleDateString(undefined, opt) + ' – ' + b.toLocaleDateString(undefined, opt);
}
function whenText(ts) {
  const secs = ts - Math.floor(Date.now() / 1000);
  const a = Math.abs(secs);
  const s = a < 3600 ? Math.round(a / 60) + 'm'
          : a < 86400 ? Math.round(a / 3600) + 'h'
          : Math.round(a / 86400) + 'd';
  return secs >= 0 ? 'in ' + s : s + ' ago';
}
function toLocalInput(ts) {
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0') + 'T'
    + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fromLocalInput(v) {
  const t = new Date(v).getTime();
  return isNaN(t) ? 0 : Math.floor(t / 1000);
}

function statTile(label, value) {
  return '<div><div class="pl-stat-v">' + esc(value) + '</div>'
    + '<div class="pl-stat-l">' + esc(label) + '</div></div>';
}

// ── Loading ──────────────────────────────────────────────────────────────────

async function plInit() {
  plWeekStart = plDayStart(new Date());
  try {
    const me = await (await fetch('/api/me')).json();
    plCaps = { platforms: (me.capabilities || {}).platforms,
               is_admin: !!(me.is_admin || (!me.signed_in && me.is_operator)) };
  } catch (e) { plCaps = null; }
  plPlanChans = plAllowedPlatforms();
  const wanted = new URLSearchParams(location.search).get('persona') || '';
  let list = [];
  try {
    list = await (await fetch('/api/personas')).json();
  } catch (e) { /* handled below */ }
  const sel = document.getElementById('pl-persona');
  if (!Array.isArray(list) || !list.length) {
    sel.innerHTML = '<option>no personas</option>';
    document.getElementById('pl-state').textContent =
      'No personas to plan for yet. Create one in the dashboard first.';
    return;
  }
  sel.innerHTML = list.map(p =>
    '<option value="' + esc(p.slug) + '">' + esc(p.name || p.slug) + '</option>').join('');
  plSlug = list.some(p => p.slug === wanted) ? wanted : list[0].slug;
  sel.value = plSlug;
  await plLoadVault();
  plLoadQueue();
}

function plPickPersona(slug) {
  plSlug = slug;
  plFvVault = null;
  plFvVaultError = '';
  plProposed = [];
  plPlanMeta = null;
  plLoadVault();
  plLoadQueue();
}

async function plLoadVault() {
  if (!plSlug) return;
  try {
    const d = await (await fetch('/api/personas/' + encodeURIComponent(plSlug) + '/media')).json();
    plVault = (d && d.vault) || [];
  } catch (e) { plVault = []; }
}

function plMediaById(id) {
  return plVault.find(m => m.id === id)
      || (plFvVault || []).find(m => m.id === id) || null;
}

// Her own Fanvue vault is only on offer when Fanvue is the only channel ticked:
// it attaches by uuid with nothing uploaded, and that uuid means nothing to X or
// Threads, which need the file itself.
function plFanvueOnly() {
  const chans = plOpenChans();
  return chans.length === 1 && chans[0] === 'fanvue';
}

async function plFvFetch(page) {
  const q = new URLSearchParams({ persona: plSlug, page: String(page) });
  if (plFvFolder) q.set('folder', plFvFolder);
  if (plFvType) q.set('type', plFvType);
  const d = await (await fetch('/api/fanvue/media?' + q)).json();
  plFvVaultError = (d && d.error) || '';
  plFvHasMore = !!(d && d.has_more);
  return ((d && d.media) || []).map(m => ({
    id: 'fv:' + m.uuid,
    kind: String(m.mediaType || '').toLowerCase() === 'video' ? 'video' : 'image',
    thumb: m.thumb || '',
    purpose: m.name || ''
  }));
}

// Everything loaded so far, so a pick made in the overlay still resolves to a
// thumbnail once the overlay is gone.
function plFvRemember(items) {
  items.forEach(m => {
    if (!(plFvVault || []).some(x => x.id === m.id)) plFvVault.push(m);
  });
}

async function plLoadFvVault() {
  if (plFvVault || !plSlug) return;
  plFvVault = [];
  const strip = document.getElementById('pl-m-strip');
  if (strip) strip.innerHTML = skelGrid(6);
  try {
    plFvRemember(await plFvFetch(1));
  } catch (e) { plFvVaultError = 'Could not read the Fanvue vault.'; }
  plRenderMedia();
}

// ── The vault overlay ────────────────────────────────────────────────────────
// The strip under the editor shows the first page. This is the whole vault:
// folders, kinds and a name search, so a picture can be found rather than
// scrolled past.
async function plVaultOpen() {
  if (!plSlug) return;
  plFvItems = [];
  plFvPage = 1;
  document.getElementById('pl-v-q').value = '';
  document.getElementById('pl-vault').classList.add('open');
  plVaultLoadFolders();
  plVaultReload();
}

function plVaultClose() {
  document.getElementById('pl-vault').classList.remove('open');
}

async function plVaultLoadFolders() {
  const sel = document.getElementById('pl-v-folder');
  if (sel.dataset.slug === plSlug) return;
  try {
    const d = await (await fetch('/api/fanvue/folders?persona='
      + encodeURIComponent(plSlug))).json();
    sel.innerHTML = '<option value="">All folders</option>'
      + (d.folders || []).map(f => '<option value="' + esc(f.name) + '">'
        + esc(f.name) + (f.count == null ? '' : ' (' + f.count + ')')
        + '</option>').join('');
    sel.dataset.slug = plSlug;
  } catch (e) { /* the folder filter is a convenience; the grid still loads */ }
}

async function plVaultReload() {
  const grid = document.getElementById('pl-v-grid');
  if (grid) grid.innerHTML = skelGrid(12);
  plFvFolder = document.getElementById('pl-v-folder').value;
  plFvType = document.getElementById('pl-v-type').value;
  plFvItems = [];
  plFvPage = 1;
  plFvLoading = true;
  plVaultDraw();
  try {
    plFvItems = await plFvFetch(1);
    plFvRemember(plFvItems);
  } catch (e) { plFvVaultError = 'Could not read the Fanvue vault.'; }
  plFvLoading = false;
  plVaultDraw();
}

async function plVaultMore(btn) {
  btn.disabled = true;
  btn.textContent = 'loading…';
  try {
    const more = await plFvFetch(plFvPage + 1);
    plFvPage += 1;
    plFvItems = plFvItems.concat(more);
    plFvRemember(more);
  } catch (e) { plFvVaultError = 'Could not read the rest of the vault.'; }
  plVaultDraw();
}

// The search is over what has been loaded, because Fanvue's media list takes no
// query of its own — so the footer says how much of the vault it has seen.
function plVaultDraw() {
  const q = document.getElementById('pl-v-q').value.trim().toLowerCase();
  const shown = q
    ? plFvItems.filter(m => (m.purpose || '').toLowerCase().indexOf(q) !== -1)
    : plFvItems;
  const grid = document.getElementById('pl-v-grid');
  grid.innerHTML = shown.length
    ? shown.map(m => '<button type="button" class="pl-vault-item'
        + (plPickedMedia.indexOf(m.id) !== -1 ? ' on' : '')
        + '" onclick="plVaultPick(\'' + esc(m.id) + '\')">'
        + plMediaThumb(m)
        + '<span class="pl-vault-name">' + esc(m.purpose || 'untitled') + '</span>'
        + '</button>').join('')
    : '<span class="hint">' + (plFvLoading ? 'Reading her vault…'
        : plFvVaultError ? esc(plFvVaultError)
        : q ? 'Nothing loaded matches that. Load more, or clear the search.'
        : 'Nothing here. Upload to Fanvue and it shows up.') + '</span>';

  const foot = document.getElementById('pl-v-foot');
  const count = shown.length + (q && shown.length !== plFvItems.length
    ? ' of ' + plFvItems.length : '');
  const cap = plMediaCap();
  foot.innerHTML = '<span class="hint">'
      + (plFvItems.length ? count + ' shown' : '')
      + (cap > 1 && plPickedMedia.length
          ? (plFvItems.length ? ' · ' : '') + plPickedMedia.length + ' of ' + cap + ' picked'
          : '')
    + '</span><span style="display:flex; gap:8px;">'
    + (plFvHasMore && !plFvLoading
        ? '<button type="button" class="btn btn-ghost" onclick="plVaultMore(this)">Load more</button>'
        : '')
    + (cap > 1
        ? '<button type="button" class="btn btn-primary" onclick="plVaultClose()">Done</button>'
        : '')
    + '</span>';
}

function plVaultPick(id) {
  // The overlay stays open while a post can still take more, so a carousel is
  // picked in one visit rather than one reopen per file.
  plPickMedia(id);
  if (plMediaCap() <= 1 || plPickedMedia.length >= plMediaCap()) plVaultClose();
  else plVaultDraw();
}


function plShiftWeek(n) {
  const d = new Date(plWeekStart * 1000);
  d.setDate(d.getDate() + 7 * n);
  plWeekStart = plDayStart(d);
  // Proposals belong to the week they were planned for.
  plProposed = [];
  plPlanMeta = null;
  plLoadQueue();
}

async function plLoadQueue() {
  if (!plSlug) return;
  document.getElementById('pl-grid').innerHTML = skelDays();
  document.getElementById('pl-range').textContent = rangeLabel(plWeekStart);
  const from = plWeekStart, to = plWeekStart + 7 * 86400;
  let d;
  try {
    d = await (await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&from=' + from + '&to=' + to)).json();
  } catch (e) {
    document.getElementById('pl-state').textContent = 'Could not read the queue.';
    return;
  }
  if (!d || !d.ok) {
    document.getElementById('pl-state').textContent = (d && d.error) || 'Could not read the queue.';
    return;
  }
  plQueue = d.queue || [];
  plRemote = d.remote || [];
  try {
    const ov = await (await fetch('/api/platforms/overview')).json();
    plConn = ((ov.personas || {})[plSlug]) || {};
  } catch (e) { plConn = {}; }
  plRender(d);
}

// ── Rendering ────────────────────────────────────────────────────────────────

function plStateLine(d) {
  const el = document.getElementById('pl-state');
  const off = [];
  if (!d.beta) off.push('this persona is not on the growth beta');
  if (!d.worker_on) off.push('the scheduler is switched off on this host');
  if (off.length) {
    el.className = 'pl-state is-off';
    el.textContent = 'Nothing will go out — ' + off.join(' and ')
      + '. Anything queued stays queued.';
    return;
  }
  el.className = 'pl-state';
  const t = d.totals || {};
  const bits = [(t.queued || 0) + ' queued this week'];
  if (t.next_at) bits.push('next ' + dayLabel(t.next_at) + ' ' + hourLabel(t.next_at)
    + ' (' + whenText(t.next_at) + ')');
  if (t.overdue) bits.push(t.overdue + ' past its slot and still waiting');
  if (t.failed) bits.push(t.failed + ' failed — a failed post is not retried, edit it and queue it fresh');
  el.textContent = bits.join(' · ') + '.';
}

function plConnectLine() {
  const el = document.getElementById('pl-connect');
  // Only nag about a channel this week actually uses.
  const used = new Set(plQueue.filter(r => r.status === 'queued').map(r => r.platform)
    .concat(plProposed.filter(s => s.publishable).map(s => s.platform)));
  const missing = PL_PUBLISHABLE.filter(
    p => used.has(p) && !((plConn[p] || {}).connected));
  if (!missing.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = 'No ' + missing.map(p => esc(PL_LABELS[p])).join(' or ')
    + ' account is connected for this persona, so those posts will fail when their slot comes. '
    + missing.map(p => '<a href="' + PL_CONNECT_AT[p] + '?persona=' + encodeURIComponent(plSlug)
        + '">Connect ' + esc(PL_LABELS[p]) + '</a>').join(' · ') + '.';
}

function plRender(d) {
  plStateLine(d);
  plConnectLine();

  const t = (d && d.totals) || {};
  const manual = plProposed.filter(s => !s.publishable).length + (t.manual || 0);
  document.getElementById('pl-stats').innerHTML =
    statTile('queued', t.queued || 0)
    + statTile('posted', t.posted || 0)
    + statTile('failed', t.failed || 0)
    + (plProposed.length ? statTile('proposed', plProposed.length) : '')
    + (manual ? statTile('by hand', manual) : '');

  const queueable = plProposed.filter(s => s.publishable && s.at > Date.now() / 1000).length;
  document.getElementById('pl-bulk').innerHTML = queueable
    ? '<button type="button" class="btn btn-primary" onclick="plQueueWeek(this)">Queue the '
      + queueable + ' ' + plAutoChannels() + ' post' + (queueable === 1 ? '' : 's') + '</button>'
      + (plPlanMeta && plPlanMeta.upcoming > plPlanMeta.cap
         ? '<span class="hint" style="margin-left:10px;">Only the first ' + plPlanMeta.cap
           + ' go in one round — plan again once those have gone out.</span>' : '')
    : '';

  // One card list per day: what is really queued, and what is only proposed.
  const cards = [];
  plQueue.forEach((r, i) => cards.push({
    kind: 'queued', at: r.run_at, platform: r.platform, status: r.status,
    text: r.text, error: r.error, attempts: r.attempts, id: r.id, idx: i,
    media: r.media_id ? plMediaById(r.media_id) : null
  }));
  plProposed.forEach((s, i) => cards.push({
    kind: 'proposed', at: s.at, platform: s.platform, publishable: s.publishable,
    text: s.idea, job: s.kind, idx: i,
    media: s.media_id ? plMediaById(s.media_id) : null
  }));
  // Posts made in the Fanvue app itself. Shown so the week is planned around
  // them, never edited from here — they are not ours to change.
  plRemote.forEach(r => cards.push({
    kind: 'remote', at: r.run_at, platform: r.platform, status: r.status,
    text: r.text, price: r.price_cents
  }));
  cards.sort((a, b) => a.at - b.at);

  const todayKey = new Date().toDateString();
  let html = '';
  for (let day = 0; day < 7; day++) {
    const start = plWeekStart + day * 86400, end = start + 86400;
    const date = new Date(start * 1000);
    const mine = cards.filter(c => c.at >= start && c.at < end);
    const cls = 'pl-day'
      + (date.toDateString() === todayKey ? ' is-today' : '')
      + (end < Date.now() / 1000 ? ' is-past' : '');
    html += '<div class="' + cls + '"><div class="pl-day-h">' + esc(dayLabel(start)) + '</div>'
      + (mine.length ? mine.map(plCard).join('') : '<div class="pl-empty">—</div>')
      + '</div>';
  }
  document.getElementById('pl-grid').innerHTML = html;
}

// The channels the proposals on screen can actually post to, named so the bulk
// button says what it is about to queue rather than naming a fixed pair.
function plAutoChannels() {
  const names = [];
  plProposed.forEach(s => {
    if (!s.publishable) return;
    const n = PL_LABELS[s.platform] || s.platform;
    if (names.indexOf(n) === -1) names.push(n);
  });
  if (!names.length) return '';
  if (names.length === 1) return names[0];
  return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
}

function plCard(c) {
  if (c.kind === 'remote') {
    const price = c.price ? ' · $' + (c.price / 100).toFixed(2) : '';
    return '<div class="pl-card is-remote" title="Made in Fanvue — edit it there">'
      + '<span class="pl-card-top"><span class="pl-when">' + hourLabel(c.at) + '</span>'
      + '<span class="pl-chan">' + esc(PL_LABELS[c.platform] || c.platform) + '</span>'
      + '<span class="pl-flag">' + esc((c.status === 'posted' ? 'on Fanvue' : 'scheduled') + price) + '</span></span>'
      + '<span class="pl-text">' + esc(c.text || 'no caption') + '</span></div>';
  }
  const manual = c.kind === 'proposed' ? !c.publishable : c.status === 'manual';
  const cls = 'pl-card ' + (c.kind === 'proposed'
    ? (manual ? 'is-proposed is-manual' : 'is-proposed')
    : (manual ? 'is-manual' : 'is-' + c.status));
  let flag = '';
  if (manual) flag = 'by hand';
  else if (c.kind === 'proposed') flag = PL_KIND[c.job] || c.job;
  else if (c.status === 'failed') flag = 'failed';
  else if (c.status === 'posted') flag = 'posted';
  else if (c.status === 'sending') flag = 'sending';
  else if (c.status === 'cancelled') flag = 'cancelled';
  const kill = c.kind === 'proposed'
    ? '<span class="pl-kill" role="button" tabindex="0" title="Drop this idea"'
      + ' onclick="event.stopPropagation(); plDropProposed(' + c.idx + ')">&times;</span>'
    : (['queued', 'manual', 'cancelled', 'failed'].indexOf(c.status) !== -1
       ? '<span class="pl-kill" role="button" tabindex="0" title="'
         + (c.status === 'cancelled' ? 'Delete for good' : 'Cancel this post') + '"'
         + ' onclick="event.stopPropagation(); plQuickKill(\'' + c.id + '\',\'' + c.status + '\')">&times;</span>'
       : '');
  return '<button type="button" class="' + cls + '" onclick="plEdit(\'' + c.kind + '\',' + c.idx + ')">'
    + kill
    + '<span class="pl-card-top"><span class="pl-when">' + hourLabel(c.at) + '</span>'
    + '<span class="pl-chan">' + esc(PL_LABELS[c.platform] || c.platform) + '</span>'
    + (flag ? '<span class="pl-flag">' + esc(flag) + '</span>' : '') + '</span>'
    + (c.media && c.kind !== 'proposed' ? plMediaThumb(c.media, ' is-card') : '')
    + (c.kind === 'proposed' && c.publishable ? plSlotMediaRow(c) : '')
    + '<span class="pl-text">' + esc(c.text || 'no angle yet') + '</span>'
    + (c.error ? '<span class="pl-flag" style="margin-left:0;">' + esc(c.error.slice(0, 60)) + '</span>' : '')
    + '</button>';
}

// What this proposal will go out carrying, and the way to change it. Shown on
// the card rather than behind the editor: a week is reviewed by scanning it.
function plSlotMediaRow(c) {
  const slot = plProposed[c.idx] || {};
  const m = c.media;
  const warn = m && PL_NSFW_BANNED.indexOf(c.platform) !== -1 && m.rating === 'nsfw';
  return '<span class="pl-slot-media" role="button" tabindex="0"'
    + ' title="Pick the photo or clip for this post"'
    + ' onclick="event.stopPropagation(); plSlotMediaOpen(' + c.idx + ')">'
    + (m ? '<img loading="lazy" decoding="async" class="pl-slot-thumb" src="' + esc(m.kind === 'video' ? (m.poster || m.thumb) : m.thumb) + '" alt="">' : '')
    + '<span' + (warn ? ' class="pl-slot-warn"' : '') + '>'
    + (m ? esc((m.purpose || (m.kind === 'video' ? 'clip' : 'photo')).slice(0, 18))
           + (warn ? ' · explicit' : (slot.media_override ? ' · forced' : ''))
         : '+ add media')
    + '</span></span>';
}

// ── Slot media picker ───────────────────────────────────────────────────────

// The channels that ban explicit media, mirrored from growth.NSFW_BANNED_MEDIA.
// The server refuses one of these anyway; this is what lets the picker warn
// before the creator has queued a week they have to unpick.
const PL_NSFW_BANNED = ['tiktok', 'instagram', 'threads', 'reddit'];
let plSlotIdx = -1;

function plSlotMediaOpen(idx) {
  if (!plProposed[idx]) return;
  plSlotIdx = idx;
  document.getElementById('pl-sm-q').value = '';
  document.getElementById('pl-sm-rating').value = '';
  document.getElementById('pl-sm-title').textContent =
    'Media for ' + (PL_LABELS[plProposed[idx].platform] || plProposed[idx].platform);
  document.getElementById('pl-slot-media').classList.add('open');
  plSlotMediaDraw();
}

function plSlotMediaClose() {
  document.getElementById('pl-slot-media').classList.remove('open');
  plSlotIdx = -1;
}

function plSlotBanned(platform, m) {
  return PL_NSFW_BANNED.indexOf(platform) !== -1 && (m || {}).rating === 'nsfw';
}

function plSlotMediaDraw() {
  const slot = plProposed[plSlotIdx];
  if (!slot) return;
  const q = document.getElementById('pl-sm-q').value.trim().toLowerCase();
  const rating = document.getElementById('pl-sm-rating').value;
  const shown = plVault.filter(m => {
    // Held back from posts in the vault: not on offer here at all, since the
    // server refuses it anyway.
    if (m.no_posts) return false;
    if (rating === 'unrated' && m.rating) return false;
    if (rating && rating !== 'unrated' && m.rating !== rating) return false;
    if (q && (m.purpose || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('pl-sm-grid').innerHTML = shown.length
    ? shown.map(m => '<button type="button" class="pl-vault-item'
        + (slot.media_id === m.id ? ' on' : '')
        + (plSlotBanned(slot.platform, m) ? ' is-banned' : '')
        + '" onclick="plSlotMediaPick(\'' + esc(m.id) + '\')">'
        + plMediaThumb(m)
        + '<span class="pl-rate is-' + (m.rating || 'none') + '">'
        + esc(m.rating ? m.rating.toUpperCase() : 'unrated') + '</span>'
        + '<span class="pl-vault-name">' + esc(m.purpose || 'untitled') + '</span>'
        + '</button>').join('')
    : '<span class="hint">Nothing in the vault matches that. Add media in the '
      + 'Content Vault.</span>';
  document.getElementById('pl-sm-foot').innerHTML =
    '<span class="hint">' + shown.length + ' of ' + plVault.length + ' shown'
    + (PL_NSFW_BANNED.indexOf(slot.platform) !== -1
        ? ' · this channel bans explicit media' : '') + '</span>'
    + '<span style="display:flex; gap:8px;">'
    + (slot.media_id
        ? '<button type="button" class="btn btn-ghost" onclick="plSlotMediaPick(\'\')">Post without media</button>'
        : '')
    + '<button type="button" class="btn btn-primary" onclick="plSlotMediaClose()">Done</button>'
    + '</span>';
}

function plSlotMediaPick(id) {
  const slot = plProposed[plSlotIdx];
  if (!slot) return;
  const m = id ? plMediaById(id) : null;
  if (id && plSlotBanned(slot.platform, m)) {
    const label = PL_LABELS[slot.platform] || slot.platform;
    if (!confirm(label + ' does not allow explicit media. Posting this will very '
        + 'likely get the ' + label + ' account banned.\n\nUse it anyway?')) return;
    if (!confirm('Last check: queue explicit media to ' + label + ' and accept the '
        + 'risk of losing that account?')) return;
    slot.media_override = true;
  } else {
    slot.media_override = false;
  }
  slot.media_id = id || '';
  plSlotMediaClose();
  plRender(plPlanMeta || {});
}

// ── Planning ─────────────────────────────────────────────────────────────────

function plPlanOpen() {
  const bar = document.getElementById('pl-planbar');
  bar.hidden = !bar.hidden;
  if (!bar.hidden) plRenderPlanChans();
}

function plPlanClose() { document.getElementById('pl-planbar').hidden = true; }

function plRenderPlanChans() {
  document.getElementById('pl-plan-chans').innerHTML = PL_PLATFORMS.map(p => {
    if (!plAllowed(p)) return plLockedChan(p);
    const on = plPlanChans.indexOf(p) !== -1;
    return '<label class="pl-chan-pick' + (on ? ' on' : '') + '">'
      + '<input type="checkbox"' + (on ? ' checked' : '')
      + ' onchange="plTogglePlanChan(\'' + p + '\')">'
      + esc(PL_LABELS[p])
      + (PL_PUBLISHABLE.indexOf(p) === -1 ? '<span class="by-hand">by hand</span>' : '')
      + '</label>';
  }).join('');
}

// A channel above this plan: shown so the creator can see what upgrading buys,
// never tickable.
function plLockedChan(p) {
  return '<a class="pl-chan-pick is-locked" href="/pricing" title="Not on your plan">'
    + '<input type="checkbox" disabled>' + esc(PL_LABELS[p])
    + '<span class="pl-lock">Pro</span></a>';
}

function plTogglePlanChan(p) {
  if (!plAllowed(p)) return;
  const i = plPlanChans.indexOf(p);
  if (i === -1) plPlanChans.push(p); else plPlanChans.splice(i, 1);
  plRenderPlanChans();
}

async function plPlan(btn) {
  if (!plSlug) return;
  if (!plPlanChans.length) { alert('Pick at least one channel to plan for.'); return; }
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'planning…';
  try {
    const res = await fetch('/api/growth/plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: plSlug, start: plWeekStart, days: 7,
                             platforms: plPlanChans,
                             cross: document.getElementById('pl-plan-cross').checked })
    });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not plan the week.'); return; }
    plProposed = d.slots || [];
    plPlanMeta = d;
    plPlanClose();
    if (!d.ideas) {
      alert('The angles came back empty, so every proposed card needs one typed in '
        + 'before it can be queued.');
    }
    plLoadQueue();
  } catch (e) { alert('Could not plan the week.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

async function plQueueWeek(btn) {
  const slots = plProposed.filter(s => s.publishable);
  if (!slots.length) return;
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'writing them…';
  try {
    const res = await fetch('/api/growth/plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: plSlug, action: 'queue', slots: slots })
    });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not queue them.'); return; }
    let msg = d.queued.length + ' post' + (d.queued.length === 1 ? '' : 's') + ' queued.';
    if (d.failed.length) {
      msg += ' ' + d.failed.length + ' could not be written: '
        + (d.failed[0].error || 'no reason given');
    }
    if (d.skipped) msg += ' ' + d.skipped + ' were over the ' + d.cap + '-post limit for one round.';
    // The ones that went in are real rows now; anything left is still by hand.
    plProposed = plProposed.filter(s => !s.publishable);
    plLoadQueue();
    alert(msg);
  } catch (e) { alert('Could not queue them.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

// ── The editor ───────────────────────────────────────────────────────────────

// A blank post. Defaults to the next round hour so the time box is never the
// thing standing between an idea and the calendar.
function plNew() {
  if (!plSlug) return;
  const soon = new Date();
  soon.setMinutes(0, 0, 0);
  soon.setHours(soon.getHours() + 1);
  let at = Math.floor(soon.getTime() / 1000);
  // Opened on a week that is not this one, the post belongs to that week.
  if (at < plWeekStart || at >= plWeekStart + 7 * 86400) at = plWeekStart + 9 * 3600;
  const first = plAllowedPlatforms()[0] || 'x';
  plOpen = { kind: 'new', idx: -1, id: '', platform: first, at: at,
             publishable: PL_PUBLISHABLE.indexOf(first) !== -1 };
  plChans = [first];
  plPickedMedia = [];

  document.getElementById('pl-m-title').textContent = 'New post';
  document.getElementById('pl-m-meta').textContent =
    'Pick the channels, set the time, write it. Nothing exists until you save.';
  const when = document.getElementById('pl-m-when');
  when.value = toLocalInput(at);
  when.disabled = false;
  document.getElementById('pl-m-when-field').style.display = '';

  const ta = document.getElementById('pl-m-text');
  ta.value = '';
  ta.disabled = false;
  document.getElementById('pl-m-label').textContent = 'Post';
  document.getElementById('pl-m-hint').textContent =
    'Type an angle and press Write it, or write the post yourself.';
  document.getElementById('pl-m-write').style.display = '';
  document.getElementById('pl-m-write').textContent = '✨ Write it';
  document.getElementById('pl-m-cancel').style.display = 'none';
  document.getElementById('pl-m-delete').style.display = 'none';
  const save = document.getElementById('pl-m-save');
  save.style.display = '';
  save.textContent = 'Add to the week';
  document.getElementById('pl-m-now').style.display = '';

  plRenderChans();
  plRenderFanvue('', 0);
  plRenderIg('post');
  plRdTitles = {};
  plRenderRd();
  plSetRating('');
  plCount();
  plRenderMedia();
  document.getElementById('pl-modal').classList.add('open');
}

// The audience and the price are Fanvue's alone, so the field only exists while
// Fanvue is one of the channels this post is going to.
function plRenderFanvue(audience, priceCents) {
  const on = plOpen && (plOpen.kind === 'new'
    ? plChans.indexOf('fanvue') !== -1 : plOpen.platform === 'fanvue');
  document.getElementById('pl-m-fanvue-field').hidden = !on;
  if (!on) return;
  if (audience !== undefined) {
    document.getElementById('pl-m-audience').value = audience || 'followers-and-subscribers';
  }
  if (priceCents !== undefined) {
    document.getElementById('pl-m-price').value = priceCents ? (priceCents / 100).toFixed(2) : '';
  }
}

// What the two Fanvue boxes say right now, or null when they are not showing.
function plFanvueFields() {
  if (document.getElementById('pl-m-fanvue-field').hidden) return null;
  const dollars = parseFloat(document.getElementById('pl-m-price').value);
  return {
    audience: document.getElementById('pl-m-audience').value,
    price_cents: isNaN(dollars) || dollars <= 0 ? 0 : Math.round(dollars * 100)
  };
}

function plRenderIg(kind) {
  const on = plOpen && (plOpen.kind === 'new'
    ? plChans.indexOf('instagram') !== -1 : plOpen.platform === 'instagram');
  document.getElementById('pl-m-ig-field').hidden = !on;
  if (!on) return;
  if (kind !== undefined) document.getElementById('pl-m-ig-kind').value = kind || 'post';
  const picked = document.getElementById('pl-m-ig-kind').value;
  document.getElementById('pl-m-ig-hint').textContent = picked === 'reel'
    ? 'A reel is one video. Its cover is taken from the first frame.'
    : picked === 'story'
      ? 'A story is one photo or video, and it is gone after 24 hours.'
      : 'A feed post can carry several photos or videos as a carousel.';
}

// Instagram takes one file for a story or a reel, several only in the feed.
function plIgKindChanged() {
  const kind = document.getElementById('pl-m-ig-kind').value;
  if (kind !== 'post' && plPickedMedia.length > 1) plPickedMedia = plPickedMedia.slice(0, 1);
  plRenderIg();
  plRenderMedia();
}

function plIgFields() {
  if (document.getElementById('pl-m-ig-field').hidden) return null;
  return { ig_kind: document.getElementById('pl-m-ig-kind').value };
}

// Reddit is the only channel here where one planned post is several posts: the
// same set goes to three or four subreddits, each with its own flair and its
// own title. So the panel collects a title per subreddit and the server writes
// a row for each -- a fan-out that reads as one person posting in four places,
// rather than the same words pasted four times.
let plRdSubs = [], plRdTitles = {};

function plRdOn() {
  return !!(plOpen && (plOpen.kind === 'new'
    ? plChans.indexOf('reddit') !== -1 : plOpen.platform === 'reddit'));
}

async function plRdLoadSubs() {
  if (plRdSubs.length) return plRdSubs;
  try {
    const r = await fetch('/api/reddit/subreddits?persona=' + encodeURIComponent(plSlug));
    const d = await r.json();
    plRdSubs = d.subs || [];
  } catch (e) { plRdSubs = []; }
  return plRdSubs;
}

function plRenderRd(row) {
  const on = plRdOn();
  document.getElementById('pl-m-rd-field').hidden = !on;
  if (!on) return;
  if (row) {
    if (row.rd_kind) document.getElementById('pl-m-rd-kind').value = row.rd_kind;
    // An existing row is one subreddit: it was already fanned out when queued.
    if (row.rd_sub) plRdTitles = { [row.rd_sub]: row.text || '' };
  }
  plRdLoadSubs().then(subs => {
    const editing = plOpen && plOpen.kind === 'queued';
    const only = editing ? (plOpen.rd_sub || '') : '';
    const rows = editing ? subs.filter(s => s.sub === only) : subs;
    document.getElementById('pl-m-rd-subs').innerHTML = rows.length
      ? rows.map(s => {
          const on2 = editing || plRdTitles[s.sub] !== undefined;
          return '<label class="pl-chan-pick' + (on2 ? ' on' : '') + '" style="display:block;">'
            + '<input type="checkbox"' + (on2 ? ' checked' : '')
            + (editing ? ' disabled' : '')
            + ' onchange="plRdToggle(\'' + esc(s.sub) + '\')"> r/' + esc(s.sub)
            + (s.flair_text || s.flair ? '<span class="by-hand">'
                + esc(s.flair_text || s.flair) + '</span>' : '')
            + '</label>'
            + (on2 ? '<input type="text" maxlength="300" style="margin:4px 0 10px;" '
                + 'placeholder="title for r/' + esc(s.sub) + ' — blank uses the post text" '
                + 'value="' + esc(plRdTitles[s.sub] || '') + '" '
                + 'oninput="plRdTitle(\'' + esc(s.sub) + '\', this.value)">' : '');
        }).join('')
      : '<span class="hint">No subreddits set up yet. Add them in the Reddit console.</span>';
    const n = Object.keys(plRdTitles).length;
    document.getElementById('pl-m-rd-hint').textContent = !subs.length
      ? 'She has nowhere to post until a subreddit is added under Reddit.'
      : editing
        ? 'A queued Reddit post goes to one subreddit. Queue the others as their own posts.'
        : n > 1
          ? n + ' subreddits, one post each, spaced out below. Give each its own '
            + 'title — the same words in four places is what a spam filter looks for.'
          : 'Pick the subreddits this goes to. Most need a flair, which is taken '
            + 'from the Reddit console.';
  });
}

function plRdToggle(sub) {
  if (plRdTitles[sub] === undefined) plRdTitles[sub] = '';
  else delete plRdTitles[sub];
  plRenderRd();
}

function plRdTitle(sub, value) { plRdTitles[sub] = value; }

// Reddit takes one file per submission here, whatever the gallery would allow.
function plRdKindChanged() {
  if (plPickedMedia.length > 1) plPickedMedia = plPickedMedia.slice(0, 1);
  plRenderRd();
  plRenderMedia();
}

function plRdFields(text) {
  if (!plRdOn()) return null;
  const subs = Object.keys(plRdTitles);
  if (!subs.length) return null;
  let stagger = parseInt(document.getElementById('pl-m-rd-stagger').value, 10);
  if (isNaN(stagger) || stagger < 0) stagger = PL_RD_STAGGER;
  return { reddit: {
    kind: document.getElementById('pl-m-rd-kind').value,
    stagger_min: stagger,
    subs: subs.map(sub => ({ sub: sub, title: plRdTitles[sub] || text }))
  } };
}

function plRenderChans() {
  const field = document.getElementById('pl-m-chans-field');
  field.hidden = !plOpen || plOpen.kind !== 'new';
  if (field.hidden) return;
  document.getElementById('pl-m-chans').innerHTML = Object.keys(PL_LABELS).map(p => {
    if (!plAllowed(p)) return plLockedChan(p);
    const on = plChans.indexOf(p) !== -1;
    const hand = PL_PUBLISHABLE.indexOf(p) === -1;
    return '<label class="pl-chan-pick' + (on ? ' on' : '') + '">'
      + '<input type="checkbox"' + (on ? ' checked' : '')
      + ' onchange="plToggleChan(\'' + p + '\')">'
      + esc(PL_LABELS[p])
      + (hand ? '<span class="by-hand">by hand</span>' : '') + '</label>';
  }).join('');
  const hand = plChans.filter(p => PL_PUBLISHABLE.indexOf(p) === -1);
  document.getElementById('pl-m-chans-hint').textContent = !plChans.length
    ? 'Pick at least one.'
    : hand.length
      ? hand.map(p => PL_LABELS[p]).join(' and ') + ' cannot be posted from here, so '
        + (hand.length === 1 ? 'it lands' : 'they land')
        + ' on the calendar as a reminder to post by hand.'
      : 'One post per channel, each trimmed to that channel\'s limit.';
}

function plToggleChan(p) {
  if (!plAllowed(p)) return;
  const i = plChans.indexOf(p);
  if (i === -1) plChans.push(p); else plChans.splice(i, 1);
  // The media strip and the counter follow the strictest channel ticked.
  plOpen.platform = plChans[0] || plAllowedPlatforms()[0] || 'x';
  plOpen.publishable = plChans.every(c => PL_PUBLISHABLE.indexOf(c) !== -1);
  plRenderChans();
  plRenderFanvue();
  plRenderIg();
  plRenderRd();
  plCount();
  plRenderMedia();
}

function plEdit(kind, idx) {
  const row = kind === 'queued' ? plQueue[idx] : plProposed[idx];
  if (!row) return;
  const at = kind === 'queued' ? row.run_at : row.at;
  const plat = row.platform;
  // A queued row on a by-hand channel is a reminder, not something that posts
  // itself, so it reads as manual here exactly like a proposal does.
  const publishable = kind === 'queued'
    ? PL_PUBLISHABLE.indexOf(plat) !== -1
    : row.publishable;
  const editable = kind === 'proposed'
    || row.status === 'queued' || row.status === 'manual';
  plOpen = { kind: kind, idx: idx, id: row.id || '', platform: plat, at: at, publishable: publishable };

  document.getElementById('pl-m-title').textContent =
    dayLabel(at) + ' ' + hourLabel(at) + ' · ' + (PL_LABELS[plat] || plat);
  document.getElementById('pl-m-meta').textContent = kind === 'proposed'
    ? 'Proposed — ' + (PL_KIND[row.kind] || row.kind)
      + (publishable ? '. Nothing exists until you queue it.'
                     : '. This channel has no posting API she is allowed to use, so adding it '
                       + 'puts a reminder on the calendar to post it yourself.')
    : (PL_STATUS[row.status] || row.status)
      + (row.attempts > 1 ? ' After ' + row.attempts + ' tries.' : '')
      + (row.error ? ' ' + row.error : '');

  const when = document.getElementById('pl-m-when');
  when.value = toLocalInput(at);
  // Every post has a slot now, whether it goes out on its own or is a reminder
  // to post it by hand, so the time is worth setting either way.
  when.disabled = !editable;
  document.getElementById('pl-m-when-field').style.display = '';

  const ta = document.getElementById('pl-m-text');
  ta.value = kind === 'queued' ? (row.text || '') : (row.idea || '');
  ta.disabled = !editable;
  document.getElementById('pl-m-label').textContent = kind === 'proposed' ? 'The angle' : 'Post';
  document.getElementById('pl-m-hint').textContent = kind === 'proposed'
    ? 'Edit the angle, then let her write the post from it.'
    : '';

  document.getElementById('pl-m-write').style.display = editable ? '' : 'none';
  document.getElementById('pl-m-write').textContent = kind === 'proposed' ? '✨ Write it' : '✨ Rewrite';
  document.getElementById('pl-m-cancel').style.display =
    (kind === 'queued' && row.status === 'queued') ? '' : 'none';
  // Only a stored row can be deleted; a proposal disappears by itself.
  document.getElementById('pl-m-delete').style.display =
    (kind === 'queued' && row.status !== 'sending') ? '' : 'none';
  const save = document.getElementById('pl-m-save');
  save.style.display = editable ? '' : 'none';
  // An existing row already has a slot; Post now belongs to something being
  // written, not to moving a booked post forward.
  document.getElementById('pl-m-now').style.display =
    (kind === 'proposed' && plOpen.publishable) ? '' : 'none';
  save.textContent = kind === 'proposed'
    ? (publishable ? 'Queue it' : 'Add to the week') : 'Save changes';

  // A proposal has no media until one is attached here; a queued row remembers.
  plPickedMedia = (row.media_ids && row.media_ids.length)
    ? row.media_ids.slice() : (row.media_id ? [row.media_id] : []);
  plChans = [];
  plRenderChans();
  plRenderFanvue(row.audience || '', row.price_cents || 0);
  plRenderIg(row.ig_kind || 'post');
  plRdTitles = {};
  plRenderRd(row);
  plSetRating('');
  plCount();
  plRenderMedia();
  document.getElementById('pl-modal').classList.add('open');
}

// What happens to the attached file when the slot comes round, per channel.
function plMediaHint(picked) {
  const plat = plOpen.kind === 'new' ? (plChans[0] || '') : plOpen.platform;
  if (String(picked.id || '').indexOf('fv:') === 0) {
    return 'Already in her Fanvue vault — attached as it is, with nothing uploaded.';
  }
  if (plat === 'threads') {
    return 'Threads collects the file from us, so it has to be publicly reachable '
         + 'when the slot comes round.';
  }
  if (plat === 'fanvue') return 'Uploaded into her Fanvue vault when the post goes out.';
  if (plat === 'reddit') return 'Uploaded to Reddit when the post goes out, once per subreddit.';
  if (plat === 'instagram') return 'Uploaded to Instagram when the post goes out.';
  return 'Uploaded to X when the post goes out.';
}

function plMediaThumb(m, extra) {
  return '<span class="pl-thumb' + (extra || '') + '">'
    + (m.kind === 'video'
        ? '<video src="' + esc(m.thumb) + '" muted playsinline preload="metadata"></video>'
          + '<span class="pl-thumb-tag">video</span>'
        : '<img src="' + esc(m.thumb) + '" alt="" loading="lazy">')
    + '</span>';
}

function plRenderMedia() {
  const field = document.getElementById('pl-m-media-field');
  if (!plOpen) return;
  const chans = plOpenChans();
  // One photo goes to every channel ticked, so only a kind they all take can
  // be offered — TikTok takes only video, so pairing it with a stills-only
  // channel leaves nothing that satisfies both.
  const allowed = chans.length
    ? chans.map(p => PL_MEDIA[p] || [])
        .reduce((a, b) => a.filter(k => b.indexOf(k) !== -1))
    : [];
  const fvOnly = plFanvueOnly();
  if (fvOnly && plFvVault === null) { plLoadFvVault(); }
  const library = fvOnly ? (plFvVault || []) : plVault;
  const usable = library.filter(m => allowed.indexOf(m.kind || 'image') !== -1);
  field.style.display = chans.length ? '' : 'none';
  // A pick from the other library cannot survive the switch — a Fanvue uuid is
  // nothing to X, and a library photo is nothing to the vault strip.
  plPickedMedia = plPickedMedia.filter(id => usable.some(m => m.id === id));
  const cap = plMediaCap();
  if (plPickedMedia.length > cap) plPickedMedia = plPickedMedia.slice(0, cap);

  const picked = plPickedMedia.map(plMediaById).filter(Boolean);
  document.getElementById('pl-m-picked').innerHTML = picked.length
    ? picked.map(m => '<span class="pl-attached">'
        + plMediaThumb(m, ' is-picked')
        + '<button type="button" class="pl-attached-x" title="Remove"'
        + ' onclick="plPickMedia(\'' + esc(m.id) + '\')">&times;</button>'
        + (plOpen.publishable ? ''
           : '<a class="pl-attached-dl" title="Download" href="' + esc(m.thumb)
             + '" download target="_blank" rel="noopener">&darr;</a>')
        + '</span>').join('')
    : '<span class="hint">Nothing attached.</span>';

  const emptyNote = fvOnly
    ? (plFvVaultError
        ? esc(plFvVaultError)
        : plFvVault === null ? 'Reading her Fanvue vault…'
          : 'Nothing in her Fanvue vault yet. Upload to Fanvue and it shows up here.')
    : (allowed.length
        ? 'Nothing in the library ' + (chans.length > 1 ? 'all these channels' : 'this channel')
          + ' will take. Add photos and clips in the persona editor.'
        : 'These channels take different kinds of media, so no one file suits '
          + 'them all. Post them separately to attach something.');
  // The strip is the first page; the whole vault, with its folders, is a click
  // away rather than an endless scroll inside the editor.
  document.getElementById('pl-m-browse').innerHTML = (fvOnly
    ? '<button type="button" class="btn-section-save" style="margin-left:0;"'
      + ' onclick="plVaultOpen()">Browse the vault</button>'
    // A Fanvue vault item has to be uploaded to Fanvue itself, so an upload
    // here would land in the wrong library.
    : '<button type="button" class="btn-section-save" style="margin-left:0;"'
      + ' onclick="document.getElementById(\'pl-m-upload\').click()">Upload media</button>'
      + '<input type="file" id="pl-m-upload" multiple accept="image/*,video/*"'
      + ' style="display:none" onchange="plUpload(this)">')
    + '<span class="hint" id="pl-m-upload-note" style="margin-left:8px;"></span>';
  document.getElementById('pl-m-strip').innerHTML = usable.length
    ? usable.map(m => '<button type="button" class="pl-pick'
        + (plPickedMedia.indexOf(m.id) !== -1 ? ' on' : '') + '" title="' + esc(m.purpose || m.kind)
        + '" onclick="plPickMedia(\'' + esc(m.id) + '\')">'
        + plMediaThumb(m) + '</button>').join('')
    : '<span class="hint">' + emptyNote + '</span>';

  // A Fanvue post ticked with another channel is drawn from the persona library
  // instead, so the note has to say that rather than leave an empty strip.
  document.getElementById('pl-m-media-note').textContent =
    (allowed.length ? allowed.join(' or ') : 'nothing fits every channel')
    + (cap > 1 ? ' · up to ' + cap : '')
    + (fvOnly ? ' · from her Fanvue vault' : '');

  document.getElementById('pl-m-media-hint').textContent =
    !picked
      ? (chans.indexOf('fanvue') !== -1 && !fvOnly
          ? 'Her Fanvue vault is not on offer here — the other channels ticked cannot '
            + 'use it. Untick them to pick from the vault.' : '')
      : !plOpen.publishable
        ? 'This channel has no posting API — download the file and post it yourself.'
        : plMediaHint(picked) + ' Write it reads this picture and writes about '
          + 'what is in it.';
}

// How many files every ticked channel will carry — the strictest wins, the same
// way the character count follows the tightest cap.
function plMediaCap() {
  const chans = plOpenChans();
  if (!chans.length) return 1;
  // A story and a reel are one file each, whatever the feed would allow.
  const ig = plIgFields();
  if (ig && ig.ig_kind !== 'post') return 1;
  // A Reddit submission carries one file here; a gallery is its own endpoint.
  if (plRdOn()) return 1;
  return Math.min.apply(null, chans.map(p => PL_MEDIA_MAX[p] || 1));
}

const PL_UPLOAD_MAX = 12 * 1024 * 1024;

// A video's first frame, as a data URL. Instagram wants one as a Reel's cover
// and nothing on the server can open a video to find one, so it is taken here
// while the file is in the browser anyway.
function plPosterFrame(file) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    const done = url => { URL.revokeObjectURL(v.src); resolve(url); };
    v.onloadedmetadata = () => { v.currentTime = Math.min(0.1, (v.duration || 0) / 2); };
    v.onseeked = () => {
      try {
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        done(c.toDataURL('image/jpeg', 0.85));
      } catch (e) { done(''); }
    };
    v.onerror = () => done('');
    v.src = URL.createObjectURL(file);
  });
}

async function plUpload(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  const note = document.getElementById('pl-m-upload-note');
  note.textContent = 'Uploading ' + files.length + ' file(s)…';
  const readAsDataURL = f => new Promise(res => {
    const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(f);
  });
  let added = 0, toobig = 0;
  const fresh = [];
  for (const file of files) {
    if (file.size > PL_UPLOAD_MAX) { toobig++; continue; }
    try {
      const image = await readAsDataURL(file);
      const poster = file.type.startsWith('video/') ? await plPosterFrame(file) : '';
      const r = await fetch('/api/personas/' + encodeURIComponent(plSlug) + '/media', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image, mime: file.type || '', poster })
      });
      const d = await r.json();
      if (d.id) { fresh.push(d.id); added++; }
    } catch (e) {}
  }
  await plLoadVault();
  // Attaching them is the point of uploading from here, so they go onto the
  // post, up to whatever it can carry.
  fresh.forEach(id => {
    if (plPickedMedia.indexOf(id) === -1 && plPickedMedia.length < plMediaCap()) {
      plPickedMedia.push(id);
    }
  });
  plRenderMedia();
  note.textContent = (added ? '✓ Added ' + added + ' file(s).' : 'Nothing added.')
    + (toobig ? ' ' + toobig + ' over 12MB — host those and paste the link.' : '');
}

function plPickMedia(id) {
  const i = plPickedMedia.indexOf(id);
  if (i !== -1) { plPickedMedia.splice(i, 1); plRenderMedia(); return; }
  const cap = plMediaCap();
  // At a cap of one, picking is replacing — asking the creator to remove the
  // old one first would be a step with no decision in it.
  if (cap <= 1) plPickedMedia = [id];
  else if (plPickedMedia.length < cap) plPickedMedia.push(id);
  else { alert('That is the most this post can carry — ' + cap + '.'); return; }
  plRenderMedia();
}

function plClose() {
  document.getElementById('pl-modal').classList.remove('open');
  plOpen = null;
}

// The channels the open editor is writing for: several on a new post, one
// everywhere else.
function plOpenChans() {
  if (!plOpen) return [];
  return plOpen.kind === 'new' ? plChans.slice() : [plOpen.platform];
}

function plCount() {
  if (!plOpen) return;
  const chans = plOpenChans();
  // Posting to several channels at once, the tightest cap is the one that
  // matters — anything longer is silently trimmed on the strictest of them.
  const cap = chans.length
    ? Math.min.apply(null, chans.map(p => PL_CAPS[p] || 280))
    : 280;
  const n = document.getElementById('pl-m-text').value.length;
  const el = document.getElementById('pl-m-count');
  el.textContent = n + '/' + cap;
  el.className = 'pl-count' + (n > cap ? ' over' : '');
}

// Which level the next draft is written at. A channel with its own rules — a
// TikTok caption — stays safe for work whatever is picked here; the server has
// the last word on that.
function plSetRating(r) {
  plRating = r;
  document.querySelectorAll('#pl-m-rating button').forEach(b => {
    b.classList.toggle('on', (b.dataset.r || '') === r);
  });
}

async function plWrite(btn) {
  if (!plOpen) return;
  const ta = document.getElementById('pl-m-text');
  // No angle is the ordinary case: the picture is the subject, and with no
  // picture she picks something herself. Only a proposal arrives with an angle
  // already in the box.
  const idea = plOpen.kind === 'proposed' ? ta.value.trim() : '';
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'writing…';
  try {
    const res = await fetch('/api/growth/drafts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: plSlug, idea: idea,
                             platforms: [plOpen.platform],
                             rating: plRating,
                             media_id: plPickedMedia[0] || '' })
    });
    const d = await res.json();
    const draft = (d.drafts || [])[0];
    if (!d.ok || !draft || !draft.text) {
      alert((draft && draft.error) || d.error || 'She could not write that one.');
      return;
    }
    ta.value = draft.text;
    // A proposed card becomes a draft the moment it has words: the angle box is
    // now the post, so saying "Queue it" no longer needs a second round trip.
    if (plOpen.kind === 'proposed') {
      plOpen.written = true;
      document.getElementById('pl-m-label').textContent = 'Post';
      document.getElementById('pl-m-hint').textContent =
        plOpen.publishable ? 'Queue it, or edit it first.' : 'Copy it out and post it yourself.';
    }
    plCount();
  } catch (e) { alert('She could not write that one.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

function plCopy(btn) {
  const ta = document.getElementById('pl-m-text');
  if (!ta.value) return;
  const done = () => { const w = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = w; }, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, done);
  else { ta.select(); document.execCommand('copy'); done(); }
}

async function plSave(btn, now) {
  if (!plOpen) return;
  const text = document.getElementById('pl-m-text').value.trim();
  // Posting now still writes a row, so the week shows what went out and when;
  // it just does not wait for the slot.
  const at = now ? Math.floor(Date.now() / 1000)
                 : fromLocalInput(document.getElementById('pl-m-when').value);
  if (!text) { alert('Nothing to post.'); return; }
  if (!at) { alert('That is not a time.'); return; }
  if (now && !confirm('Post this to '
      + plOpenChans().map(p => PL_LABELS[p] || p).join(' and ')
      + ' right now?')) return;

  const fv = plFanvueFields();
  const ig = plIgFields();
  const rd = plRdFields(text);
  if (plRdOn() && !rd) {
    alert('Pick at least one subreddit for the Reddit post.'); return;
  }
  if (fv && fv.price_cents && !plPickedMedia.length) {
    alert('A paid Fanvue post needs media behind the price.'); return;
  }
  if (fv && fv.price_cents && fv.price_cents < PL_FV_PRICE_MIN) {
    alert('Fanvue will not take a price under $' + (PL_FV_PRICE_MIN / 100).toFixed(2) + '.');
    return;
  }

  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = now ? 'posting…' : 'saving…';
  try {
    let res;
    if (plOpen.kind === 'new') {
      res = await fetch('/api/growth/queue', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: plSlug, platforms: plChans, text: text,
                               run_at: at, now: !!now, media_ids: plPickedMedia,
                               ...(fv || {}), ...(ig || {}), ...(rd || {}) })
      });
    } else if (plOpen.kind === 'proposed') {
      if (!plOpen.written) {
        alert('Write the post first — what is in the box is still the angle.');
        return;
      }
      res = await fetch('/api/growth/queue', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: plSlug, platform: plOpen.platform, text: text,
                               run_at: at, now: !!now, media_ids: plPickedMedia,
                               ...(fv || {}), ...(ig || {}), ...(rd || {}) })
      });
    } else {
      res = await fetch('/api/growth/queue', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: plSlug, id: plOpen.id, text: text,
                               run_at: at, now: !!now, media_ids: plPickedMedia,
                               ...(fv || {}), ...(ig || {}), ...(rd || {}) })
      });
    }
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not save it.'); return; }
    // Some channels can succeed while others are refused — say which, rather
    // than letting a half-done save look complete.
    if ((d.failed || []).length) {
      alert(d.failed.map(f => (PL_LABELS[f.platform] || f.platform) + ': ' + f.error).join('\n'));
    }
    // Queued, but it cannot go out as things stand — said now rather than at
    // the slot, where it would just be a failed row.
    if (d.warning) alert(d.warning);
    if (now && (d.sent || []).length) {
      alert('Posted to ' + d.sent.map(x => PL_LABELS[x.platform] || x.platform).join(' and ') + '.');
    }
    if (plOpen.kind === 'proposed') plProposed.splice(plOpen.idx, 1);
    plClose();
    plLoadQueue();
  } catch (e) { alert('Could not save it.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

function plDropProposed(idx) {
  plProposed.splice(idx, 1);
  plRender(plPlanMeta || {});
}

// One click cancels; the second, on a card that is already cancelled, is the
// one that cannot be taken back, so that is the one that asks.
async function plQuickKill(id, status) {
  const hard = status === 'cancelled';
  if (hard && !confirm('Delete this post for good? This cannot be undone.')) return;
  try {
    const res = await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&id=' + encodeURIComponent(id) + (hard ? '&mode=delete' : ''), { method: 'DELETE' });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not remove it.'); return; }
    plLoadQueue();
  } catch (e) { alert('Could not remove it.'); }
}

async function plClearWeek(btn) {
  if (!plSlug) return;
  if (!confirm('Delete every post still waiting in this week? Anything already '
      + 'posted or sent stays. This cannot be undone.')) return;
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'clearing…';
  try {
    const res = await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&from=' + plWeekStart + '&to=' + (plWeekStart + 7 * 86400)
      + '&mode=delete', { method: 'DELETE' });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not clear the week.'); return; }
    plProposed = [];
    plPlanMeta = null;
    plLoadQueue();
  } catch (e) { alert('Could not clear the week.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

async function plCancelPost(btn) {
  if (!plOpen || !plOpen.id) return;
  if (!confirm('Cancel this post? It will not go out.')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&id=' + encodeURIComponent(plOpen.id), { method: 'DELETE' });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not cancel it.'); return; }
    plClose();
    plLoadQueue();
  } catch (e) { alert('Could not cancel it.'); }
  finally { btn.disabled = false; }
}

async function plDeletePost(btn) {
  if (!plOpen || !plOpen.id) return;
  if (!confirm('Delete this post? It comes off the calendar for good.')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&id=' + encodeURIComponent(plOpen.id) + '&mode=delete', { method: 'DELETE' });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not delete it.'); return; }
    plClose();
    plLoadQueue();
  } catch (e) { alert('Could not delete it.'); }
  finally { btn.disabled = false; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('pl-modal').classList.contains('open')) plClose();
});

plInit();
</script>
</body>
</html>
