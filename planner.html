<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Planner</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/devnav.js" defer></script>
  <link rel="stylesheet" href="/css/site-nav.css">
  <script src="/js/site-nav.js" defer></script>
</head>
<body class="page-dashboard">

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <h1>Content Planner</h1>
    <span class="badge">Week</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <nav data-site-nav="inline" class="sn-links sn-inline"></nav>
    <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Light mode" aria-label="Switch to light mode">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round"/></svg>
    </button>
    <a href="/dashboard" style="color:var(--text-muted); font-size:0.8rem; text-decoration:none;">← Dashboard</a>
  </div>
</header>

<div class="pl-scroll">
<div class="pl-wrap">

  <div class="pl-head">
    <div class="pl-head-l">
      <h2>The week</h2>
      <select id="pl-persona" onchange="plPickPersona(this.value)" aria-label="Persona"></select>
    </div>
    <div class="pl-head-r">
      <div class="pl-week">
        <button type="button" onclick="plShiftWeek(-1)" aria-label="Previous week">&lsaquo;</button>
        <span id="pl-range">—</span>
        <button type="button" onclick="plShiftWeek(1)" aria-label="Next week">&rsaquo;</button>
      </div>
      <button type="button" class="btn btn-secondary" onclick="plLoadQueue()">Refresh</button>
      <button type="button" class="btn btn-secondary" onclick="plNew()">New post</button>
      <button type="button" class="btn btn-primary" id="pl-plan-btn" onclick="plPlan(this)">Plan the week</button>
    </div>
  </div>

  <p class="pl-state" id="pl-state">Loading…</p>
  <p class="pl-state is-off" id="pl-connect" hidden></p>
  <div class="pl-stats" id="pl-stats"></div>
  <div id="pl-bulk"></div>
  <div class="pl-grid" id="pl-grid"></div>

</div>
</div>

<div class="modal-overlay" id="pl-modal" onclick="if(event.target===this)plClose()">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <h2 id="pl-m-title">Post</h2>
      <button class="modal-close" onclick="plClose()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <p class="pl-modal-meta" id="pl-m-meta"></p>

      <div class="field" style="margin-top:14px;" id="pl-m-chans-field" hidden>
        <label>Channels</label>
        <div class="pl-chans" id="pl-m-chans"></div>
        <span class="hint" id="pl-m-chans-hint" style="margin-top:6px;"></span>
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-when-field">
        <label for="pl-m-when">When</label>
        <input type="datetime-local" id="pl-m-when">
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="pl-m-text" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <span id="pl-m-label">Post</span>
          <span class="pl-count" id="pl-m-count"></span>
        </label>
        <textarea id="pl-m-text" rows="5" oninput="plCount()"></textarea>
        <div style="margin-top:6px; display:flex; gap:6px;">
          <button type="button" class="btn-ai" id="pl-m-write" onclick="plWrite(this)">✨ Write it</button>
          <button type="button" class="btn-section-save" id="pl-m-copy" style="margin-left:0;" onclick="plCopy(this)">Copy</button>
        </div>
        <span class="hint" id="pl-m-hint" style="margin-top:6px;"></span>
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-media-field">
        <label style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <span>Media</span>
          <span class="pl-count" id="pl-m-media-note"></span>
        </label>
        <div class="pl-picked" id="pl-m-picked"></div>
        <div class="pl-strip" id="pl-m-strip"></div>
        <span class="hint" id="pl-m-media-hint" style="margin-top:6px;"></span>
      </div>

      <div class="field" style="margin-top:14px;" id="pl-m-fanvue-field" hidden>
        <label for="pl-m-audience">Who sees it on Fanvue</label>
        <select id="pl-m-audience">
          <option value="followers-and-subscribers">Followers and subscribers</option>
          <option value="subscribers">Subscribers only</option>
        </select>
        <label for="pl-m-price" style="margin-top:10px;">Unlock price</label>
        <input type="number" id="pl-m-price" min="0" step="0.01" placeholder="0.00">
        <span class="hint" style="margin-top:6px;">Leave it empty for a free post.
          A price needs media behind it, and Fanvue's floor is $3.00.</span>
      </div>

      <div class="modal-footer" style="margin-top:18px;">
        <button type="button" class="btn btn-ghost" id="pl-m-cancel"
                style="color:var(--err); border-color:var(--err); margin-right:auto;"
                onclick="plCancelPost(this)">Cancel post</button>
        <button type="button" class="btn btn-ghost" id="pl-m-delete"
                style="color:var(--err); border-color:var(--err);"
                onclick="plDeletePost(this)">Delete</button>
        <button type="button" class="btn btn-ghost" onclick="plClose()">Close</button>
        <button type="button" class="btn btn-primary" id="pl-m-save" onclick="plSave(this)">Save changes</button>
      </div>
    </div>
  </div>
</div>

<script>
// The caps mirror growth.POST_PLATFORMS. The server trims to them on every
// write, so this copy only decides when the counter turns red.
const PL_CAPS = { x: 280, threads: 500, fanvue: 5000, instagram: 2200, tiktok: 2200, reddit: 300 };
const PL_LABELS = { x: 'X', threads: 'Threads', fanvue: 'Fanvue', instagram: 'Instagram', tiktok: 'TikTok', reddit: 'Reddit' };
const PL_PUBLISHABLE = ['x', 'threads', 'fanvue'];
// Mirrors growth.MEDIA_SUPPORT. The server checks it again on every write; this
// copy only decides which thumbnails are worth offering.
const PL_MEDIA = {
  x:         ['image', 'video'],
  threads:   ['image', 'video'],
  fanvue:    ['image', 'video'],
  instagram: ['image', 'video'],
  tiktok:    ['video'],
  reddit:    ['image']
};
// Where a creator connects each publishable channel, for the prompt below.
const PL_CONNECT_AT = { x: '/xbot', threads: '/threads', fanvue: '/fanvue' };
// Fanvue's floor for a paid post, in cents. The server checks it again.
const PL_FV_PRICE_MIN = 300;
let plConn = {};
const PL_KIND = { value: 'worth reading', tease: 'tease', cta: 'ask' };
const PL_STATUS = {
  queued: 'Waiting to go out.',
  manual: 'On the calendar as a reminder. This channel has no posting API she is '
        + 'allowed to use, so copy it out and post it yourself when the slot comes.',
  sending: 'On its way now.',
  posted: 'Posted.',
  failed: 'Failed, and a failed post is not retried — edit it and queue it fresh.',
  cancelled: 'Cancelled.'
};

let plSlug = '';
let plWeekStart = 0;      // epoch of the Monday her week starts on
let plQueue = [];         // real scheduled_posts rows for this window
let plProposed = [];      // ephemeral plan slots, never persisted
let plPlanMeta = null;
let plOpen = null;        // the card the modal is editing
let plVault = [];         // the persona's media library
let plPickedMedia = '';   // what the open editor has attached
let plChans = [];         // channels ticked on a brand-new post
let plRemote = [];        // posts Fanvue already has booked — read-only

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// The cadence puts posts at hours of her day, so every boundary is local.
function plMonday(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return Math.floor(x.getTime() / 1000);
}
function dayLabel(ts) {
  return new Date(ts * 1000).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
}
function hourLabel(ts) {
  const d = new Date(ts * 1000);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function rangeLabel(start) {
  const a = new Date(start * 1000), b = new Date((start + 6 * 86400) * 1000);
  const opt = { day: 'numeric', month: 'short' };
  return a.toLocaleDateString(undefined, opt) + ' – ' + b.toLocaleDateString(undefined, opt);
}
function whenText(ts) {
  const secs = ts - Math.floor(Date.now() / 1000);
  const a = Math.abs(secs);
  const s = a < 3600 ? Math.round(a / 60) + 'm'
          : a < 86400 ? Math.round(a / 3600) + 'h'
          : Math.round(a / 86400) + 'd';
  return secs >= 0 ? 'in ' + s : s + ' ago';
}
function toLocalInput(ts) {
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0') + 'T'
    + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fromLocalInput(v) {
  const t = new Date(v).getTime();
  return isNaN(t) ? 0 : Math.floor(t / 1000);
}

function statTile(label, value) {
  return '<div><div class="pl-stat-v">' + esc(value) + '</div>'
    + '<div class="pl-stat-l">' + esc(label) + '</div></div>';
}

// ── Loading ──────────────────────────────────────────────────────────────────

async function plInit() {
  plWeekStart = plMonday(new Date());
  const wanted = new URLSearchParams(location.search).get('persona') || '';
  let list = [];
  try {
    list = await (await fetch('/api/personas')).json();
  } catch (e) { /* handled below */ }
  const sel = document.getElementById('pl-persona');
  if (!Array.isArray(list) || !list.length) {
    sel.innerHTML = '<option>no personas</option>';
    document.getElementById('pl-state').textContent =
      'No personas to plan for yet. Create one in the dashboard first.';
    return;
  }
  sel.innerHTML = list.map(p =>
    '<option value="' + esc(p.slug) + '">' + esc(p.name || p.slug) + '</option>').join('');
  plSlug = list.some(p => p.slug === wanted) ? wanted : list[0].slug;
  sel.value = plSlug;
  await plLoadVault();
  plLoadQueue();
}

function plPickPersona(slug) {
  plSlug = slug;
  plProposed = [];
  plPlanMeta = null;
  plLoadVault();
  plLoadQueue();
}

async function plLoadVault() {
  if (!plSlug) return;
  try {
    const d = await (await fetch('/api/personas/' + encodeURIComponent(plSlug) + '/media')).json();
    plVault = (d && d.vault) || [];
  } catch (e) { plVault = []; }
}

function plMediaById(id) {
  return plVault.find(m => m.id === id) || null;
}

function plShiftWeek(n) {
  const d = new Date(plWeekStart * 1000);
  d.setDate(d.getDate() + 7 * n);
  plWeekStart = plMonday(d);
  // Proposals belong to the week they were planned for.
  plProposed = [];
  plPlanMeta = null;
  plLoadQueue();
}

async function plLoadQueue() {
  if (!plSlug) return;
  document.getElementById('pl-range').textContent = rangeLabel(plWeekStart);
  const from = plWeekStart, to = plWeekStart + 7 * 86400;
  let d;
  try {
    d = await (await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&from=' + from + '&to=' + to)).json();
  } catch (e) {
    document.getElementById('pl-state').textContent = 'Could not read the queue.';
    return;
  }
  if (!d || !d.ok) {
    document.getElementById('pl-state').textContent = (d && d.error) || 'Could not read the queue.';
    return;
  }
  plQueue = d.queue || [];
  plRemote = d.remote || [];
  try {
    const ov = await (await fetch('/api/platforms/overview')).json();
    plConn = ((ov.personas || {})[plSlug]) || {};
  } catch (e) { plConn = {}; }
  plRender(d);
}

// ── Rendering ────────────────────────────────────────────────────────────────

function plStateLine(d) {
  const el = document.getElementById('pl-state');
  const off = [];
  if (!d.beta) off.push('this persona is not on the growth beta');
  if (!d.worker_on) off.push('the scheduler is switched off on this host');
  if (off.length) {
    el.className = 'pl-state is-off';
    el.textContent = 'Nothing will go out — ' + off.join(' and ')
      + '. Anything queued stays queued.';
    return;
  }
  el.className = 'pl-state';
  const t = d.totals || {};
  const bits = [(t.queued || 0) + ' queued this week'];
  if (t.next_at) bits.push('next ' + dayLabel(t.next_at) + ' ' + hourLabel(t.next_at)
    + ' (' + whenText(t.next_at) + ')');
  if (t.overdue) bits.push(t.overdue + ' past its slot and still waiting');
  if (t.failed) bits.push(t.failed + ' failed — a failed post is not retried, edit it and queue it fresh');
  el.textContent = bits.join(' · ') + '.';
}

function plConnectLine() {
  const el = document.getElementById('pl-connect');
  // Only nag about a channel this week actually uses.
  const used = new Set(plQueue.filter(r => r.status === 'queued').map(r => r.platform)
    .concat(plProposed.filter(s => s.publishable).map(s => s.platform)));
  const missing = PL_PUBLISHABLE.filter(
    p => used.has(p) && !((plConn[p] || {}).connected));
  if (!missing.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = 'No ' + missing.map(p => esc(PL_LABELS[p])).join(' or ')
    + ' account is connected for this persona, so those posts will fail when their slot comes. '
    + missing.map(p => '<a href="' + PL_CONNECT_AT[p] + '?persona=' + encodeURIComponent(plSlug)
        + '">Connect ' + esc(PL_LABELS[p]) + '</a>').join(' · ') + '.';
}

function plRender(d) {
  plStateLine(d);
  plConnectLine();

  const t = (d && d.totals) || {};
  const manual = plProposed.filter(s => !s.publishable).length + (t.manual || 0);
  document.getElementById('pl-stats').innerHTML =
    statTile('queued', t.queued || 0)
    + statTile('posted', t.posted || 0)
    + statTile('failed', t.failed || 0)
    + (plProposed.length ? statTile('proposed', plProposed.length) : '')
    + (manual ? statTile('by hand', manual) : '');

  const queueable = plProposed.filter(s => s.publishable && s.at > Date.now() / 1000).length;
  document.getElementById('pl-bulk').innerHTML = queueable
    ? '<button type="button" class="btn btn-primary" onclick="plQueueWeek(this)">Queue the '
      + queueable + ' ' + plAutoChannels() + ' post' + (queueable === 1 ? '' : 's') + '</button>'
      + (plPlanMeta && plPlanMeta.upcoming > plPlanMeta.cap
         ? '<span class="hint" style="margin-left:10px;">Only the first ' + plPlanMeta.cap
           + ' go in one round — plan again once those have gone out.</span>' : '')
    : '';

  // One card list per day: what is really queued, and what is only proposed.
  const cards = [];
  plQueue.forEach((r, i) => cards.push({
    kind: 'queued', at: r.run_at, platform: r.platform, status: r.status,
    text: r.text, error: r.error, attempts: r.attempts, id: r.id, idx: i,
    media: r.media_id ? plMediaById(r.media_id) : null
  }));
  plProposed.forEach((s, i) => cards.push({
    kind: 'proposed', at: s.at, platform: s.platform, publishable: s.publishable,
    text: s.idea, job: s.kind, idx: i
  }));
  // Posts made in the Fanvue app itself. Shown so the week is planned around
  // them, never edited from here — they are not ours to change.
  plRemote.forEach(r => cards.push({
    kind: 'remote', at: r.run_at, platform: r.platform, status: r.status,
    text: r.text, price: r.price_cents
  }));
  cards.sort((a, b) => a.at - b.at);

  const todayKey = new Date().toDateString();
  let html = '';
  for (let day = 0; day < 7; day++) {
    const start = plWeekStart + day * 86400, end = start + 86400;
    const date = new Date(start * 1000);
    const mine = cards.filter(c => c.at >= start && c.at < end);
    const cls = 'pl-day'
      + (date.toDateString() === todayKey ? ' is-today' : '')
      + (end < Date.now() / 1000 ? ' is-past' : '');
    html += '<div class="' + cls + '"><div class="pl-day-h">' + esc(dayLabel(start)) + '</div>'
      + (mine.length ? mine.map(plCard).join('') : '<div class="pl-empty">—</div>')
      + '</div>';
  }
  document.getElementById('pl-grid').innerHTML = html;
}

// The channels the proposals on screen can actually post to, named so the bulk
// button says what it is about to queue rather than naming a fixed pair.
function plAutoChannels() {
  const names = [];
  plProposed.forEach(s => {
    if (!s.publishable) return;
    const n = PL_LABELS[s.platform] || s.platform;
    if (names.indexOf(n) === -1) names.push(n);
  });
  if (!names.length) return '';
  if (names.length === 1) return names[0];
  return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
}

function plCard(c) {
  if (c.kind === 'remote') {
    const price = c.price ? ' · $' + (c.price / 100).toFixed(2) : '';
    return '<div class="pl-card is-remote" title="Made in Fanvue — edit it there">'
      + '<span class="pl-card-top"><span class="pl-when">' + hourLabel(c.at) + '</span>'
      + '<span class="pl-chan">' + esc(PL_LABELS[c.platform] || c.platform) + '</span>'
      + '<span class="pl-flag">' + esc((c.status === 'posted' ? 'on Fanvue' : 'scheduled') + price) + '</span></span>'
      + '<span class="pl-text">' + esc(c.text || 'no caption') + '</span></div>';
  }
  const manual = c.kind === 'proposed' ? !c.publishable : c.status === 'manual';
  const cls = 'pl-card ' + (c.kind === 'proposed'
    ? (manual ? 'is-proposed is-manual' : 'is-proposed')
    : (manual ? 'is-manual' : 'is-' + c.status));
  let flag = '';
  if (manual) flag = 'by hand';
  else if (c.kind === 'proposed') flag = PL_KIND[c.job] || c.job;
  else if (c.status === 'failed') flag = 'failed';
  else if (c.status === 'posted') flag = 'posted';
  else if (c.status === 'sending') flag = 'sending';
  else if (c.status === 'cancelled') flag = 'cancelled';
  return '<button type="button" class="' + cls + '" onclick="plEdit(\'' + c.kind + '\',' + c.idx + ')">'
    + '<span class="pl-card-top"><span class="pl-when">' + hourLabel(c.at) + '</span>'
    + '<span class="pl-chan">' + esc(PL_LABELS[c.platform] || c.platform) + '</span>'
    + (flag ? '<span class="pl-flag">' + esc(flag) + '</span>' : '') + '</span>'
    + (c.media ? plMediaThumb(c.media, ' is-card') : '')
    + '<span class="pl-text">' + esc(c.text || 'no angle yet') + '</span>'
    + (c.error ? '<span class="pl-flag" style="margin-left:0;">' + esc(c.error.slice(0, 60)) + '</span>' : '')
    + '</button>';
}

// ── Planning ─────────────────────────────────────────────────────────────────

async function plPlan(btn) {
  if (!plSlug) return;
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'planning…';
  try {
    const res = await fetch('/api/growth/plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: plSlug, start: plWeekStart, days: 7 })
    });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not plan the week.'); return; }
    plProposed = d.slots || [];
    plPlanMeta = d;
    if (!d.ideas) {
      alert('The angles came back empty, so every proposed card needs one typed in '
        + 'before it can be queued.');
    }
    plLoadQueue();
  } catch (e) { alert('Could not plan the week.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

async function plQueueWeek(btn) {
  const slots = plProposed.filter(s => s.publishable);
  if (!slots.length) return;
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'writing them…';
  try {
    const res = await fetch('/api/growth/plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: plSlug, action: 'queue', slots: slots })
    });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not queue them.'); return; }
    let msg = d.queued.length + ' post' + (d.queued.length === 1 ? '' : 's') + ' queued.';
    if (d.failed.length) msg += ' ' + d.failed.length + ' could not be written.';
    if (d.skipped) msg += ' ' + d.skipped + ' were over the ' + d.cap + '-post limit for one round.';
    // The ones that went in are real rows now; anything left is still by hand.
    plProposed = plProposed.filter(s => !s.publishable);
    plLoadQueue();
    alert(msg);
  } catch (e) { alert('Could not queue them.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

// ── The editor ───────────────────────────────────────────────────────────────

// A blank post. Defaults to the next round hour so the time box is never the
// thing standing between an idea and the calendar.
function plNew() {
  if (!plSlug) return;
  const soon = new Date();
  soon.setMinutes(0, 0, 0);
  soon.setHours(soon.getHours() + 1);
  let at = Math.floor(soon.getTime() / 1000);
  // Opened on a week that is not this one, the post belongs to that week.
  if (at < plWeekStart || at >= plWeekStart + 7 * 86400) at = plWeekStart + 9 * 3600;
  plOpen = { kind: 'new', idx: -1, id: '', platform: 'x', at: at, publishable: true };
  plChans = ['x'];
  plPickedMedia = '';

  document.getElementById('pl-m-title').textContent = 'New post';
  document.getElementById('pl-m-meta').textContent =
    'Pick the channels, set the time, write it. Nothing exists until you save.';
  const when = document.getElementById('pl-m-when');
  when.value = toLocalInput(at);
  when.disabled = false;
  document.getElementById('pl-m-when-field').style.display = '';

  const ta = document.getElementById('pl-m-text');
  ta.value = '';
  ta.disabled = false;
  document.getElementById('pl-m-label').textContent = 'Post';
  document.getElementById('pl-m-hint').textContent =
    'Type an angle and press Write it, or write the post yourself.';
  document.getElementById('pl-m-write').style.display = '';
  document.getElementById('pl-m-write').textContent = '✨ Write it';
  document.getElementById('pl-m-cancel').style.display = 'none';
  document.getElementById('pl-m-delete').style.display = 'none';
  const save = document.getElementById('pl-m-save');
  save.style.display = '';
  save.textContent = 'Add to the week';

  plRenderChans();
  plRenderFanvue('', 0);
  plCount();
  plRenderMedia();
  document.getElementById('pl-modal').classList.add('open');
}

// The audience and the price are Fanvue's alone, so the field only exists while
// Fanvue is one of the channels this post is going to.
function plRenderFanvue(audience, priceCents) {
  const on = plOpen && (plOpen.kind === 'new'
    ? plChans.indexOf('fanvue') !== -1 : plOpen.platform === 'fanvue');
  document.getElementById('pl-m-fanvue-field').hidden = !on;
  if (!on) return;
  if (audience !== undefined) {
    document.getElementById('pl-m-audience').value = audience || 'followers-and-subscribers';
  }
  if (priceCents !== undefined) {
    document.getElementById('pl-m-price').value = priceCents ? (priceCents / 100).toFixed(2) : '';
  }
}

// What the two Fanvue boxes say right now, or null when they are not showing.
function plFanvueFields() {
  if (document.getElementById('pl-m-fanvue-field').hidden) return null;
  const dollars = parseFloat(document.getElementById('pl-m-price').value);
  return {
    audience: document.getElementById('pl-m-audience').value,
    price_cents: isNaN(dollars) || dollars <= 0 ? 0 : Math.round(dollars * 100)
  };
}

function plRenderChans() {
  const field = document.getElementById('pl-m-chans-field');
  field.hidden = !plOpen || plOpen.kind !== 'new';
  if (field.hidden) return;
  document.getElementById('pl-m-chans').innerHTML = Object.keys(PL_LABELS).map(p => {
    const on = plChans.indexOf(p) !== -1;
    const hand = PL_PUBLISHABLE.indexOf(p) === -1;
    return '<label class="pl-chan-pick' + (on ? ' on' : '') + '">'
      + '<input type="checkbox"' + (on ? ' checked' : '')
      + ' onchange="plToggleChan(\'' + p + '\')">'
      + esc(PL_LABELS[p])
      + (hand ? '<span class="by-hand">by hand</span>' : '') + '</label>';
  }).join('');
  const hand = plChans.filter(p => PL_PUBLISHABLE.indexOf(p) === -1);
  document.getElementById('pl-m-chans-hint').textContent = !plChans.length
    ? 'Pick at least one.'
    : hand.length
      ? hand.map(p => PL_LABELS[p]).join(' and ') + ' cannot be posted from here, so '
        + (hand.length === 1 ? 'it lands' : 'they land')
        + ' on the calendar as a reminder to post by hand.'
      : 'One post per channel, each trimmed to that channel\'s limit.';
}

function plToggleChan(p) {
  const i = plChans.indexOf(p);
  if (i === -1) plChans.push(p); else plChans.splice(i, 1);
  // The media strip and the counter follow the strictest channel ticked.
  plOpen.platform = plChans[0] || 'x';
  plOpen.publishable = plChans.every(c => PL_PUBLISHABLE.indexOf(c) !== -1);
  plRenderChans();
  plRenderFanvue();
  plCount();
  plRenderMedia();
}

function plEdit(kind, idx) {
  const row = kind === 'queued' ? plQueue[idx] : plProposed[idx];
  if (!row) return;
  const at = kind === 'queued' ? row.run_at : row.at;
  const plat = row.platform;
  // A queued row on a by-hand channel is a reminder, not something that posts
  // itself, so it reads as manual here exactly like a proposal does.
  const publishable = kind === 'queued'
    ? PL_PUBLISHABLE.indexOf(plat) !== -1
    : row.publishable;
  const editable = kind === 'proposed'
    || row.status === 'queued' || row.status === 'manual';
  plOpen = { kind: kind, idx: idx, id: row.id || '', platform: plat, at: at, publishable: publishable };

  document.getElementById('pl-m-title').textContent =
    dayLabel(at) + ' ' + hourLabel(at) + ' · ' + (PL_LABELS[plat] || plat);
  document.getElementById('pl-m-meta').textContent = kind === 'proposed'
    ? 'Proposed — ' + (PL_KIND[row.kind] || row.kind)
      + (publishable ? '. Nothing exists until you queue it.'
                     : '. This channel has no posting API she is allowed to use, so adding it '
                       + 'puts a reminder on the calendar to post it yourself.')
    : (PL_STATUS[row.status] || row.status)
      + (row.attempts > 1 ? ' After ' + row.attempts + ' tries.' : '')
      + (row.error ? ' ' + row.error : '');

  const when = document.getElementById('pl-m-when');
  when.value = toLocalInput(at);
  // Every post has a slot now, whether it goes out on its own or is a reminder
  // to post it by hand, so the time is worth setting either way.
  when.disabled = !editable;
  document.getElementById('pl-m-when-field').style.display = '';

  const ta = document.getElementById('pl-m-text');
  ta.value = kind === 'queued' ? (row.text || '') : (row.idea || '');
  ta.disabled = !editable;
  document.getElementById('pl-m-label').textContent = kind === 'proposed' ? 'The angle' : 'Post';
  document.getElementById('pl-m-hint').textContent = kind === 'proposed'
    ? 'Edit the angle, then let her write the post from it.'
    : '';

  document.getElementById('pl-m-write').style.display = editable ? '' : 'none';
  document.getElementById('pl-m-write').textContent = kind === 'proposed' ? '✨ Write it' : '✨ Rewrite';
  document.getElementById('pl-m-cancel').style.display =
    (kind === 'queued' && row.status === 'queued') ? '' : 'none';
  // Only a stored row can be deleted; a proposal disappears by itself.
  document.getElementById('pl-m-delete').style.display =
    (kind === 'queued' && row.status !== 'sending') ? '' : 'none';
  const save = document.getElementById('pl-m-save');
  save.style.display = editable ? '' : 'none';
  save.textContent = kind === 'proposed'
    ? (publishable ? 'Queue it' : 'Add to the week') : 'Save changes';

  // A proposal has no media until one is attached here; a queued row remembers.
  plPickedMedia = row.media_id || '';
  plChans = [];
  plRenderChans();
  plRenderFanvue(row.audience || '', row.price_cents || 0);
  plCount();
  plRenderMedia();
  document.getElementById('pl-modal').classList.add('open');
}

function plMediaThumb(m, extra) {
  return '<span class="pl-thumb' + (extra || '') + '">'
    + (m.kind === 'video'
        ? '<video src="' + esc(m.thumb) + '" muted playsinline preload="metadata"></video>'
          + '<span class="pl-thumb-tag">video</span>'
        : '<img src="' + esc(m.thumb) + '" alt="" loading="lazy">')
    + '</span>';
}

function plRenderMedia() {
  const field = document.getElementById('pl-m-media-field');
  if (!plOpen) return;
  const chans = plOpenChans();
  // One photo goes to every channel ticked, so only a kind they all take can
  // be offered — TikTok takes video and Reddit takes stills, and picking both
  // leaves nothing that satisfies the pair.
  const allowed = chans.length
    ? chans.map(p => PL_MEDIA[p] || [])
        .reduce((a, b) => a.filter(k => b.indexOf(k) !== -1))
    : [];
  const usable = plVault.filter(m => allowed.indexOf(m.kind || 'image') !== -1);
  field.style.display = chans.length ? '' : 'none';
  if (plPickedMedia && !usable.some(m => m.id === plPickedMedia)) plPickedMedia = '';

  const picked = plPickedMedia ? plMediaById(plPickedMedia) : null;
  document.getElementById('pl-m-picked').innerHTML = picked
    ? plMediaThumb(picked, ' is-picked')
      + '<button type="button" class="btn-section-save" style="margin-left:10px;"'
      + ' onclick="plPickMedia(\'\')">Remove</button>'
      + (plOpen.publishable ? ''
         : '<a class="btn-section-save" style="margin-left:6px; text-decoration:none;"'
           + ' href="' + esc(picked.thumb) + '" download target="_blank" rel="noopener">Download</a>')
    : '<span class="hint">Nothing attached.</span>';

  document.getElementById('pl-m-media-note').textContent =
    allowed.length ? allowed.join(' or ') : 'nothing fits every channel';
  document.getElementById('pl-m-strip').innerHTML = usable.length
    ? usable.map(m => '<button type="button" class="pl-pick'
        + (m.id === plPickedMedia ? ' on' : '') + '" title="' + esc(m.purpose || m.kind)
        + '" onclick="plPickMedia(\'' + esc(m.id) + '\')">'
        + plMediaThumb(m) + '</button>').join('')
    : '<span class="hint">' + (allowed.length
        ? 'Nothing in the library ' + (chans.length > 1 ? 'all these channels' : 'this channel')
          + ' will take. Add photos and clips in the persona editor.'
        : 'These channels take different kinds of media, so no one file suits '
          + 'them all. Post them separately to attach something.') + '</span>';

  document.getElementById('pl-m-media-hint').textContent = !picked ? ''
    : plOpen.publishable
      ? (plOpen.platform === 'threads'
          ? 'Threads collects the file from us, so it has to be publicly reachable when the slot comes round.'
          : 'Uploaded to X when the post goes out.')
      : 'This channel has no posting API — download the file and post it yourself.';
}

function plPickMedia(id) {
  plPickedMedia = (id === plPickedMedia) ? '' : id;
  plRenderMedia();
}

function plClose() {
  document.getElementById('pl-modal').classList.remove('open');
  plOpen = null;
}

// The channels the open editor is writing for: several on a new post, one
// everywhere else.
function plOpenChans() {
  if (!plOpen) return [];
  return plOpen.kind === 'new' ? plChans.slice() : [plOpen.platform];
}

function plCount() {
  if (!plOpen) return;
  const chans = plOpenChans();
  // Posting to several channels at once, the tightest cap is the one that
  // matters — anything longer is silently trimmed on the strictest of them.
  const cap = chans.length
    ? Math.min.apply(null, chans.map(p => PL_CAPS[p] || 280))
    : 280;
  const n = document.getElementById('pl-m-text').value.length;
  const el = document.getElementById('pl-m-count');
  el.textContent = n + '/' + cap;
  el.className = 'pl-count' + (n > cap ? ' over' : '');
}

async function plWrite(btn) {
  if (!plOpen) return;
  const ta = document.getElementById('pl-m-text');
  const idea = plOpen.kind === 'proposed'
    ? ta.value.trim()
    : (prompt('What should she write about instead?', '') || '').trim();
  if (!idea) return;
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'writing…';
  try {
    const res = await fetch('/api/growth/drafts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona: plSlug, idea: idea, platforms: [plOpen.platform] })
    });
    const d = await res.json();
    const draft = (d.drafts || [])[0];
    if (!d.ok || !draft || !draft.text) {
      alert((draft && draft.error) || d.error || 'She could not write that one.');
      return;
    }
    ta.value = draft.text;
    // A proposed card becomes a draft the moment it has words: the angle box is
    // now the post, so saying "Queue it" no longer needs a second round trip.
    if (plOpen.kind === 'proposed') {
      plOpen.written = true;
      document.getElementById('pl-m-label').textContent = 'Post';
      document.getElementById('pl-m-hint').textContent =
        plOpen.publishable ? 'Queue it, or edit it first.' : 'Copy it out and post it yourself.';
    }
    plCount();
  } catch (e) { alert('She could not write that one.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

function plCopy(btn) {
  const ta = document.getElementById('pl-m-text');
  if (!ta.value) return;
  const done = () => { const w = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = w; }, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, done);
  else { ta.select(); document.execCommand('copy'); done(); }
}

async function plSave(btn) {
  if (!plOpen) return;
  const text = document.getElementById('pl-m-text').value.trim();
  const at = fromLocalInput(document.getElementById('pl-m-when').value);
  if (!text) { alert('Nothing to post.'); return; }
  if (!at) { alert('That is not a time.'); return; }

  const fv = plFanvueFields();
  if (fv && fv.price_cents && !plPickedMedia) {
    alert('A paid Fanvue post needs media behind the price.'); return;
  }
  if (fv && fv.price_cents && fv.price_cents < PL_FV_PRICE_MIN) {
    alert('Fanvue will not take a price under $' + (PL_FV_PRICE_MIN / 100).toFixed(2) + '.');
    return;
  }

  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'saving…';
  try {
    let res;
    if (plOpen.kind === 'new') {
      res = await fetch('/api/growth/queue', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: plSlug, platforms: plChans, text: text,
                               run_at: at, media_id: plPickedMedia,
                               ...(fv || {}) })
      });
    } else if (plOpen.kind === 'proposed') {
      if (!plOpen.written) {
        alert('Write the post first — what is in the box is still the angle.');
        return;
      }
      res = await fetch('/api/growth/queue', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: plSlug, platform: plOpen.platform, text: text,
                               run_at: at, media_id: plPickedMedia,
                               ...(fv || {}) })
      });
    } else {
      res = await fetch('/api/growth/queue', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona: plSlug, id: plOpen.id, text: text,
                               run_at: at, media_id: plPickedMedia,
                               ...(fv || {}) })
      });
    }
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not save it.'); return; }
    // Some channels can succeed while others are refused — say which, rather
    // than letting a half-done save look complete.
    if ((d.failed || []).length) {
      alert(d.failed.map(f => (PL_LABELS[f.platform] || f.platform) + ': ' + f.error).join('\n'));
    }
    if (plOpen.kind === 'proposed') plProposed.splice(plOpen.idx, 1);
    plClose();
    plLoadQueue();
  } catch (e) { alert('Could not save it.'); }
  finally { btn.disabled = false; btn.textContent = was; }
}

async function plCancelPost(btn) {
  if (!plOpen || !plOpen.id) return;
  if (!confirm('Cancel this post? It will not go out.')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&id=' + encodeURIComponent(plOpen.id), { method: 'DELETE' });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not cancel it.'); return; }
    plClose();
    plLoadQueue();
  } catch (e) { alert('Could not cancel it.'); }
  finally { btn.disabled = false; }
}

async function plDeletePost(btn) {
  if (!plOpen || !plOpen.id) return;
  if (!confirm('Delete this post? It comes off the calendar for good.')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/growth/queue?persona=' + encodeURIComponent(plSlug)
      + '&id=' + encodeURIComponent(plOpen.id) + '&mode=delete', { method: 'DELETE' });
    const d = await res.json();
    if (!d.ok) { alert(d.error || 'Could not delete it.'); return; }
    plClose();
    plLoadQueue();
  } catch (e) { alert('Could not delete it.'); }
  finally { btn.disabled = false; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('pl-modal').classList.contains('open')) plClose();
});

plInit();
</script>
</body>
</html>
