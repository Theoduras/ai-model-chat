<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #18181b;
    --surface2: #27272a;
    --border: #2a2a2d;
    --accent: #7c3aed;
    --accent-msg: #6d28d9;
    --text: #f4f4f5;
    --text-muted: #71717a;
    --text-dim: #52525b;
    --online: #22c55e;
    --bubble-bot: #1e1e22;
    --bubble-user: #3b1f6b;
    --radius-bubble: 20px;
    --header-h: 72px;
    --input-h: 72px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* ── Desktop: centred card ── */
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .chat-container {
    width: 100%;
    max-width: 520px;
    height: min(780px, calc(100vh - 48px));
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: 24px;
    border: 1px solid var(--border);
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    flex-shrink: 0;
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  .header-avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .header-avatar-wrap img {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface2);
    display: block;
  }

  .online-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--online);
    border: 2px solid var(--surface);
    box-shadow: 0 0 6px rgba(34,197,94,0.5);
  }

  .header-info { flex: 1; min-width: 0; }

  .header-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .header-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-status-chip {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 3px;
  }

  .header-right {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .conn-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }
  .conn-dot.ok { background: var(--online); }
  .conn-dot.err { background: #ef4444; }

  .user-chip {
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 9999px;
    border: 1px solid var(--border);
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-chip:hover { border-color: var(--accent); color: var(--text); }

  /* ── Chat window ── */
  .chat-window {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
    background: var(--bg);
  }

  /* Scrollbar */
  .chat-window::-webkit-scrollbar { width: 4px; }
  .chat-window::-webkit-scrollbar-track { background: transparent; }
  .chat-window::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 9999px; }

  /* Date separator */
  .date-sep {
    align-self: center;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface);
    padding: 3px 12px;
    border-radius: 9999px;
    margin: 10px 0 6px;
    user-select: none;
  }

  /* Message rows */
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 2px;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot  { justify-content: flex-start; }

  .msg-av {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface2);
    flex-shrink: 0;
    align-self: flex-end;
  }
  .msg-av-spacer { width: 28px; flex-shrink: 0; }

  .bubble {
    max-width: min(72%, 360px);
    padding: 11px 15px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    position: relative;
  }

  /* Bot bubble */
  .msg-row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border-radius: var(--radius-bubble) var(--radius-bubble) var(--radius-bubble) 6px;
    border: 1px solid var(--border);
  }

  /* User bubble */
  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: #e9d5ff;
    border-radius: var(--radius-bubble) var(--radius-bubble) 6px var(--radius-bubble);
  }

  /* Consecutive messages: tighten radius */
  .msg-row.bot.cont .bubble  { border-top-left-radius: 6px; }
  .msg-row.user.cont .bubble { border-top-right-radius: 6px; }

  .bubble-time {
    display: block;
    font-size: 10px;
    margin-top: 5px;
    opacity: 0.45;
    text-align: right;
  }

  /* Typing indicator */
  .typing-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 2px 0 4px;
    display: none;
  }

  .typing-bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-radius: var(--radius-bubble) var(--radius-bubble) var(--radius-bubble) 6px;
    padding: 12px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.18s; }
  .typing-dot:nth-child(3) { animation-delay: 0.36s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Input area ── */
  .input-area {
    flex-shrink: 0;
    padding: 12px 16px calc(12px + var(--safe-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9999px;
    padding: 0 16px;
    transition: border-color 0.15s;
    min-height: 46px;
  }
  .input-wrap:focus-within { border-color: var(--accent); }

  .input-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 12px 0;
    min-width: 0;
  }
  .input-wrap input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  .send-btn:hover  { background: #6d28d9; }
  .send-btn:active { transform: scale(0.93); }
  .send-btn svg { width: 20px; height: 20px; }

  /* ── Mobile: full-screen ── */
  @media (max-width: 600px) {
    body {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }
    .chat-container {
      max-width: 100%;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    .header { height: auto; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
    .bubble { max-width: 82%; }
  }

  /* ── Embed (iframe) mode ── */
  body.embed {
    padding: 0;
    align-items: stretch;
    justify-content: stretch;
  }
  body.embed .chat-container {
    max-width: 100%;
    width: 100%;
    height: 100%;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
</style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="header">
    <div class="header-avatar-wrap">
      <img id="header-avatar" src="https://picsum.photos/id/1011/48/48" alt="">
      <div class="online-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-name" id="header-name">…</div>
      <div class="header-meta" id="header-status"></div>
    </div>
    <div class="header-right">
      <div class="conn-indicator">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-text">…</span>
      </div>
      <div class="user-chip" id="user-name" title="Click to switch user">…</div>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-window" id="chat">
    <!-- Typing indicator lives inside the scroll area -->
    <div class="typing-row" id="typing-row">
      <img class="msg-av" id="typing-av" src="https://picsum.photos/id/1011/48/48" alt="">
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Send a message…" autocomplete="off" enterkeyhint="send">
    </div>
    <button class="send-btn" onclick="se()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>

<script>
const chatEl=document.getElementById('chat'),inp=document.getElementById('input'),typingRow=document.getElementById('typing-row');
let u=null,m={recentTopics:[],lastTopic:null},h=[],s=3.5,l=Date.now(),autoCount=0,avatarUrl=null,personaName='…';
const persona=new URLSearchParams(location.search).get('persona')||'lilith';
const PFX='persona_'+persona+'_';

// Embed detection
if(window.self!==window.top){document.body.classList.add('embed');u='EmbedUser';localStorage.setItem(PFX+'user',u);}

// Load persona config
fetch('/api/personas/'+persona).then(r=>r.ok?r.json():null).then(d=>{
  if(!d)return;
  const cfg=d.config||{};
  personaName=cfg.name||persona;
  document.title='Chat with '+personaName;
  document.getElementById('header-name').textContent=personaName;
  document.getElementById('header-avatar').alt=personaName;
  if(cfg.avatar){
    avatarUrl='/api/personas/'+persona+'/avatar';
    document.getElementById('header-avatar').src=avatarUrl;
    document.getElementById('typing-av').src=avatarUrl;
  }
  const parts=[];
  if(cfg.location&&!cfg.mirror_location)parts.push(cfg.location);
  if(cfg.age)parts.push(cfg.age);
  document.getElementById('header-status').textContent=parts.join(' · ');
  inp.placeholder='Message '+personaName+'…';
}).catch(()=>{});

function chatBody(extra){
  const sp=localStorage.getItem('persona_prompt_'+persona);
  return JSON.stringify({...extra,user:u,persona,...(sp?{system_prompt:sp}:{})});
}

function sc(){if(u)localStorage.setItem(PFX+'chat_'+u,JSON.stringify(h));}
function sm(){if(u)localStorage.setItem(PFX+'mem_'+u,JSON.stringify(m));}

function ld(){
  u=localStorage.getItem(PFX+'user');
  if(!u&&window.self===window.top){
    u=prompt("What's your name (or nickname)?")||"Guest-"+Math.floor(Math.random()*9000+1000);
    localStorage.setItem(PFX+'user',u);
  }
  m={recentTopics:[],lastTopic:null};
  let sv=localStorage.getItem(PFX+'mem_'+u);if(sv)try{m={...m,...JSON.parse(sv)}}catch(e){}
  h=[];let ch=localStorage.getItem(PFX+'chat_'+u);if(ch)try{h=JSON.parse(ch)}catch(e){}
  const el=document.getElementById('user-name');
  if(el){el.textContent=u||'Guest';el.onclick=cu;el.title='Switch user';}
  chatEl.innerHTML='';
  // Re-append typing row
  chatEl.appendChild(typingRow);
  h.forEach(x=>{insertMsg(x.content,x.role==='user')});
  chatEl.scrollTop=chatEl.scrollHeight;
}

function cu(){
  const n=prompt("Switch to a different person:",u||"");
  if(n&&n.trim()&&n!==u){sm();sc();u=n.trim();localStorage.setItem(PFX+'user',u);ld();setTimeout(()=>addMsg("hey, you're back 👀",false),400);}
}

function ts(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

function insertMsg(text,isUser){
  // Ensure typing row stays at bottom
  const prev=chatEl.lastElementChild;
  const prevIsUser=prev&&prev.classList.contains('user');
  const prevIsBot=prev&&prev.classList.contains('bot');
  const cont=(isUser&&prevIsUser)||((!isUser)&&prevIsBot);

  const row=document.createElement('div');
  row.className='msg-row '+(isUser?'user':'bot')+(cont?' cont':'');

  if(!isUser){
    if(avatarUrl&&!cont){
      const av=document.createElement('img');
      av.className='msg-av';av.src=avatarUrl;av.alt=personaName;
      row.appendChild(av);
    } else {
      const sp=document.createElement('div');
      sp.className='msg-av-spacer';
      row.appendChild(sp);
    }
  }

  const bub=document.createElement('div');
  bub.className='bubble';
  bub.innerHTML=text+'<span class="bubble-time">'+ts()+'</span>';
  row.appendChild(bub);

  chatEl.insertBefore(row,typingRow);
  chatEl.scrollTop=chatEl.scrollHeight;
  return row;
}

function addMsg(text,isUser){
  const r=isUser?'user':'bot';
  if(h.length&&h[h.length-1].role===r&&h[h.length-1].content.trim()===text.trim())return;
  h.push({role:r,content:text});
  insertMsg(text,isUser);
  sc();
}

function showTyping(on){
  typingRow.style.display=on?'flex':'none';
  if(on)chatEl.scrollTop=chatEl.scrollHeight;
}

function um(x){const r=x.toLowerCase();const t=[];if(/jizzle|gnome|wow|classic|raid|zug|warrior|tank/.test(r))t.push('gaming');if(/bar|shift|pub|venue|work|pint/.test(r))t.push('work');if(/music|show|band|gig|rave|metal/.test(r))t.push('music');if(t.length){m.recentTopics=[...m.recentTopics,...t].slice(-4);m.lastTopic=t[t.length-1];}}

function splitChunks(text){
  if(text.length<120)return[text];
  const parts=text.match(/[^.!?…]*[.!?…]+(?=\s|$)|[^.!?…]+$/g)||[text];
  const clean=parts.map(s=>s.trim()).filter(Boolean);
  if(clean.length<=2)return[text];
  // max 2 chunks: first half and second half of sentences
  const mid=Math.ceil(clean.length/2);
  return[clean.slice(0,mid).join(' '),clean.slice(mid).join(' ')].filter(Boolean);
}

function deliverChunks(chunks,idx,onDone){
  if(idx>=chunks.length){if(onDone)onDone();return;}
  showTyping(false);
  addMsg(chunks[idx],false);
  if(idx+1<chunks.length){
    const next=chunks[idx+1];
    const delay=2500+next.length*20+Math.random()*3000;
    setTimeout(()=>{showTyping(true);setTimeout(()=>deliverChunks(chunks,idx+1,onDone),delay);},200);
  } else {
    if(onDone)onDone();
  }
}

function cs(text,cb){
  ss(true);
  const chunks=splitChunks(text);
  deliverChunks(chunks,0,cb);
}

let st=null,ot=null;
function ri(){clearTimeout(st);clearTimeout(ot);}

function si(){
  ri();
  st=setTimeout(()=>{
    const delay=2000+Math.random()*2000;
    showTyping(true);
    setTimeout(()=>{showTyping(false);addMsg("still there?",false);ss(true);},delay);
  },300000);
  ot=setTimeout(()=>{addMsg("i'll catch you later 💜",false);ss(false);},480000);
}

function se(){
  const x=inp.value.trim();if(!x)return;
  ri();
  addMsg(x,true);um(x);sm();
  inp.value='';
  const n=Date.now(),d=(n-l)/1000;
  if(d>.7&&x.length>2){const v=x.length/d;s=Math.max(3.5,Math.min(18,s*.6+v*.4));}
  l=n;
  const initialDelay=15000+Math.random()*75000;
  showTyping(true);
  setTimeout(()=>{
    fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:chatBody({message:x,history:h.slice(0,-1)})})
    .then(r=>r.json()).then(d=>{
      if(d.reply){
        const last=h[h.length-1];
        if(last&&last.role==='bot'&&last.content.trim()===d.reply.trim()){showTyping(false);ss(true);si();return;}
        cs(d.reply,si);
      } else if(d.error){showTyping(false);addMsg("something went weird on my end. try again?",false);ss(false);}
    }).catch(e=>{showTyping(false);addMsg("something went wrong. please try again.",false);ss(false);});
  },initialDelay);
}

function ss(ok){
  const dot=document.getElementById('conn-dot');
  const txt=document.getElementById('conn-text');
  if(dot){dot.className='conn-dot '+(ok?'ok':'err');}
  if(txt){txt.textContent=ok?'Online':'Offline';}
}

function ck(){fetch('/').then(()=>ss(true)).catch(()=>ss(false));}

inp.addEventListener('keypress',e=>{if(e.key==='Enter')se();});
ld();
if(h.length===0){
  const greetDelay=3000+Math.random()*5000;
  setTimeout(()=>{addMsg("heyy 👋",false);si();},greetDelay);
}
ss(false);ck();setInterval(ck,10000);
</script>
</body>
</html>
