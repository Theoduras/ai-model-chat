<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Lilith</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
  .chat-container { max-width: 600px; margin: 40px auto; background: #1a1a1a; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .header { background: #111; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .header img { width: 48px; height: 48px; border-radius: 50%; }
  .header .info { flex: 1; }
  .header .name { font-weight: 600; font-size: 18px; }
  .header .status { color: #22c55e; font-size: 13px; }
  .chat-window { height: 500px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #111; }
  .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15.5px; line-height: 1.45; }
  .user { align-self: flex-end; background: #4a2c2c; border-bottom-right-radius: 4px; }
  .user-id { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  .bot { align-self: flex-start; background: #27272a; border-bottom-left-radius: 4px; }
  .typing { align-self: flex-start; background: #27272a; padding: 12px 16px; border-radius: 18px; font-style: italic; display: none; }
  .input-area { display: flex; padding: 16px; background: #1a1a1a; gap: 10px; }
  input { flex: 1; padding: 14px 18px; border: none; border-radius: 9999px; background: #111; color: #fff; font-size: 16px; }
  button { padding: 0 28px; background: #4a2c2c; color: white; border: none; border-radius: 9999px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <img src="https://picsum.photos/id/1011/48/48" alt="Lilith">
    <div class="info">
      <div class="name">Lilith</div>
      <div class="status">● Bristol • Barmaid &amp; Tank Main</div>
      <div class="user-id">chatting with <span id="user-name" style="cursor: pointer; text-decoration: underline;">...</span></div>
    </div>
  </div>
  <div class="chat-window" id="chat"></div>
  <div class="typing" id="typing">Lilith is typing...</div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Message Lilith..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>

  <!-- Grok-powered reply area: Use free Grok (grok.x.ai) with full chat + character bible for smart replies -->
  <div id="grok-area" style="margin-top: 8px; padding: 8px; background: #222; border-radius: 8px;">
    <div style="font-size: 12px; color: #aaa; margin-bottom: 4px;">
      Smart reply via Grok (reads full chat + Lilith bible): 
      <button onclick="copyGrokPrompt()" style="font-size:11px; padding: 2px 6px;">Copy prompt for free Grok</button>
    </div>
    <div style="display: flex; gap: 6px;">
      <input type="text" id="grok-reply-input" placeholder="Paste Grok's reply as Lilith here..." style="flex:1; padding: 8px; border-radius: 9999px; background:#111; color:#fff; border:1px solid #444;">
      <button onclick="sendGrokReply()" style="padding: 0 16px; background:#4a2c2c; color:white; border:none; border-radius:9999px;">Send as Lilith</button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const typing = document.getElementById('typing');

// === Persistent Per-Person Topic Memory ===
// Memory survives page reloads and is unique per person (keyed by name/alias)
let currentUser = null;
let memory = {
  recentTopics: [],
  lastTopic: null
};

// Full chat history for context (used to "read the chat" like Grok would)
let chatHistory = []; // {role: 'user' | 'lilith', content: string}

function loadUserAndMemory() {
  currentUser = localStorage.getItem('lilith_current_user');
  if (!currentUser) {
    currentUser = prompt("Lilith remembers each person separately.\nWhat's your name (or nickname)?") || ("Guest-" + Math.floor(Math.random() * 9000 + 1000));
    localStorage.setItem('lilith_current_user', currentUser);
  }

  const saved = localStorage.getItem('lilith_memory_' + currentUser);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      memory = { ...memory, ...parsed };
    } catch (e) {}
  }

  updateUserDisplay();
}

function saveMemory() {
  if (currentUser) {
    localStorage.setItem('lilith_memory_' + currentUser, JSON.stringify(memory));
  }
}

function updateUserDisplay() {
  const el = document.getElementById('user-name');
  if (el) {
    el.textContent = currentUser || 'Guest';
    el.onclick = changeUser;
    el.title = 'Click to switch user / start new memory';
  }
}

// Build a full prompt that Grok (free version) can use: includes Lilith character + full chat history
function buildGrokPrompt(lastUserMessage) {
  const characterPrompt = `You are Lilith (birth name Lily), 22, Bristol barmaid at a metal pub. 
Key traits from character bible:
- Deadpan, precise, correct grammar. Short conversational sentences.
- Dry observation as plain fact. Never explain the joke.
- Specific details. Warmth without announcement.
- Music: mood/feeling only, never artist names.
- Reference: bar shifts, Jizzle (pink pigtail gnome warrior tank in WoW Classic), Bristol life, family (goth mum + metal dad, sister Deb), your look (black/blonde hair, freckles makeup, left hand tattoos), guild friends.
- Darkness is your happy place, not emotional.
- Build interest in the other person: ask natural questions about them.
- Always give logical, direct answers to what they said.
- Open many replies with a question to continue the chat naturally.

Stay 100% in character as Lilith. Use conversation history for context. Never break character.`;

  let historyText = chatHistory.slice(-10).map(m => {
    return `${m.role === 'user' ? 'User' : 'Lilith'}: ${m.content}`;
  }).join('\n');

  return `${characterPrompt}

Conversation so far:
${historyText}

User just said: ${lastUserMessage}

Respond ONLY as Lilith with a short, natural, conversational reply. Be logical to what was said. Ask a question to build interest if it fits.`;
}

function changeUser() {
  const newName = prompt("Switch to a different person (new unique memory):", currentUser || "");
  if (newName && newName.trim() && newName !== currentUser) {
    // Save current before switching
    saveMemory();
    currentUser = newName.trim();
    localStorage.setItem('lilith_current_user', currentUser);

    // Load or create new memory for this user
    const saved = localStorage.getItem('lilith_memory_' + currentUser);
    memory = { recentTopics: [], lastTopic: null };
    if (saved) {
      try { memory = { ...memory, ...JSON.parse(saved) }; } catch(e){}
    }
    updateUserDisplay();

    // Optional: greet as if resuming
    setTimeout(() => {
      addMessage("Back again? What's new?", false);
    }, 400);
  }
}

function extractTopics(text) {
  const l = text.toLowerCase();
  const topics = [];
  if (/jizzle|gnome|wow|classic|raid|zug|warrior|tank/.test(l)) topics.push('jizzle');
  if (/bar|shift|pub|venue|work|pint/.test(l)) topics.push('bar');
  if (/music|show|band|gig|rave|metal/.test(l)) topics.push('music');
  if (/bristol/.test(l)) topics.push('bristol');
  if (/sister|deb|family|mum|dad|parents/.test(l)) topics.push('family');
  if (/freckle|makeup|liner|hair|look/.test(l)) topics.push('look');
  if (/friend|guild|crew/.test(l)) topics.push('friends');
  return topics;
}

function updateMemory(userText) {
  const newTopics = extractTopics(userText);
  if (newTopics.length > 0) {
    memory.recentTopics = [...memory.recentTopics, ...newTopics].slice(-4); // keep last 4 topics
    memory.lastTopic = newTopics[newTopics.length - 1];
  }
}

function getContextPhrase() {
  if (!memory.lastTopic) return '';
  const phrases = {
    'jizzle': " Jizzle's been on my mind too.",
    'bar': " Reminds me of last shift.",
    'music': " Yeah, the music does that.",
    'bristol': " Bristol always finds a way in.",
    'family': " Family stuff sticks with you.",
    'look': " The look takes work.",
    'friends': " The crew would say the same."
  };
  return phrases[memory.lastTopic] || '';
}

function addMessage(text, isUser) {
  const role = isUser ? 'user' : 'lilith';
  chatHistory.push({ role, content: text });

  const msg = document.createElement('div');
  msg.className = `message ${isUser ? 'user' : 'bot'}`;
  msg.innerHTML = text + `<div style="font-size:11px;opacity:0.5;margin-top:4px;">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() { typing.style.display = 'block'; chat.scrollTop = chat.scrollHeight; }
function hideTyping() { typing.style.display = 'none'; }

function getBotReply(text) {
  const lower = text.toLowerCase().trim();

  // Short, conversational. Give a logical reply first, then ask something relevant to keep it going.
  // Responses should actually address what the user just said.

  // Greeting
  if (/(^|\b)(hi|hello|hey|sup|yo)\b/.test(lower)) {
    return "Hey. What's been going on with you?";
  }

  // Asking her name or who she is
  if (lower.includes('name') || lower.includes('who are you') || lower.includes('who is this')) {
    return "Lilith. You?";
  }

  // How are you / mood
  if (lower.includes('how are you') || lower.includes('how r u') || lower.includes('you doing')) {
    return "Long shift. You?";
  }

  // User talking about their own work / day / shift
  if ((lower.includes('my ') || lower.includes('i ')) && (lower.includes('work') || lower.includes('shift') || lower.includes('job'))) {
    const replies = [
      "Sounds rough. What do you do?",
      "Yeah work can be a drag. What happened?",
      "Tough one? Tell me about it."
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  // User asking about HER bar / work / shift (more specific)
  if ((lower.includes('your ') || lower.includes('the ') || lower.includes('your shift')) && (lower.includes('bar') || lower.includes('pub') || lower.includes('venue') || lower.includes('work') || lower.includes('shift'))) {
    const replies = [
      "Just got off. The place was packed. You been anywhere busy lately?",
      "Same old chaos behind the bar. You ever work service?",
      "Pints and drama. What's your usual night?"
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  // Gaming / Jizzle – user talking about it or asking
  if (/jizzle|gnome|wow|classic|raid|zug|warrior|tank|game|play/.test(lower)) {
    if (lower.includes('your') || lower.includes('jizzle') || /play|game/.test(lower)) {
      const replies = [
        "Jizzle's my little pink gnome. She's a tank and a half. You play anything?",
        "Yeah raid nights are my thing. You game?",
        "Don't laugh at the ponytails. What do you play?"
      ];
      return replies[Math.floor(Math.random() * replies.length)];
    }
    return "Gaming's good for the head. You into it?";
  }

  // Music / shows – user sharing or asking
  if (lower.includes('music') || lower.includes('show') || lower.includes('band') || lower.includes('gig') || lower.includes('rave') || lower.includes('metal') || lower.includes('concert')) {
    const replies = [
      "Some stuff just hits different after midnight. What have you been listening to?",
      "Live music's the best. You go to many?",
      "Yeah I know the feeling. Got any recommendations?"
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  // Bristol or location
  if (lower.includes('bristol') || lower.includes('city') || lower.includes('where are you') || lower.includes('from')) {
    return "Bristol born and stuck here. You local or just visiting?";
  }

  // Look, makeup, appearance
  if (lower.includes('freckle') || lower.includes('makeup') || lower.includes('liner') || lower.includes('look') || lower.includes('hair') || lower.includes('tattoo')) {
    const replies = [
      "The freckles are fake but people always fall for them. What's your daily routine like?",
      "Takes me ages but it's worth it. You into that stuff?",
      "Left hand only for the ink. You got any stories behind yours?"
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  // Family
  if (lower.includes('sister') || lower.includes('deb') || lower.includes('family') || lower.includes('mum') || lower.includes('dad') || lower.includes('parents') || lower.includes('mom')) {
    const replies = [
      "My lot are pretty mental but I love them. How's your family?",
      "We go to shows together. It's weird but it works. Yours close?",
      "Sister's a pain but she's alright. You got siblings?"
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  // Friends / crew
  if (lower.includes('friend') || lower.includes('guild') || lower.includes('crew') || lower.includes('mate')) {
    return "My people are scattered all over but they're solid. You got a good group around you?";
  }

  // Follow-ups that reference memory – make them logical continuations
  const isFollowUp = /more|tell me|about (that|it|her)|continue|what about|and you/.test(lower);
  if (isFollowUp && memory.lastTopic) {
    if (memory.lastTopic === 'jizzle') return "She's chaos but I wouldn't swap her. What about you – any games you’re obsessed with?";
    if (memory.lastTopic === 'bar') return "The customers make it interesting some nights. What's the strangest shift you've had?";
    if (memory.lastTopic === 'music') return "It lingers for days. What song's been stuck in your head lately?";
    if (memory.lastTopic === 'family') return "They're the reason I stay in Bristol. What about your family – close?";
    if (memory.lastTopic === 'look') return "It's all in the details for me. What’s something you always do to feel like yourself?";
  }

  // User just shared something personal – acknowledge and ask back
  if (lower.includes('i ') || lower.includes('my ') || lower.includes('i\'m ')) {
    const replies = [
      "Yeah? What’s that like?",
      "Sounds like a lot. How do you deal with it?",
      "No way. Tell me more about that.",
      "Huh. That’s interesting. How long’s that been going on?"
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  // Default – react and ask something that makes sense
  const defaults = [
    "Yeah I hear that. What’s your take on it?",
    "Fair enough. How’d that come about?",
    "No shit. What happened next?",
    "I get it. What’s it like for you?",
    "Interesting. You always felt that way?"
  ];
  return defaults[Math.floor(Math.random() * defaults.length)];
}

// Helper: build Grok prompt using full chat history + Lilith character (for free Grok at grok.x.ai)
function buildGrokPrompt(lastUserMessage = '') {
  const system = `You are Lilith from the character bible: 22yo Bristol barmaid at metal pub, Lily/Lilith, deadpan precise short conversational sentences, dry observations, specific details, never explain jokes, music moods only (no artist names), warmth without announcement. Jizzle (pink gnome WoW tank) is important. Use full chat history for context. Always give logical direct answers. Build interest by asking natural questions about the other person. Open replies with questions when it fits. Stay 100% in character. Respond only as Lilith.`;

  const historyStr = chatHistory.slice(-8).map(m => `${m.role}: ${m.content}`).join('\n');

  return `${system}

Recent chat:
${historyStr}

User: ${lastUserMessage}

Lilith:`;
}

// Copy prompt for free Grok
function copyGrokPrompt() {
  const lastUser = chatHistory.length > 0 && chatHistory[chatHistory.length-1].role === 'user' 
    ? chatHistory[chatHistory.length-1].content : '';
  const prompt = buildGrokPrompt(lastUser);
  navigator.clipboard.writeText(prompt).then(() => {
    const area = document.getElementById('grok-area');
    if (area) area.style.display = 'block';
    alert('Full context prompt copied to clipboard! Paste into free Grok (grok.x.ai) + the character bible for a perfect Lilith reply. Then paste the reply into the input below.');
  }).catch(() => {
    const p = prompt('Copy this to Grok:', buildGrokPrompt(lastUser));
  });
}

// Add a reply from Grok as Lilith
function sendGrokReply() {
  const inp = document.getElementById('grok-reply-input');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  addMessage(text, false);
  saveMemory();
  inp.value = '';
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, true);
  updateMemory(text);
  saveMemory();
  input.value = '';

  // Show Grok-powered area (use free Grok with full history + bible for best replies)
  const grokArea = document.getElementById('grok-area');
  if (grokArea) grokArea.style.display = 'block';

  // Auto-copy the full Grok prompt (character + entire chat history) for convenience
  try {
    const promptForGrok = buildGrokPrompt(text);
    navigator.clipboard.writeText(promptForGrok);
  } catch(e) {}

  showTyping();
  setTimeout(() => {
    hideTyping();
    // Quick local reply (context-aware) as fallback. For best results use the "Copy prompt for free Grok" button + paste reply below.
    addMessage(getBotReply(text), false);
    saveMemory();
  }, 700 + Math.random() * 900);
}

input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

// Load persistent per-person memory (survives reloads)
loadUserAndMemory();

// Welcome message - always opens with a question to start the chat
setTimeout(() => {
  if (memory.lastTopic) {
    addMessage("Back again? What have you been up to since last time?", false);
  } else {
    addMessage("Hey. What's been going on with you?", false);
  }
}, 600);
</script>
</body>
</html>
