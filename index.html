<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Lilith</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
  .chat-container { max-width: 600px; margin: 40px auto; background: #1a1a1a; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .header { background: #111; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .header img { width: 48px; height: 48px; border-radius: 50%; }
  .header .info { flex: 1; }
  .header .name { font-weight: 600; font-size: 18px; }
  .header .status { color: #22c55e; font-size: 13px; }
  .chat-window { height: 500px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #111; }
  .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15.5px; line-height: 1.45; }
  .user { align-self: flex-end; background: #4a2c2c; border-bottom-right-radius: 4px; }
  .user-id { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  .bot { align-self: flex-start; background: #27272a; border-bottom-left-radius: 4px; }
  .typing { align-self: flex-start; background: #27272a; padding: 12px 16px; border-radius: 18px; font-style: italic; display: none; }
  .input-area { display: flex; padding: 16px; background: #1a1a1a; gap: 10px; }
  input { flex: 1; padding: 14px 18px; border: none; border-radius: 9999px; background: #111; color: #fff; font-size: 16px; }
  button { padding: 0 28px; background: #4a2c2c; color: white; border: none; border-radius: 9999px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <img src="https://picsum.photos/id/1011/48/48" alt="Lilith">
    <div class="info">
      <div class="name">Lilith</div>
      <div class="status">● Bristol • Barmaid &amp; Tank Main</div>
      <div class="user-id">chatting with <span id="user-name" style="cursor: pointer; text-decoration: underline;">...</span></div>
    </div>
  </div>
  <div class="chat-window" id="chat"></div>
  <div class="typing" id="typing">Lilith is typing...</div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Message Lilith..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>

  <div id="status" style="font-size: 11px; color: #666; text-align: center; margin-top: 6px; min-height: 14px;"></div>
</div>

<script>
const c=document.getElementById('chat'),i=document.getElementById('input'),t=document.getElementById('typing');
let u=null,m={recentTopics:[],lastTopic:null},h=[],s=8.5,l=Date.now();
if (window.self !== window.top) { u = 'EmbedUser'; localStorage.setItem('lilith_current_user', u); document.body.style.padding='0'; var cont=document.querySelector('.chat-container'); if(cont){cont.style.maxWidth='100%';cont.style.margin='0';cont.style.height='100%';cont.style.borderRadius='0';cont.style.boxShadow='none';cont.style.display='flex';cont.style.flexDirection='column';} var win=document.getElementById('chat'); if(win){win.style.flex='1';win.style.height='auto';win.style.minHeight='0';} var inp=document.querySelector('.input-area'); if(inp){inp.style.flexShrink='0';} }
function sc(){if(u)localStorage.setItem('lilith_chat_'+u,JSON.stringify(h))}
function ld(){
  u=localStorage.getItem('lilith_current_user');
  if(!u){u=prompt("Lilith remembers each person separately.\nWhat's your name (or nickname)?")||"Guest-"+Math.floor(Math.random()*9000+1000);localStorage.setItem('lilith_current_user',u)}
  m={recentTopics:[],lastTopic:null};

}
function sm(){if(u)localStorage.setItem('lilith_memory_'+u,JSON.stringify(m))}
function cu(){let n=prompt("Switch to a different person (new unique memory):",u||"");if(n&&n.trim()&&n!==u){sm();sc();u=n.trim();localStorage.setItem('lilith_current_user',u);ld();setTimeout(()=>ad("Back again? What's new?",!1),400)}}
function gt(x){let r=x.toLowerCase(),t=[];if(/jizzle|gnome|wow|classic|raid|zug|warrior|tank/.test(r))t.push('jizzle');if(/bar|shift|pub|venue|work|pint/.test(r))t.push('bar');if(/music|show|band|gig|rave|metal/.test(r))t.push('music');if(/bristol/.test(r))t.push('bristol');if(/sister|deb|family|mum|dad|parents/.test(r))t.push('family');if(/freckle|makeup|liner|hair|look/.test(r))t.push('look');if(/friend|guild|crew/.test(r))t.push('friends');return t}
function um(x){let n=gt(x);if(n.length){m.recentTopics=[...m.recentTopics,...n].slice(-4);m.lastTopic=n[n.length-1]}}
function ad(x,y){let r=y?'user':'lilith';if(h.length&&h[h.length-1].role===r&&h[h.length-1].content.trim()===x.trim())return;h.push({role:r,content:x});let d=document.createElement('div');d.className='message '+(y?'user':'bot');d.innerHTML=x+'<div style="font-size:11px;opacity:0.5;margin-top:4px;">'+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight;sc()}
function cs(t,cb){let y=document.getElementById('typing'),p=(t.match(/[^.!?]+[.!?]+/g)||[t]).map(x=>x.trim()).filter(Boolean),g=[];for(let i=0;i<p.length;i+=2)g.push(p.slice(i,i+2).join(' '));let d=0;g.forEach((m,i)=>{let l=m.length,td=Math.max(260,(l/s)*390);setTimeout(()=>{y.style.display='none';ad(m,!1);ss(!0);if(i<g.length-1){y.style.display='block';c.scrollTop=c.scrollHeight}else if(cb)cb()},d+td);d+=td+480})}
let it=null,st=null,ot=null;function ri(){clearTimeout(it);clearTimeout(st);clearTimeout(ot);ss(!0)}function si(){ri();it=setTimeout(()=>{sc();let y=document.getElementById('typing');y.style.display='block';c.scrollTop=c.scrollHeight;fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'',history:h.slice(0),continue:!0,user:u})}).then(r=>r.json()).then(d=>{if(d.reply){let y=document.getElementById('typing');y.style.display='block';c.scrollTop=c.scrollHeight;let last=h[h.length-1];if(last&&last.role==='lilith'&&last.content.trim()===d.reply.trim()){y.style.display='none';ss(!0);return;}cs(d.reply,null)}else if(d.error){y.style.display='none';ad("Something went weird on my end. Try again?",!1);ss(!1)}}).catch(e=>{y.style.display='none';ad("Something went wrong. Please try again.",!1);console.error(e);ss(!1)})},8000);st=setTimeout(()=>{sc();let y=document.getElementById('typing');y.style.display='block';c.scrollTop=c.scrollHeight;setTimeout(()=>{y.style.display='none';ad("Hey, you still there?",!1);ss(!0)},650)},120000);ot=setTimeout(()=>{sc();ad("I'll be back when you respond.",!1);ss(!1)},60000)}function se(){let x=i.value.trim();if(!x)return;ri();ad(x,!0);um(x);sm();let f=i;f.value='';let n=Date.now(),d=(n-l)/1000;if(d>.7&&x.length>2){let v=x.length/d;s=Math.max(3.5,Math.min(18,s*.6+v*.4))}l=n;let y=document.getElementById('typing');y.style.display='block';c.scrollTop=c.scrollHeight;fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:x,history:h.slice(0,-1),user:u})}).then(r=>r.json()).then(d=>{if(d.reply){let y=document.getElementById('typing');y.style.display='block';c.scrollTop=c.scrollHeight;let last=h[h.length-1];if(last&&last.role==='lilith'&&last.content.trim()===d.reply.trim()){y.style.display='none';ss(!0);return;}cs(d.reply,si)}else if(d.error){y.style.display='none';ad("Something went weird on my end. Try again?",!1);ss(!1)}}).catch(e=>{y.style.display='none';ad("Something went wrong. Please try again.",!1);console.error(e);ss(!1)})}function ss(o){let e=document.getElementById('status');if(e){let c=o?'#22c55e':'#ef4444',t=o?'Chat is Online':'Chat is Offline';e.innerHTML=`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:4px;"></span>${t}`}}function ck(){fetch('/').then(()=>ss(!0)).catch(()=>ss(!1))}input.addEventListener('keypress',e=>{if(e.key==='Enter')se()});ld();if(h.length===0)setTimeout(()=>{ad("Hey. What's been going on with you?",!1);si()},600);ss(!1);ck();setInterval(ck,10000)</script>
</body>
</html>
