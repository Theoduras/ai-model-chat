<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Not deferred: theme.js sets data-theme before first paint, otherwise the
       page flashes dark for a user who chose light. -->
  <script src="/js/theme.js"></script>
  <script src="/js/devnav.js" defer></script>
</head>
<body class="page-chat">

<div class="chat-shell">

<aside class="persona-rail" id="persona-rail" aria-label="Choose a model">
  <div class="persona-rail-header">Models</div>
  <div class="persona-rail-list" id="rail-list"></div>
</aside>

<div class="chat-container">

  <header class="header">
    <div class="header-avatar-wrap" onclick="openProfile()" style="cursor:pointer;" title="View profile">
      <img id="header-avatar" src="https://picsum.photos/id/1011/48/48" alt="">
      <div class="online-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-name" id="header-name">…</div>
      <div class="header-meta" id="header-status"></div>
    </div>
    <div class="header-right">
      <div class="conn-indicator">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-text">…</span>
      </div>
      <div class="user-chip" id="user-name" title="Click to switch user">…</div>
    </div>
  </header>

  <main class="chat-window" id="chat" role="log" aria-live="polite" aria-label="Chat messages">
    <div class="typing-row" id="typing-row" aria-hidden="true">
      <img class="msg-av" id="typing-av" src="https://picsum.photos/id/1011/48/48" alt="">
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  </main>

  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Send a message…" autocomplete="off" enterkeyhint="send" aria-label="Message input">
    </div>
    <button class="send-btn" onclick="se()" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="name-gate hidden" id="name-gate">
    <div class="name-gate-card">
      <img class="name-gate-avatar" id="gate-avatar" src="https://picsum.photos/id/1011/96/96" alt="">
      <div class="name-gate-title" id="gate-title">Before we start…</div>
      <div class="name-gate-sub" id="gate-sub">What should I call you?</div>
      <input type="text" id="name-input" placeholder="Your name or nickname" maxlength="40" autocomplete="off" enterkeyhint="go" aria-label="Your name">
      <button class="name-gate-btn" id="gate-btn" onclick="submitName()">Continue</button>
    </div>
  </div>

</div>

</div>

<div class="profile-modal" id="profile-modal" onclick="if(event.target===this)closeProfile()">
  <div class="profile-card">
    <button class="profile-close" onclick="closeProfile()" aria-label="Close">✕</button>
    <div class="profile-gallery" id="profile-gallery">
      <img id="profile-photo" src="" alt="" onclick="toggleProfileFullscreen()">
      <button class="pg-nav prev" id="pg-prev" onclick="profileStep(-1)" aria-label="Previous">‹</button>
      <button class="pg-nav next" id="pg-next" onclick="profileStep(1)" aria-label="Next">›</button>
      <div class="pg-dots" id="pg-dots"></div>
    </div>
    <div class="profile-info">
      <div class="profile-name-row">
        <span class="profile-name" id="profile-name"></span>
        <span class="profile-age" id="profile-age"></span>
        <span class="profile-verified" title="Verified">✓</span>
      </div>
      <div class="profile-loc" id="profile-loc"></div>
      <div class="profile-bio" id="profile-bio"></div>
      <div class="profile-interests" id="profile-interests"></div>
    </div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inp = document.getElementById('input');
const typingRow = document.getElementById('typing-row');
let u = null, m = { recentTopics: [], lastTopic: null }, h = [], s = 3.5, l = Date.now(), avatarUrl = null, personaName = '…';
let persona = new URLSearchParams(location.search).get('persona') || 'lilly';
let PFX = 'persona_' + persona + '_';

if (window.self !== window.top) { document.body.classList.add('embed'); }

function applyPersonaConfig(cfg) {
  avatarUrl = null;
  personaName = cfg.name || persona;
  document.title = 'Chat with ' + personaName;
  document.getElementById('header-name').textContent = personaName;
  document.getElementById('header-avatar').alt = personaName;
  if (cfg.avatar) {
    avatarUrl = '/api/personas/' + persona + '/avatar';
    document.getElementById('header-avatar').src = avatarUrl;
    document.getElementById('typing-av').src = avatarUrl;
  } else {
    document.getElementById('header-avatar').src = 'https://picsum.photos/id/1011/48/48';
    document.getElementById('typing-av').src = 'https://picsum.photos/id/1011/48/48';
  }
  const parts = [];
  if (cfg.location && !cfg.mirror_location) parts.push(cfg.location);
  if (cfg.age) parts.push(cfg.age);
  document.getElementById('header-status').textContent = parts.join(' · ');
  inp.placeholder = 'Message ' + personaName + '…';
}

let personaCfg = {}, profileImages = [], profileIdx = 0;

// Delivery pacing, sent back by /chat from the creator's settings. These are
// the fallbacks used before the first reply lands.
let pacing = { reply: { base: 1800, jitter: 3500, per_char: 35 },
               typing: { base: 900, per_char: 45, max: 7000 } };
// Floored: she never starts typing the instant the message lands, she reads it first.
function replyDelay(text) {
  const r = pacing.reply || {};
  return Math.max(800, (r.base || 0) + Math.random() * (r.jitter || 0)
       + Math.min((text || '').length * (r.per_char || 0), 3500));
}
function typingDelay(text) {
  const t = pacing.typing || {};
  return Math.min((t.base || 0) + (text || '').length * (t.per_char || 0), t.max || 9000);
}
// Beat between finishing one bubble and starting to type the next one.
function interChunkPause() { return 700 + Math.random() * 1300; }

function loadPersonaConfig() {
  return fetch('/api/personas/' + persona).then(r => r.ok ? r.json() : null).then(d => {
    personaCfg = (d && d.config) || {};
    if (d && d.pacing) pacing = d.pacing;
    applyPersonaConfig(personaCfg);
    return fetch('/api/personas/' + persona + '/images').then(r => r.ok ? r.json() : { images: [] }).then(g => {
      profileImages = Array.isArray(g.images) ? g.images : [];
      if (profileImages.length) {
        avatarUrl = profileImages[0];
        document.getElementById('header-avatar').src = avatarUrl;
        document.getElementById('typing-av').src = avatarUrl;
      }
    }).catch(() => {});
  }).catch(() => {});
}

function openProfile() {
  document.getElementById('profile-name').textContent = personaName || personaCfg.name || '';
  document.getElementById('profile-age').textContent = personaCfg.age ? ', ' + personaCfg.age : '';
  document.getElementById('profile-loc').textContent =
    (personaCfg.location && !personaCfg.mirror_location) ? '📍 ' + personaCfg.location : '';
  document.getElementById('profile-bio').textContent = personaCfg.backstory || '';
  const interests = (personaCfg.interests || '').split(',').map(s => s.trim()).filter(Boolean);
  document.getElementById('profile-interests').innerHTML =
    interests.map(t => '<span class="interest-chip">' + t.replace(/</g, '&lt;') + '</span>').join('');
  profileIdx = 0;
  renderProfileGallery();
  document.getElementById('profile-modal').classList.add('open');
}

function profileGalleryImgs() {
  return profileImages.length ? profileImages : [avatarUrl || 'https://picsum.photos/id/1011/600/800'];
}

function renderProfileGallery() {
  const imgs = profileGalleryImgs();
  if (profileIdx >= imgs.length) profileIdx = 0;
  if (profileIdx < 0) profileIdx = imgs.length - 1;
  document.getElementById('profile-photo').src = imgs[profileIdx];
  const multi = imgs.length > 1;
  document.getElementById('pg-prev').style.display = multi ? 'flex' : 'none';
  document.getElementById('pg-next').style.display = multi ? 'flex' : 'none';
  document.getElementById('pg-dots').innerHTML = multi
    ? imgs.map((_, i) => '<span class="pg-dot' + (i === profileIdx ? ' active' : '') + '"></span>').join('')
    : '';
}

function profileStep(dir) { profileIdx += dir; renderProfileGallery(); }
function closeProfile() {
  document.getElementById('profile-modal').classList.remove('open');
  document.querySelector('.profile-card').classList.remove('fs');
}
function toggleProfileFullscreen() { document.querySelector('.profile-card').classList.toggle('fs'); }

function renderRail(list) {
  const railList = document.getElementById('rail-list');
  railList.innerHTML = '';
  list.forEach(p => {
    const cfg = p.config || {};
    const item = document.createElement('div');
    item.className = 'rail-item' + (p.slug === persona ? ' active' : '');
    item.id = 'rail-' + p.slug;
    item.onclick = () => switchPersona(p.slug);
    const name = cfg.name || p.name || p.slug;
    const av = p.avatar
      ? '<img class="rail-avatar" src="/api/personas/' + p.slug + '/avatar" alt="">'
      : '<div class="rail-avatar">' + name.slice(0,2).toUpperCase() + '</div>';
    const meta = [cfg.location, cfg.age].filter(Boolean).join(' · ');
    item.innerHTML = av +
      '<div class="rail-info"><div class="rail-name">' + name + '</div>' +
      (meta ? '<div class="rail-meta">' + meta + '</div>' : '') + '</div>';
    railList.appendChild(item);
  });
}

function loadPersonaList() {
  return fetch('/api/personas').then(r => r.ok ? r.json() : []).then(list => {
    renderRail(Array.isArray(list) ? list : []);
  }).catch(() => {});
}

async function switchPersona(slug) {
  if (slug === persona) return;
  ri();
  sm(); sc();
  const prevU = u;
  persona = slug;
  PFX = 'persona_' + persona + '_';
  document.querySelectorAll('.rail-item').forEach(el => el.classList.remove('active'));
  const active = document.getElementById('rail-' + slug);
  if (active) active.classList.add('active');
  await loadPersonaConfig();
  ld();
  if (!u && prevU) { u = prevU; localStorage.setItem(PFX + 'user', u); ld(); }
  if (!u) { showNameGate(); return; }
  greet();
}

loadPersonaConfig();
loadPersonaList();

function chatBody(extra) {
  const sp = localStorage.getItem('persona_prompt_' + persona);
  return JSON.stringify({ ...extra, user: u, persona, ...(sp ? { system_prompt: sp } : {}) });
}

function sc() { if (u) localStorage.setItem(PFX + 'chat_' + u, JSON.stringify(h)); }
function sm() { if (u) localStorage.setItem(PFX + 'mem_' + u, JSON.stringify(m)); }

function ld() {
  u = localStorage.getItem(PFX + 'user');
  if (!isRealName(u)) u = null;   // ignore legacy / auto-generated placeholders
  m = { recentTopics: [], lastTopic: null };
  const sv = localStorage.getItem(PFX + 'mem_' + u);
  if (sv) try { m = { ...m, ...JSON.parse(sv) }; } catch (e) {}
  h = [];
  const ch = localStorage.getItem(PFX + 'chat_' + u);
  if (ch) try { h = JSON.parse(ch); } catch (e) {}
  const el = document.getElementById('user-name');
  if (el) { el.textContent = u || 'Guest'; el.onclick = cu; el.title = 'Switch user'; }
  chatEl.innerHTML = '';
  chatEl.appendChild(typingRow);
  h.forEach(x => { insertMsg(x.content, x.role === 'user', x.photo); });
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showNameGate(opts) {
  opts = opts || {};
  const gate = document.getElementById('name-gate');
  const input = document.getElementById('name-input');
  document.getElementById('gate-avatar').src = avatarUrl || 'https://picsum.photos/id/1011/96/96';
  document.getElementById('gate-title').textContent = opts.title || 'Before we start…';
  document.getElementById('gate-sub').textContent = opts.sub ||
    (personaName && personaName !== '…' ? "What should " + personaName + " call you?" : 'What should I call you?');
  document.getElementById('gate-btn').textContent = opts.btn || 'Continue';
  input.value = opts.prefill || '';
  gate.classList.remove('hidden');
  setTimeout(() => input.focus(), 60);
}

function submitName() {
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const prev = u;
  document.getElementById('name-gate').classList.add('hidden');
  if (prev && name !== prev) { sm(); sc(); }
  u = name;
  localStorage.setItem(PFX + 'user', u);
  ld();
  // "you're back" only when this name actually has a conversation stored.
  if (h.length === 0) {
    greet();
  } else if (prev && prev !== name) {
    setTimeout(() => addMsg("hey, you're back", false), 400);
  }
}

function cu() { showNameGate({ prefill: u || '', title: 'Switch user', sub: 'Enter a different name', btn: 'Switch' }); }

function ts() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

// Bubble text is model output, so it goes in escaped. Line breaks become <br>
// and a bare URL becomes a link — the CTA arrives as "label → https://…".
function bubbleHTML(text) {
  const esc = (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(/https?:\/\/[^\s<]+/g,
      u => '<a class="bubble-link" href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>')
    .replace(/\n/g, '<br>');
}

function insertMsg(text, isUser, photo) {
  const prev = chatEl.lastElementChild;
  const prevIsUser = prev && prev.classList.contains('user');
  const prevIsBot  = prev && prev.classList.contains('bot');
  const cont = (isUser && prevIsUser) || (!isUser && prevIsBot);
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isUser ? 'user' : 'bot') + (cont ? ' cont' : '');
  if (!isUser) {
    if (avatarUrl && !cont) {
      const av = document.createElement('img');
      av.className = 'msg-av'; av.src = avatarUrl; av.alt = personaName;
      row.appendChild(av);
    } else {
      const sp = document.createElement('div');
      sp.className = 'msg-av-spacer';
      row.appendChild(sp);
    }
  }
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = (photo ? '<img class="bubble-photo" src="' + photo + '" alt="">' : '')
    + bubbleHTML(text) + '<span class="bubble-time">' + ts() + '</span>';
  row.appendChild(bub);
  chatEl.insertBefore(row, typingRow);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

function addMsg(text, isUser, photo) {
  const r = isUser ? 'user' : 'bot';
  if (h.length && h[h.length - 1].role === r && h[h.length - 1].content.trim() === text.trim() && !photo) return;
  h.push({ role: r, content: text, photo: photo || null });
  insertMsg(text, isUser, photo);
  sc();
  if (!isUser && window.parent !== window) {
    try { window.parent.postMessage({ type: 'new_message' }, '*'); } catch(e) {}
  }
}

function showTyping(on) {
  typingRow.style.display = on ? 'flex' : 'none';
  if (on) chatEl.scrollTop = chatEl.scrollHeight;
}

function um(x) {
  const r = x.toLowerCase();
  const t = [];
  if (/jizzle|gnome|wow|classic|raid|zug|warrior|tank/.test(r)) t.push('gaming');
  if (/bar|shift|pub|venue|work|pint/.test(r)) t.push('work');
  if (/music|show|band|gig|rave|metal/.test(r)) t.push('music');
  if (t.length) { m.recentTopics = [...m.recentTopics, ...t].slice(-4); m.lastTopic = t[t.length - 1]; }
}

// Split a long reply into two bubbles at a sentence boundary. Both halves are
// slices of the original string, so nothing can be dropped and the blank line
// before the CTA survives. A dot inside a URL is not a sentence boundary —
// "onlyfans.com/miss.andrea" is one link, not three sentences.
function splitChunks(text) {
  if (text.length < 120) return [text];
  const urls = [];
  const re = /https?:\/\/\S+/g;
  let m;
  while ((m = re.exec(text))) urls.push([m.index, m.index + m[0].length]);
  const inUrl = i => urls.some(u => i >= u[0] && i < u[1]);
  const bounds = [];
  for (let i = 0; i < text.length; i++) {
    if ('.!?\u2026'.indexOf(text[i]) < 0 || inUrl(i)) continue;
    let j = i;
    while (j + 1 < text.length && '.!?\u2026'.indexOf(text[j + 1]) >= 0) j++;
    if (j + 1 < text.length && /\s/.test(text[j + 1])) bounds.push(j + 1);
    i = j;
  }
  if (bounds.length < 2) return [text];
  const cut = bounds[Math.ceil((bounds.length + 1) / 2) - 1];
  return [text.slice(0, cut).trim(), text.slice(cut).trim()].filter(Boolean);
}

function deliverChunks(chunks, idx, onDone, photo) {
  if (idx >= chunks.length) { if (onDone) onDone(); return; }
  showTyping(false);
  const last = idx + 1 >= chunks.length;
  addMsg(chunks[idx], false, last ? photo : null);
  if (!last) {
    const next = chunks[idx + 1];
    setTimeout(() => {
      showTyping(true);
      setTimeout(() => deliverChunks(chunks, idx + 1, onDone, photo), typingDelay(next));
    }, interChunkPause());
  } else {
    if (onDone) onDone();
  }
}

// The bubble may already have been running while the reply was in flight; only
// hold it for whatever is left of the time that first chunk should take to type.
function cs(text, cb, photo, typingSince) {
  ss(true);
  const chunks = splitChunks(text);
  const elapsed = typingSince ? Date.now() - typingSince : 0;
  const hold = Math.max(0, typingDelay(chunks[0]) - elapsed);
  setTimeout(() => deliverChunks(chunks, 0, cb, photo), hold);
}

let st = null, ot = null;
function ri() { clearTimeout(st); clearTimeout(ot); }

function si() {
  ri();
  st = setTimeout(() => {
    const delay = 2000 + Math.random() * 2000;
    showTyping(true);
    setTimeout(() => { showTyping(false); addMsg('still there?', false); ss(true); }, delay);
  }, 300000);
  ot = setTimeout(() => { addMsg("i'll catch you later", false); ss(false); }, 480000);
}

// Queue of user messages awaiting a reply. Multiple quick messages are
// answered one at a time, in order — as if she reads and replies to the
// first before noticing the next.
let msgQueue = [], processing = false;

function se() {
  const x = inp.value.trim();
  if (!x) return;
  insertMsg(x, true);   // show immediately; committed to history when processed
  inp.value = '';
  const n = Date.now(), d = (n - l) / 1000;
  if (d > 0.7 && x.length > 2) { const v = x.length / d; s = Math.max(3.5, Math.min(18, s * 0.6 + v * 0.4)); }
  l = n;
  msgQueue.push(x);
  if (!processing) processQueue();
}

function processQueue() {
  if (!msgQueue.length) { processing = false; si(); return; }
  processing = true;
  ri();
  const x = msgQueue.shift();
  um(x);
  const histSnapshot = h.slice();   // only turns answered so far — not later queued messages
  const initialDelay = replyDelay(x);
  let typingSince = 0;
  setTimeout(() => {
    showTyping(true);
    typingSince = Date.now();
    fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: chatBody({ message: x, history: histSnapshot }) })
      .then(r => r.json()).then(d => {
        if (d.pacing) pacing = d.pacing;
        h.push({ role: 'user', content: x }); sm();
        if (d.reply) {
          const recentBot = h.slice(-6).filter(m => m.role === 'bot').map(m => m.content.trim().toLowerCase());
          if (recentBot.includes(d.reply.trim().toLowerCase())) { showTyping(false); sc(); ss(true); processQueue(); return; }
          cs(d.reply, () => { sc(); processQueue(); }, d.photo, typingSince);
        } else {
          showTyping(false); addMsg('something went weird on my end. try again?', false); sc(); ss(false); processQueue();
        }
      }).catch(() => {
        showTyping(false); h.push({ role: 'user', content: x }); addMsg('something went wrong. please try again.', false); sc(); ss(false); processQueue();
      });
  }, initialDelay);
}

function ss(ok) {
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  if (dot) dot.className = 'conn-dot ' + (ok ? 'ok' : 'err');
  if (txt) txt.textContent = ok ? 'Online' : 'Offline';
}

function ck() { fetch('/').then(() => ss(true)).catch(() => ss(false)); }

function greet() {
  if (h.length !== 0) return;
  const greetDelay = replyDelay('');
  let typingSince = 0;
  setTimeout(() => {
    showTyping(true);
    typingSince = Date.now();
    fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: chatBody({ message: '__greeting__', history: [] }) })
      .then(r => r.json()).then(d => { if (d.pacing) pacing = d.pacing; if (d.reply) { cs(d.reply, si, d.photo, typingSince); } else { showTyping(false); addMsg('hey', false); si(); } })
      .catch(() => { showTyping(false); addMsg('hey', false); si(); });
  }, greetDelay);
}

inp.addEventListener('keypress', e => { if (e.key === 'Enter') se(); });
document.getElementById('name-input').addEventListener('keypress', e => { if (e.key === 'Enter') submitName(); });

function isRealName(n) {
  // Ignore legacy auto-set placeholders so the name screen still appears.
  return !!(n && n.trim() && n !== 'EmbedUser' && !/^Guest-\d+$/i.test(n.trim()));
}

function hasName() {
  return isRealName(localStorage.getItem(PFX + 'user'));
}

if (hasName()) {
  ld();
  greet();
} else {
  showNameGate();
}
ss(false); ck(); setInterval(ck, 10000);
if (location.hash === '#profile') setTimeout(openProfile, 1200);
</script>

</body>
</html>
