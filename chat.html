<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Lilith</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
  .chat-container { max-width: 600px; margin: 40px auto; background: #1a1a1a; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .header { background: #111; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .header img { width: 48px; height: 48px; border-radius: 50%; }
  .header .info { flex: 1; }
  .header .name { font-weight: 600; font-size: 18px; }
  .header .status { color: #22c55e; font-size: 13px; }
  .chat-window { height: 500px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #111; }
  .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15.5px; line-height: 1.45; }
  .user { align-self: flex-end; background: #4a2c2c; border-bottom-right-radius: 4px; }
  .user-id { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  .bot { align-self: flex-start; background: #27272a; border-bottom-left-radius: 4px; }
  .bot-row { display:flex; align-items:flex-end; gap:8px; align-self:flex-start; max-width:85%; }
  .bot-row .bot-av { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#27272a; }
  .bot-row .message { max-width:100%; }
  .typing { align-self: flex-start; background: #27272a; padding: 12px 16px; border-radius: 18px; font-style: italic; display: none; }
  .input-area { display: flex; padding: 16px; background: #1a1a1a; gap: 10px; }
  input { flex: 1; padding: 14px 18px; border: none; border-radius: 9999px; background: #111; color: #fff; font-size: 16px; }
  button { padding: 0 28px; background: #4a2c2c; color: white; border: none; border-radius: 9999px; font-weight: 600; cursor: pointer; }

  @media (max-width: 768px) {
    body { padding: 0; }
    .chat-container {
      max-width: 100%;
      margin: 0;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }
    .chat-window {
      flex: 1;
      height: auto;
      min-height: 0;
      overflow-y: auto;
    }
    .input-area { flex-shrink: 0; }
    .header { padding: 12px 16px; }
  }
</style>
</head>
<body>
<div class="chat-container">

  <div class="typing" id="typing">Lilith is typing...</div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Message Lilith..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>

</div>

<script>

ss(!1)},60000)}function se(){let x=i.value.trim();if(!x)return;ri();autoCount=0;ad(x,!0);um(x);sm();let f=i;f.value='';let n=Date.now(),d=(n-l)/1000;if(d>.7&&x.length>2){let v=x.length/d;s=Math.max(3.5,Math.min(18,s*.6+v*.4))}l=n;let y=document.getElementById('typing');y.style.display='block';c.scrollTop=c.scrollHeight;fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:x,history:h.slice(0,-1),user:u})}).then(r=>r.json()).then(d=>{if(d.reply){let y=document.getElementById('typing');y.style.display='block';c.scrollTop=c.scrollHeight;let last=h[h.length-1];if(last&&last.role==='lilith'&&last.content.trim()===d.reply.trim()){y.style.display='none';ss(!0);return;}let delay=2500+Math.random()*5000;setTimeout(()=>{cs(d.reply,si)},delay)}else if(d.error){y.style.display='none';ad("something went weird on my end. try again?",!1);ss(!1)}}).catch(e=>{y.style.display='none';ad("something went wrong. please try again.",!1);console.error(e);ss(!1)})}function ss(o){let e=document.getElementById('status');if(e){let c=o?'#22c55e':'#ef4444',t=o?'Chat is Online':'Chat is Offline';e.innerHTML=`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:4px;"></span>${t}`}}function ck(){fetch('/').then(()=>ss(!0)).catch(()=>ss(!1))}input.addEventListener('keypress',e=>{if(e.key==='Enter')se()});ld();if(h.length===0)setTimeout(()=>{ad("heeyyy stranger",!1);si()},600);ss(!1);ck();setInterval(ck,10000)</script>
