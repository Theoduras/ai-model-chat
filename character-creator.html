<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Character Creator</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/devnav.js" defer></script>
  <script src="/js/site-nav.js" defer></script>
  <script src="/js/character-visuals.js?v=2"></script>
  <script src="/js/page-wizard.js"></script>
  <script>
    if (window.self === window.top) location.replace('/dashboard?open=' + encodeURIComponent(location.pathname + location.search));
    else document.documentElement.classList.add('in-workspace');
  </script>
  <style>
    .in-workspace body > header { display: none; }
    .cc-scroll { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 28px 32px 48px; }
    .cc { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .cc-top h1 { font-family: var(--display); font-size: 1.4rem; margin: 0; }
    .cc-mode { margin-left: auto; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
    #cc-side .btn-back-gallery { display: block; margin-bottom: 18px; }
    .cc-side-meta { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 10px; font-size: .73rem; color: var(--text-muted); }
    .cc-side-meta b { color: var(--text-2); font-weight: 600; }
    .cc-side-meta .btn { width: 100%; justify-content: center; }
    .rail-sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 8px 18px; }
    .ob-rsub { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font: inherit; font-size: .78rem; text-align: left; cursor: pointer; }
    .ob-rsub:hover { background: var(--surface); }
    .ob-rsub.locked { opacity: .55; }
    .ob-rsub-i { width: 14px; text-align: center; font-size: .7rem; flex-shrink: 0; color: var(--text-muted); }
    .ob-rsub.approved .ob-rsub-i { color: var(--ok); }
    .ob-rsub.review .ob-rsub-i, .ob-rsub.generating .ob-rsub-i, .ob-rsub.outdated .ob-rsub-i { color: var(--warn); }
    .cc-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .cc-card h2 { font-family: var(--display); font-size: 1.1rem; margin: 0; text-wrap: balance; }
    .cc-card p { margin: 0; color: var(--text-muted); line-height: 1.5; }
    .cc-msg { font-size: .85rem; color: var(--err); min-height: 1em; }
    .cc-msg.ok { color: var(--ok); }
    .cc-msg:empty { display: none; }

    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .choice { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; color: var(--text); }
    .choice b { font-family: var(--display); }
    .choice span { color: var(--text-muted); font-size: .85rem; line-height: 1.4; }
    .choice:hover, .choice:focus-visible, .choice.sel { border-color: var(--accent); background: var(--accent-soft); }

    body.page-dashboard .cc label.fl, .fl { font-size: .8rem; font-weight: 600; color: var(--text); display: flex; flex-direction: column; gap: 6px; margin: 0; }
    .cc input[type=text], .cc select { width: 100%; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .fld { display: flex; flex-direction: column; gap: 8px; }
    .fld > p { font-size: .85rem; }

    .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
    .opts.big { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .opts.txt { display: flex; flex-wrap: wrap; }
    .opt { all: unset; box-sizing: border-box; position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-align: center; font-size: .72rem; line-height: 1.2; color: var(--text); min-width: 0; }
    .opts.txt .opt { padding: 6px 12px; border-radius: 99px; font-size: .8rem; }
    .opt svg { width: 48px; height: 48px; color: var(--text-muted); }
    .opts.big .opt svg { width: 72px; height: 72px; }
    .opt small { color: var(--text-muted); font-size: .68rem; }
    .opt.sel, .opt:focus-visible, .opt:focus-within { border-color: var(--accent); background: var(--accent-soft); }
    .opt input[type=color] { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .opt .plus { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--text-muted); }

    .info { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-size: .85rem; }
    .info summary { cursor: pointer; font-weight: 600; color: var(--accent); }
    .info dl { margin: 10px 0 0; display: grid; gap: 4px; }
    .info dt { font-weight: 600; }
    .info dt.cur::after { content: ' (selected)'; color: var(--accent); font-weight: 500; }
    .info dd { margin: 0 0 6px; color: var(--text-muted); line-height: 1.45; }
    .info .fld { margin-top: 12px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .tile { all: unset; box-sizing: border-box; cursor: pointer; aspect-ratio: 3/4; max-width: 100%; border-radius: 10px; border: 2px solid transparent; position: relative; overflow: hidden; background: var(--surface); display: block; }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile.sel { border-color: var(--accent); }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tile .cap { position: absolute; inset: auto 0 0 0; padding: 6px 8px; font-size: .75rem; background: #0009; color: #fff; }
    .tile.sk { cursor: default; }
    .tile.sk .cap { background: none; }
    .looks { display: flex; gap: 6px; flex-wrap: wrap; }
    .looks .tile { width: 78px; }
    .looks .tile:has(> svg) { display: flex; flex-direction: column; align-items: center; padding: 6px 4px; aspect-ratio: auto; height: 104px; }
    .looks .tile > svg { flex: 1; width: 100%; min-height: 0; }
    .looks .tile:has(> svg) .cap { position: static; background: none; color: var(--text-2); padding: 2px 0 0; text-align: center; line-height: 1.2; }
    .drop { border: 1.5px dashed var(--border); border-radius: 10px; aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; color: var(--text-muted); font-size: .85rem; padding: 8px; cursor: pointer; position: relative; overflow: hidden; background: var(--surface); }
    .drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .drop.done { border-style: solid; border-color: var(--ok); }
    .drop .dl { position: relative; z-index: 1; background: #000a; color: #fff; padding: 2px 8px; border-radius: 99px; font-size: .75rem; }
    .drop input { display: none; }
    .attest { display: flex !important; flex-direction: row !important; gap: 8px; align-items: flex-start; font-size: .8rem !important; font-weight: 500 !important; color: var(--text-2) !important; }

    .views { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .views.adv { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .view { display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); min-width: 0; }
    .view .th { width: 100%; aspect-ratio: 3/4; border-radius: 8px; background: var(--border); overflow: hidden; }
    .view .th img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
    .view .th.zoom { cursor: zoom-in; }
    .view .th.zoom:hover img { transform: scale(1.03); }
    .view .th.zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .view .nm { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    .view .nm small { display: block; font-weight: 400; font-size: .75rem; color: var(--text-muted); margin-top: 2px; }
    .view .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: auto; }
    .view .acts .gen { flex: 1; min-width: 0; }
    .stage { display: flex; flex-direction: column; gap: 8px; }
    .stage.locked { opacity: .55; }
    .sh { display: flex; flex-direction: column; gap: 2px; }
    .sh small { color: var(--text-muted); }
    .pill { font-size: .7rem; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
    .pill.ok { color: var(--ok); border-color: var(--ok); }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--border); }
    .gen { display: flex; align-items: center; gap: 8px; min-width: 150px; }
    .tile .gen, .tile .gbar { min-width: 0; }
    .gbar { flex: 1; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; min-width: 80px; }
    .gbar i { display: block; height: 100%; background: var(--accent); transition: width .5s linear; }
    .gt { font-size: .75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tile .gt { color: #fff; }
    .genbox { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .genbox span { color: var(--text-muted); font-size: .85rem; }

    .pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .pr small { color: var(--text-muted); font-size: .75rem; }
    .mini { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .mini .tile { width: 64px; border-radius: 8px; }
    .wear { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .up { position: relative; overflow: hidden; }
    .up input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .chipf { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; padding: 4px 8px; border: 1px solid var(--accent); border-radius: 99px; color: var(--accent); max-width: 180px; }
    .chipf button { all: unset; cursor: pointer; }
    .cc .btn { padding: 9px 16px; font-size: .85rem; }
    .cc .btn-sm { padding: 6px 10px; font-size: .78rem; }
    .cc .btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; animation: none; }
    .nav { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
    .nav > span { display: flex; gap: 8px; flex-wrap: wrap; }
    .cc select.qty { width: 64px; min-width: 64px; padding: 6px 26px 6px 10px; background-position: right 8px center; font-size: 13px; }

    .lb { position: fixed; inset: 0; z-index: 500; background: #000d; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .lb[hidden] { display: none; }
    .lbi { width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 12px; }
    .lbh { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #fff; }
    .lbwrap { display: flex; align-items: center; gap: 8px; min-height: 0; }
    .lbnav { all: unset; cursor: pointer; flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: #fff2; color: #fff; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; }
    .lbnav:disabled { opacity: .25; cursor: default; }
    .lbnav:focus-visible { outline: 2px solid var(--accent); }
    .lbimg { flex: 1; min-width: 0; display: flex; justify-content: center; }
    .lbimg img { max-width: 100%; max-height: 80vh; border-radius: 12px; display: block; }
    .lba { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
    .lb .btn-ghost { color: #fff; border-color: #fff4; }
    @media (prefers-reduced-motion: no-preference) { .tile.sk, .view .th.run { animation: ccp 1s infinite alternate; } }
    @keyframes ccp { to { opacity: .45; } }
    @media (max-width: 900px) {
      .cc-scroll { padding: 18px 16px 40px; }
      #cc-side:not([hidden]) { display: block; width: auto; border-right: 0; border-bottom: 1px solid var(--border-soft); padding: 12px 16px 10px; overflow: visible; }
      #cc-side .btn-back-gallery { margin-bottom: 8px; }
      #cc-side .ob-rail-h, #cc-side .ob-rail-p, #cc-side .ob-rsteps, #cc-side .cc-side-meta { display: none; }
      #cc-side .ob-mini { margin-bottom: 10px; }
      #cc-side .pw-stages { display: flex; gap: 14px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      #cc-side .ob-rstage { margin: 0; flex-shrink: 0; }
      #cc-side .ob-rstage-t { margin: 0; white-space: nowrap; }
    }
    @media (max-width: 520px) { .cc-card { padding: 16px; } .views { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .views.adv { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="page-dashboard">
<header>
  <h1>Character Creator (new)</h1>
  <nav data-site-nav="inline" class="sn-links sn-inline"></nav>
</header>
<div class="ob-split">
<nav class="ob-rail" id="cc-side" aria-label="Character steps" hidden></nav>
<main class="cc-scroll">
  <div class="cc">
    <div class="cc-top"><h1 id="cc-title">New character</h1><span class="cc-mode" id="cc-mode"></span></div>
    <div class="cc-card" id="cc-card"></div>
    <div class="cc-msg" id="cc-msg" role="status"></div>
  </div>
</main>
</div>
<div class="lb" id="lb" hidden>
  <div class="lbi">
    <div class="lbh"><b id="lbt"></b><button type="button" class="btn btn-ghost btn-sm" id="lbx" aria-label="Close">✕ Close</button></div>
    <div class="lbwrap"><button type="button" class="lbnav" id="lbp" aria-label="Previous">‹</button><div class="lbimg" id="lbimg"></div><button type="button" class="lbnav" id="lbn" aria-label="Next">›</button></div>
    <div class="lba" id="lba"></div>
  </div>
</div>
<script src="/js/character-creator.js"></script>
</body>
</html>
